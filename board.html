<style>

    const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(c[1] * r) * Math.sin(dLo / 2) ** 2; km += Math.round(2 * 6371 * Math.asin(Math.sqrt(h))); } return km; }); })();
  const EJ_GOAL = EJ_KM[EJ_KM.length - 1] * 1000;   // 한 바퀴 = 이만큼 회
  const EJ_IMG = (/\/beta\//.test(location.pathname) ? '../' : '') + 'img/';
  function earthHTML(t, title, prev){
    const laps = Math.floor(t / EJ_GOAL), cur = t - laps * EJ_GOAL, pct = Math.min(100, cur / EJ_GOAL * 100), goalKm = EJ_KM[EJ_KM.length - 1];
    let ai = 0; EJ.forEach(function(c, i){ if (cur >= EJ_KM[i] * 1000) ai = i; });
    const ni = Math.min(EJ.length - 1, ai + 1), onSea = !!(EJ[ni][3] && cur < EJ_KM[ni] * 1000);
    const P = function(km){ return (km / goalKm * 100).toFixed(3) + '%'; };
    const runs = [];
    EJ.forEach(function(c, i){ if (!i) return; const r = runs[runs.length - 1]; if (r && r[0] === c[4]) r[2] = EJ_KM[i]; else runs.push([c[4], EJ_KM[i - 1], EJ_KM[i]]); });
    const land = runs.map(function(r, i){ const L = i ? 40 : 44, R = i === runs.length - 1 ? 44 : 40;
      return '<i class="ej-t ' + r[0] + '" style="left:calc(' + P(r[1]) + ' - ' + L + 'px);width:calc(' + P(r[2] - r[1]) + ' + ' + (L + R) + 'px)"></i>'; }).join('') +
      EJ.map(function(c, i){ return c[6] ? '<i class="ej-mark ' + c[6] + '" style="left:' + P(EJ_KM[i]) + '"></i>' : ''; }).join('');
    const seas = EJ.map(function(c, i){ return c[3] && i ? '<span class="ej-sea' + (cur < EJ_KM[i] * 1000 ? ' later' : '') + '" style="left:' + P(EJ_KM[i - 1]) + ';width:' + P(EJ_KM[i] - EJ_KM[i - 1]) + '" title="배를 타고 가요"></span>' : ''; }).join('');
    const stops = EJ.map(function(c, i){ const show = c[5] || (i === ai && EJ.every(function(d, j){ return !d[5] || j === i || Math.abs(EJ_KM[j] - EJ_KM[i]) > goalKm * 0.05; }));
      return '<span class="ej-stop' + (cur >= EJ_KM[i] * 1000 ? ' on' : '') + (c[5] ? ' big' : '') + (i === ai ? ' now' : '') + (i === 0 ? ' first' : i === EJ.length - 1 ? ' last' : '') + '" style="left:' + P(EJ_KM[i]) + '" title="' + c[0] + ' · ' + EJ_KM[i].toLocaleString('ko-KR') + 'km">' +
        '<i></i>' + (show ? '<b>' + c[0] + '</b>' : '') + '</span>'; }).join('');
    const kid = '<img src="' + EJ_IMG + 'journey-kid.webp" alt="">' + (onSea ? '<svg class="ej-boat" viewBox="0 0 70 12"><path d="M2 1 H68 L58 11 H12 Z" fill="#B45309" stroke="#7C2D12" stroke-width="1.2"/></svg>' : '');
    const km = function(v){ return (v / 1000).toLocaleString('ko-KR', { maximumFractionDigits: v >= 10000000 ? 0 : 1 }); };
    return '<div class="card ej-card"><div class="ej-head"><div><span class="ej-tag">' + esc(title) + '</span><h2>지구 대장정 <small>인천항 출발 · 부산항 도착 · 약 ' + goalKm.toLocaleString('ko-KR') + 'km</small></h2></div>' +
      '<div class="ej-num"><b class="mono">' + km(cur) + 'km</b> 왔어요' + (laps ? ' · <b>' + laps + '번</b> 완주!' : '') + '</div></div>' +
      '<div class="ej-scene"><div class="ej-land">' + land + '</div><div class="ej-track"><div class="ej-rope"></div><div class="ej-rest" style="left:' + pct.toFixed(2) + '%"></div>' + seas + stops +
      '<span class="ej-me' + (onSea ? ' sea' : '') + '" style="left:clamp(10px, ' + pct.toFixed(2) + '%, calc(100% - 10px))">' + kid + '</span></div>' +
      '<p class="ej-msg">지금 <b>' + EJ[ai][0] + '</b> ' + (onSea ? '앞바다에서 배를 타고 가는 중' : '지나는 중') + ' · 다음 <b>' + EJ[ni][0] + '</b>까지 <b class="mono">' + n(Math.max(0, EJ_KM[ni] * 1000 - cur)) + '회</b> 남았어요</p>' +
      '<div class="ej-foot"><span>참여한 모든 학교가 뛴 줄넘기 <b class="mono">' + n(t) + '회</b> · 1회 = 1m</span><a id="ejMapBtn">🗺️ 코스 지도 보기</a></div>' +
      (prev ? '<div class="ej-foot" style="margin-top:4px">' + prev + '</div>' : '') + '</div></div>';
  }
  function showEarthMap(){
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" style="max-width:1000px"><div class="modal-head"><h3>지구 대장정 코스</h3><button class="modal-x" type="button" aria-label="닫기">×</button></div><div class="modal-body"><img class="ej-map" src="' + EJ_IMG + 'earth-route.webp" alt="지구 대장정 코스 지도"></div></div>';
    document.body.appendChild(bg);
    const close = function(){ bg.remove(); };
    bg.addEventListener('click', function(e){ if (e.target === bg || e.target.classList.contains('modal-x')) close(); });
  }
  const mLabel = function(m){ return Number(m.slice(0, 4)) + '년 ' + Number(m.slice(5, 7)) + '월'; };
  const rankHtml = function(r){ return r ? '<span class="rank r' + r + '">' + r + '</span>' : '<span class="rank">–</span>'; };
  /* 50등까지 보기 팝업 */
  function openModal(title, sub, bodyHtml, tabs){
    closeModal();
    const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'rankModal';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>' + title + (sub ? '<span class="hint">' + sub + '</span>' : '') + '</h3><button type="button" class="modal-x" aria-label="닫기">×</button></div>' +
      (tabs ? '<div class="modal-tabs">' + tabs + '</div>' : '') + '<div class="modal-body">' + bodyHtml + '</div></div>';
    bg.addEventListener('click', function(e){ if (e.target === bg || e.target.closest('.modal-x')) closeModal(); });
    document.addEventListener('keydown', escClose);
    document.body.appendChild(bg); document.body.style.overflow = 'hidden';
    return bg;
  }
  function escClose(e){ if (e.key === 'Escape') closeModal(); }
  function closeModal(){ const m = document.getElementById('rankModal'); if (m) m.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', escClose); }
  const kst = function(){ return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); };

  // 우리 학교 프로그램으로 돌아가는 링크 (이 기기에서 쓰던 학교)
  try { const s = localStorage.getItem('jr_shell'); if (s) $('homeLink').href = './?s=' + encodeURIComponent(s); } catch (e) {}
  if (me) $('hallLink').href = 'hall.html?me=' + encodeURIComponent(me);

  function load(month){
    $('body').innerHTML = '<div class="loading">현황판을 불러오는 중…</div>';
    fetch(collector + '?api=board' + (month ? '&month=' + encodeURIComponent(month) : '') + (grade ? '&grade=' + encodeURIComponent(grade) : ''), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('응답 오류 ' + r.status); return r.json(); })
      .then(function(j){ if (!j.ok) throw new Error(j.error || '불러오기 실패'); data = j.result; draw(); })
      .catch(function(err){ $('body').innerHTML = '<div class="err">현황판을 불러오지 못했어요: ' + esc(err.message || err) + '</div>'; });
  }

  function heroSub(){
    if (data.month === data.current) {
      const t = kst(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)), d = Number(t.slice(8, 10));
      const last = new Date(y, m, 0).getDate();
      return '이번 달 ' + d + '일째 · ' + (last - d === 0 ? '오늘이 마지막 날!' : '마감까지 ' + (last - d) + '일') + ' · 다음 달 1일에 새로 시작해요';
    }
    return mLabel(data.month) + ' 최종 기록 · 1~3등은 Jumpers! 기록실에 남아 있어요';
  }

  const SHOW_STU = 10;   // 현황판에 바로 보이는 학생 수 (나머지는 팝업으로 50등까지)
  function stuTable(rows, all){
    let h = '<table><thead><tr><th>순위</th><th>이름</th><th>학교</th><th class="num">횟수</th><th class="num hide-sm">📷</th></tr></thead><tbody>', r = 0;
    all.forEach(function(x, i){
      r = (i > 0 && all[i - 1].c === x.c) ? r : i + 1;
      if (i >= rows.length) return;
      h += '<tr' + (x.pid === me ? ' class="me"' : '') + '><td>' + rankHtml(r) + '</td><td><b>' + esc(x.n) + '</b>' + (x.g ? '<span class="sub">' + esc(x.g) + '학년</span>' : '') + '</td><td>' + esc(x.school) + '</td><td class="num mono">' + n(x.c) + '</td><td class="num mono hide-sm">' + n(x.cam) + '</td></tr>';
    });
    return h + '</tbody></table>';
  }

  function draw(){
    const sel = $('monthSel'), months = (data.months || []).slice();
    if (months.indexOf(data.current) === -1) months.unshift(data.current);
    sel.innerHTML = months.map(function(m){ return '<option value="' + m + '"' + (m === data.month ? ' selected' : '') + '>' + mLabel(m) + (m === data.current ? ' (이번 달)' : '') + '</option>'; }).join('');
    $('heroSub').innerHTML = heroSub().split(' · ').concat(data.grade ? [data.grade + '학년만'] : []).map(function(t){ return String(t).replace(/[&<>]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }).replace(/\d+/g, '<b>$&</b>'); }).join('<br>');
    const gs = data.grades;
    if (Array.isArray(gs)) {
      const gsel = $('gradeSel'), list = gs.slice();
      if (grade && list.indexOf(grade) === -1) list.push(grade);
      gsel.innerHTML = '<option value="">전체 학년</option>' + list.map(function(g){ return '<option value="' + esc(g) + '"' + (g === grade ? ' selected' : '') + '>' + esc(g) + '학년</option>'; }).join('');
      gsel.style.display = '';
    } else $('gradeSel').style.display = 'none';   // 예전 수집기
    const s = data.summary || {};
    let html = '';
    // 모두 함께 지구 대장정: 학년도마다(3월 1일) 새로 출발. 예전 수집기(학년도 정보 없음)면 지금까지 합계
    if (data.allTime) {
      const at = data.allTime, byYear = at.years && at.year;
      const t = byYear ? (Number(at.years[at.year]) || 0) : (Number(at.total) || 0);
      const prevY = byYear ? String(Number(at.year) - 1) : '', prevT = byYear ? Number(at.years[prevY]) || 0 : 0;
      html += earthHTML(t, (byYear ? at.year + '학년도 ' : '') + '모두 함께 · 3월 1일에 새로 출발',
        prevT ? '<span>지난 ' + esc(prevY) + '학년도에는 모두 함께 <b class="mono">' + (prevT / 1000).toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + 'km</b> 뛰었어요' + (prevT >= EJ_GOAL ? ' (지구 대장정 ' + Math.floor(prevT / EJ_GOAL) + '번 완주!)' : ' (지구 대장정의 ' + (prevT / EJ_GOAL * 100).toFixed(1) + '%)') + '</span>' : '');
    }
    html += '<div class="kpis">' +
      '<div class="kpi"><span>참여 학교</span><b class="mono">' + n(s.schools) + '</b></div>' +
      '<div class="kpi"><span>전체 횟수</span><b class="mono">' + n(s.total) + '</b></div>' +
      '<div class="kpi"><span>참여 학생</span><b class="mono">' + n(s.participants) + '</b></div>' +
      '<div class="kpi"><span>📷 카메라 인증</span><b class="mono">' + n(s.camera) + '</b></div></div>';

    // 학교 순위
    const schools = (data.schools || []).slice();
    const key = { total: 'total', avg: 'avg', rate: 'rate' }[sortBy];
    schools.sort(function(a, b){
      const ra = a.rank[key], rb = b.rank[key];
      if (ra && rb) return ra - rb; if (ra) return -1; if (rb) return 1; return b.total - a.total;
    });
    html += '<div class="card"><div class="card-head"><div><h2>학교 순위</h2><span class="hint">학교 줄을 누르면 그 학교 안 학생 순위가 보여요</span></div>' +
      '<div class="seg" id="sortSeg"><button data-k="total"' + (sortBy === 'total' ? ' class="on"' : '') + '>합계</button><button data-k="avg"' + (sortBy === 'avg' ? ' class="on"' : '') + '>1인당 평균</button><button data-k="rate"' + (sortBy === 'rate' ? ' class="on"' : '') + '>참여율</button></div></div>';
    if (!schools.length) html += '<div class="empty">' + mLabel(data.month) + ' 기록이 아직 없어요. 첫 기록의 주인공이 되어 보세요!</div>';
    else {
      html += '<div class="table-wrap"><table><thead><tr><th>순위</th><th>학교</th><th class="num">합계</th><th class="num">1인당 평균</th><th class="num">참여율</th><th class="num hide-sm">📷 카메라</th></tr></thead><tbody>';
      schools.forEach(function(sc){
        const isMe = sc.pid === me;
        html += '<tr class="school' + (isMe ? ' me' : '') + '" data-pid="' + esc(sc.pid) + '">' +
          '<td>' + rankHtml(sc.rank[key]) + '</td>' +
          '<td><span class="' + (sc.named ? '' : 'anon') + '">' + esc(sc.label) + '</span>' + (isMe ? '<span class="tag-me">우리 학교</span>' : '') + '</td>' +
          '<td class="num mono">' + n(sc.total) + '</td>' +
          (sc.noReg ? '<td class="num mono">–</td><td class="num mono">–</td>' :
          '<td class="num mono">' + n(sc.avg) + '</td>' +
          '<td class="num mono" title="' + sc.participants + '명 / ' + sc.registered + '명">' + sc.rate + '%</td>') +
          '<td class="num mono hide-sm">' + n(sc.camera) + '</td></tr>';
        if (openPid === sc.pid) html += '<tr class="detail"><td colspan="6">' + schoolDetail(sc) + '</td></tr>';
      });
      html += '</tbody></table></div>';
      html += '<p class="hint" style="margin-bottom:0;">1인당 평균 = 합계 ÷ 등록 학생 수 · 참여율 = 이번 달 한 번이라도 뛴 학생 ÷ 등록 학생 수. 두 순위는 등록 학생 ' + (data.minRegistered || 5) + '명 이상인 학교만 매겨요.' + (data.grade ? ' 학년별로 볼 때는 학년별 학생 수를 보낸 학교(2.2 이상)만 1인당 평균·참여율 순위에 들어가요.' : '') + ' 📷 카메라는 줄넘기 판정기로 인증된 횟수예요.</p>';
    }
    html += '</div>';

    // 전국 학생 순위
    const st = data.students || [];
    html += '<div class="card"><div class="card-head"><div><h2>전국 학생 순위</h2><span class="hint">' + mLabel(data.month) + ' 동안 뛴 횟수 합계</span></div></div>';
    if (!st.length) html += '<div class="empty">아직 기록이 없어요.</div>';
    else {
      html += '<div class="table-wrap">' + stuTable(st.slice(0, SHOW_STU), st) + '</div>';
      if (st.length > SHOW_STU) html += '<div style="text-align:center;"><button type="button" class="more-btn" id="stuMore">전국 ' + st.length + '등까지 보기 →</button></div>';
    }
    html += '</div>';
    html += '<p class="hint" style="text-align:center;">집계는 몇 분마다 새로 고쳐져요 · 마지막 갱신 ' + new Date(data.updated).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + '</p>';
    $('body').innerHTML = html;
    if ($('ejMapBtn')) $('ejMapBtn').onclick = showEarthMap;

    $('stuMore') && $('stuMore').addEventListener('click', function(){ const st = data.students || []; openModal('전국 학생 순위 · ' + st.length + '등까지', mLabel(data.month) + (data.grade ? ' · ' + esc(data.grade) + '학년' : '') + ' 동안 뛴 횟수 합계', stuTable(st, st)); });
    $('sortSeg') && $('sortSeg').addEventListener('click', function(e){ const b = e.target.closest('button'); if (b) { sortBy = b.dataset.k; draw(); } });
    Array.prototype.forEach.call(document.querySelectorAll('tr.school'), function(tr){
      tr.addEventListener('click', function(){ openPid = openPid === tr.dataset.pid ? '' : tr.dataset.pid; draw(); });
    });
  }

  function schoolDetail(sc){
    const st = sc.students || [];
    if (!st.length) return '<p class="hint">학생 기록이 없어요.</p>';
    let r = 0;
    return '<table class="mini"><thead><tr><th>학교 안 순위</th><th>이름</th><th class="num">횟수</th><th class="num">뛴 날</th><th class="num">📷</th></tr></thead><tbody>' +
      st.map(function(x, i){
        r = (i > 0 && st[i - 1].c === x.c) ? r : i + 1;
        return '<tr><td>' + rankHtml(r) + '</td><td><b>' + esc(x.n) + '</b>' + (x.g ? '<span class="sub">' + esc(x.g) + '학년</span>' : '') + '</td><td class="num mono">' + n(x.c) + '</td><td class="num mono">' + x.days + '일</td><td class="num mono">' + n(x.cam) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      (sc.participants > st.length ? '<p class="hint" style="margin:6px 0 0;">상위 ' + st.length + '명까지 보여요 (참여 ' + sc.participants + '명)</p>' : '');
  }

  $('monthSel').addEventListener('change', function(){ openPid = me; load(this.value); });
  $('gradeSel').addEventListener('change', function(){ grade = this.value; openPid = me; load($('monthSel').value); });

  fetch('national.json', { cache: 'no-store' }).then(function(r){ return r.json(); }).catch(function(){ return {}; }).then(function(cfg){
    collector = q.c || (cfg && cfg.collector) || '';
    if (!collector) { $('body').innerHTML = '<div class="err">전국 현황판이 아직 준비 중이에요. 곧 열립니다!</div>'; return; }
    load(q.month || '');
  });
})();
</script>
</body>
</html>
