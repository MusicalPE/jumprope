<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #F3F5F8; --surface: #FFFFFF; --ink: #1F2937; --ink-2: #374151; --muted: #6B7280; --faint: #9CA3AF;
    --line: #E5E7EB; --line-2: #EEF0F3; --coral: #F26A3D; --coral-dark: #DC5B31; --coral-tint: #FFF1EC;
    --coral-grad: linear-gradient(135deg, #F26A3D 0%, #FF8A65 100%);
    --gold: #F59E0B; --silver: #94A3B8; --bronze: #B45309; --green: #16A34A; --green-tint: #DCFCE7;
    --r-sm: 10px; --r-md: 14px; --r-lg: 18px;
    --shadow: 0 1px 2px rgba(17,24,39,0.04), 0 4px 16px rgba(17,24,39,0.05);
  }
  * { box-sizing: border-box; }
  /* 제목·숫자 글꼴: 영어는 도현(Do Hyeon), 한글·숫자는 주아(Jua), 나머지는 Pretendard (모두 OFL) */
  @font-face { font-family: 'JE Latin'; src: url(fonts/do-hyeon-latin.woff2) format('woff2'); font-display: swap; unicode-range: U+0041-005A, U+0061-007A; }
  .jn { font-family: 'JE Latin', 'Jua', 'Pretendard', sans-serif; font-weight: 400; color: #F26A3D; font-size: 1.06em; margin-right: 4px; letter-spacing: .01em; }
  h1, h2, h3, .hero-mid #heroSub, .hero-note, .hero-slogan, .kpi b, .kpi span, .card-head h2, .rank, .more-btn, .month-head h2, .podium h3, .pl .val, .hof span { font-family: 'JE Latin', 'Jua', 'Pretendard', sans-serif; font-weight: 400; }
  .hero-mid #heroSub b, .hero-note b { font-weight: 400; }

  body { font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); margin: 0; color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .container { max-width: 980px; margin: 0 auto; padding: 22px 16px 70px; }
  .mono { font-variant-numeric: tabular-nums; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { font-weight: 800; font-size: 1.05em; color: var(--ink); text-decoration: none; }
  .btn.btn-ic { display: inline-flex; align-items: center; gap: 6px; }
  .btn-ic .app-ic { flex: none; }
  .nb { gap: 9px; } .nb-mark { width: 36px; height: 36px; border-radius: 10px; flex: none; background: linear-gradient(135deg, #F26A3D 0%, #FF8A65 100%); box-shadow: 0 4px 10px rgba(242,106,61,.25); display: flex; align-items: center; justify-content: center; } .nb-word { font-weight: 800; font-size: 1.04em; color: var(--ink); } .nb .jn { font-size: 1.12em; margin-right: 0; }
  .je-brand { display: inline-flex; align-items: center; gap: 6px; }
  .je-brand .je-logo { flex: none; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 560px) { /* nav-1row: 두 버튼을 한 줄로 */ .nav { width: 100%; flex-wrap: nowrap; gap: 6px; } .nav .btn { flex: 1 1 0; min-width: 0; justify-content: center; white-space: nowrap; padding: 8px 8px; font-size: .84em; } .nav .btn .jn { margin-right: 3px; } .nav .btn svg { flex: none; } }
  @media (max-width: 380px) { .nav .btn svg { display: none; } }
  .btn { display: inline-block; text-decoration: none; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 0.88em; cursor: pointer; font-family: inherit; }
  .btn:hover, .btn.on { border-color: var(--coral); color: var(--coral-dark); background: var(--coral-tint); }
  .hero { background: var(--coral-grad); color: #fff; border-radius: var(--r-lg); padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .hero h1 { margin: 0 0 4px; font-size: 1.55em; }
  .hero p { margin: 0; opacity: .92; }
  .hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .hero select { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 14px; color: var(--ink); background: #fff; }
  .hero-grid { display: grid; grid-template-columns: 32% minmax(0,1fr) auto; align-items: center; gap: 18px; }
  .hero-logo { background: #fff; border-radius: var(--r-md); padding: 6px 10px; box-shadow: 0 4px 14px rgba(0,0,0,.10); }
  .hero-logo img { display: block; width: 100%; height: auto; }
  .hero-mid { text-align: center; }
  .hero-mid #heroSub { font-size: 1.3em; line-height: 1.7; opacity: 1; }
  .hero-mid #heroSub b { font-size: 1.3em; font-weight: 800; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hero-grid .hero-sels { flex-direction: column; align-items: flex-end; gap: 10px; }
  .hero-grid .hero-sels select { width: 220px; max-width: 100%; }
  @media (max-width: 640px) {
    .hero-grid { grid-template-columns: 1fr; gap: 12px; }
    .hero-logo { max-width: 280px; margin: 0 auto; }
    .hero-mid #heroSub { font-size: 1.15em; }
    .hero-grid .hero-sels { flex-direction: row; justify-content: center; align-items: center; flex-wrap: wrap; }
    .hero-grid .hero-sels select { width: auto; }
  }
  .hero-grid .hero-logo { grid-row: 1 / span 2; }
  .hero-slogan { grid-column: 2 / -1; margin: 2px 0 0; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.5); text-align: center; font-size: 1em; font-weight: 800; letter-spacing: .22em; white-space: nowrap; opacity: 1; }
  .hero-slogan span { opacity: .7; margin: 0 1.1em; font-weight: 500; letter-spacing: 0; }
  @media (max-width: 640px) {
    .hero-grid .hero-logo { grid-row: auto; }
    .hero-slogan { grid-column: auto; font-size: .85em; letter-spacing: .06em; padding-top: 12px; }
    .hero-slogan span { margin: 0 .45em; }
  }
  .hero-brand { display: flex; align-items: center; gap: 14px; }
  .hero-brand .je-logo { flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.12)); }
  .hero h1 .ko { font-weight: 700; font-size: .78em; opacity: .92; }
  .hero .kick { font-weight: 700; margin: 0 0 2px; opacity: 1; }
  @media (max-width: 560px) { .hero-brand .je-logo { width: 66px; height: 44px; } }
  .hero-sels { display: flex; gap: 8px; flex-wrap: wrap; }
  /* 지구 대장정: 국토 대장정과 같은 그림 (무지개 줄넘기 줄 길 · 땅 모양 · 줄넘기 친구) */
  .ej-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .ej-head h2 { margin: 2px 0 0; } .ej-head small { color: var(--muted); font-weight: 600; font-size: 0.7em; }
  .ej-tag { font-size: 0.8em; color: var(--coral-dark); font-weight: 700; }
  .ej-num { color: var(--ink-2); } .ej-num b { font-size: 1.3em; color: var(--ink); }
  .ej-card { overflow: hidden; }
  .ej-scene { position: relative; margin: 10px -20px 0; height: 232px; }
  .ej-scene svg { display: block; position: absolute; inset: 0; overflow: hidden; }
  .ej-kid { animation: ejHop .9s ease-in-out infinite; }
  .ej-pin b, .ej-lbl { font-family: inherit; }
  @keyframes ejHop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes ejShadow { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.7); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { .ej-kid { animation: none; } }
  .run-live { display: inline-block; font-size: .72em; font-weight: 700; color: var(--coral-dark); background: #FFF1EA; border-radius: 999px; padding: 1px 7px; vertical-align: 1px; white-space: nowrap; }
  .ej-msg { margin: 6px 0 0; font-size: 0.85em; color: #4B5E3A; } .ej-msg b { color: #2F3D22; }
  .ej-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: .85em; color: #4B5E3A; }
  .ej-foot a { color: var(--coral-dark); font-weight: 700; text-decoration: none; cursor: pointer; }
  .ej-map { display: block; width: 100%; height: auto; border-radius: 12px; }
  @media (max-width: 640px) { .ej-scene { height: 200px; } }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--shadow); }
  .kpi span { color: var(--muted); font-size: 0.82em; font-weight: 700; }
  .kpi b { display: block; font-size: 1.45em; }
  .more-btn { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--coral-dark); border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 700; font-size: .88em; cursor: pointer; }
  .more-btn:hover { border-color: var(--coral); background: var(--coral-tint); }
  .modal-bg { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 680px; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 1.1em; }
  .modal-head .hint { display: block; font-weight: 500; }
  .modal-x { border: 0; background: var(--line-2); border-radius: 999px; width: 34px; height: 34px; font-size: 18px; line-height: 1; cursor: pointer; flex: none; }
  .modal-tabs { display: flex; gap: 6px; padding: 10px 18px 0; flex-wrap: wrap; }
  .modal-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: 700; font-size: .86em; cursor: pointer; color: var(--ink-2); }
  .modal-tabs button.on { background: var(--coral); border-color: var(--coral); color: #fff; }
  .modal-body { overflow: auto; padding: 8px 18px 18px; }
  .modal-body table { width: 100%; border-collapse: collapse; font-size: .92em; }
  .modal-body th, .modal-body td { padding: 8px 6px; border-bottom: 1px solid var(--line-2); text-align: left; }
  .modal-body th { color: var(--muted); font-weight: 600; font-size: .9em; }
  .modal-body .num { text-align: right; }
  .modal-body tr.me td { background: var(--coral-tint); }
  .card { background: var(--surface); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 1.15em; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .seg { display: inline-flex; background: var(--bg); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; font: inherit; font-weight: 700; font-size: 0.86em; padding: 6px 12px; border-radius: 999px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--coral-dark); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .hint { color: var(--muted); font-size: 0.85em; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-size: 0.8em; font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line-2); font-size: 0.93em; word-break: keep-all; }
  th.num, td.num { text-align: right; white-space: nowrap; }
  tr.school { cursor: pointer; }
  tr.school:hover td { background: #FAFAFB; }
  tr.me td { background: var(--coral-tint) !important; }
  tr.detail td { background: #FAFAFB; padding: 4px 8px 14px; }
  .rank { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 50%; font-weight: 800; background: var(--bg); color: var(--ink-2); font-size: 0.9em; }
  .rank.r1 { background: var(--gold); color: #fff; } .rank.r2 { background: var(--silver); color: #fff; } .rank.r3 { background: var(--bronze); color: #fff; }
  .sub { color: var(--faint); font-size: 0.8em; margin-left: 4px; }
  .tag-me { display: inline-block; background: var(--coral); color: #fff; font-size: 0.72em; font-weight: 800; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .anon { color: var(--muted); }
  .mini { width: 100%; margin-top: 4px; }
  .mini td, .mini th { padding: 6px 8px; font-size: 0.88em; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .err { background: #FEF3C7; color: #92400E; border-radius: var(--r-sm); padding: 12px 14px; font-weight: 700; }
  .loading { text-align: center; color: var(--muted); padding: 40px; }
  .foot { text-align: center; color: var(--faint); font-size: 0.8em; margin-top: 24px; }
  .hide-sm { }
  @media (max-width: 640px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hide-sm { display: none; }
    .hero h1 { font-size: 1.3em; }
    td, th { padding-left: 5px; padding-right: 5px; }
    td { font-size: 0.88em; }
    .tag-me { display: block; width: fit-content; margin: 2px 0 0; }
    td.num .sub { display: block; margin-left: 0; }
  }
</style>
</head>

    let land = '';
    EJ_PLACE.forEach(function(p){ const x = xMap(p[1]), y = yAt(x, 0) + p[2] * k, ang = Math.atan2(yAt(x + 1, 0) - yAt(x - 1, 0), 2) * 180 / Math.PI, sx = p[3] * (narrow ? kx * 1.3 : kx), sy = p[4] * k * (narrow ? .8 : 1);
      land += '<path d="' + ejSmooth(EJ_C[p[0]]) + '" transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + ang.toFixed(1) + ') scale(' + sx.toFixed(3) + ' ' + sy.toFixed(3) + ')" fill="#62B86A" stroke="#4E9F5A" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity=".88"/>'; });
    const hx = xOf(EJ_KM[24]) - 14 * kx; [[0, 0, 4], [9, 4, 3], [16, 9, 2.5]].forEach(function(h){ const x = hx + h[0] * kx; land += '<circle cx="' + x.toFixed(1) + '" cy="' + (yAt(x, 0) + (52 + h[1]) * k).toFixed(1) + '" r="' + h[2] + '" fill="#62B86A"/>'; });
    let grid = ''; [-.75, -.5, -.25, 0, .25, .5, .75].forEach(function(f){ grid += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (Math.abs(f) * rx || 1) + '" ry="' + ry + '" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="1.2"/>'; });
    [60, 130, 210].forEach(function(o){ grid += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (rx - o * .6 * kx) + '" ry="' + (ry - o * k) + '" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.2"/>'; });
    const fs = narrow ? 12 : 14;
    let pins = '', lbls = '';
    EJ.forEach(function(c, i){ const x = xOf(EJ_KM[i]), y = yAt(x, tr), on = cur >= EJ_KM[i] * 1000, big = c[5];
      const show = narrow ? (i === 0 || i === EJ.length - 1 || i === ai) : (big || (i === ai && EJ.every(function(d, j){ return !d[5] || j === i || Math.abs(EJ_KM[j] - EJ_KM[i]) > goalKm * 0.05; })));
      if (narrow && !big && i !== ai) return;   // 휴대폰: 큰 도시와 지금 도시만
      pins += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (narrow ? (big ? 5 : 4) : (big ? 6 : 4)) + '" fill="' + (on ? '#F26A3D' : '#fff') + '" stroke="' + (on ? '#fff' : '#1F6FB5') + '" stroke-width="2"><title>' + c[0] + ' · ' + EJ_KM[i].toLocaleString('ko-KR') + 'km</title></circle>';
      if (show) lbls += '<text class="ej-lbl" x="' + Math.min(W - 26, Math.max(26, x)).toFixed(1) + '" y="' + (y + 24).toFixed(1) + '" text-anchor="middle" font-size="' + fs + '" font-weight="800" fill="#fff" stroke="#14507F" stroke-width="3" paint-order="stroke">' + c[0] + '</text>'; });
    const ky = yAt(xc, tr), kw = narrow ? 46 : 56, kh = kw * 72 / 56;
    const boat = ejState.onSea ? '<path d="M' + (xc - kw * .45) + ' ' + (ky - 4) + ' H' + (xc + kw * .45) + ' L' + (xc + kw * .32) + ' ' + (ky + 4) + ' H' + (xc - kw * .32) + ' Z" fill="#B45309" stroke="#7C2D12" stroke-width="1.2"/>' : '';
    el.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><defs>' +
      '<linearGradient id="ejSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF4FF"/></linearGradient>' +
      '<linearGradient id="ejSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FB4F0"/><stop offset=".45" stop-color="#2E86D1"/><stop offset="1" stop-color="#1D5FA3"/></linearGradient>' +
      '<radialGradient id="ejShine" cx=".5" cy=".18" r=".45"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>' +
      '<filter id="ejGlow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>' +
      '<clipPath id="ejEarth"><ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"/></clipPath></defs>' +
      '<rect width="' + W + '" height="' + H + '" fill="url(#ejSky)"/>' +
      '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (rx + 6) + '" ry="' + (ry + 6) + '" fill="none" stroke="#9ED6FF" stroke-width="18" filter="url(#ejGlow)" opacity=".9"/>' +
      '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="url(#ejSea)"/>' +
      '<g clip-path="url(#ejEarth)">' + grid + land + '<rect width="' + W + '" height="' + H + '" fill="url(#ejShine)"/></g>' +
      '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>' +
      '<path d="' + arc(X0, X1, tr) + '" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>' +
      (xc > X0 + .5 ? '<path d="' + arc(X0, xc, tr) + '" fill="none" stroke="#F26A3D" stroke-width="6" stroke-linecap="round"/>' : '') +
      pins + lbls + boat +
      '<g class="ej-kid"><image href="' + EJ_IMG + 'journey-kid.webp" x="' + (xc - kw / 2).toFixed(1) + '" y="' + (ky - kh - (ejState.onSea ? 4 : 2)).toFixed(1) + '" width="' + kw + '" height="' + kh.toFixed(1) + '"/></g></svg>';
  }
  let ejRT = 0; window.addEventListener('resize', function(){ clearTimeout(ejRT); ejRT = setTimeout(ejDraw, 120); });
  function showEarthMap(){
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" style="max-width:1000px"><div class="modal-head"><h3>지구 대장정 코스</h3><button class="modal-x" type="button" aria-label="닫기">×</button></div><div class="modal-body"><img class="ej-map" src="' + EJ_IMG + 'earth-route.webp" alt="지구 대장정 코스 지도"></div></div>';
    document.body.appendChild(bg);
    const close = function(){ bg.remove(); };
    bg.addEventListener('click', function(e){ if (e.target === bg || e.target.classList.contains('modal-x')) close(); });
  }
  const mLabel = function(m){ return Number(m.slice(0, 4)) + '년 ' + Number(m.slice(5, 7)) + '월'; };
  const rankHtml = function(r){ return r ? '<span class="rank r' + r + '">' + r + '</span>' : '<span class="rank">–</span>'; };
  /* 50등까지 보기 팝업 */
  function openModal(title, sub, bodyHtml, tabs){
    closeModal();
    const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'rankModal';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>' + title + (sub ? '<span class="hint">' + sub + '</span>' : '') + '</h3><button type="button" class="modal-x" aria-label="닫기">×</button></div>' +
      (tabs ? '<div class="modal-tabs">' + tabs + '</div>' : '') + '<div class="modal-body">' + bodyHtml + '</div></div>';
    bg.addEventListener('click', function(e){ if (e.target === bg || e.target.closest('.modal-x')) closeModal(); });
    document.addEventListener('keydown', escClose);
    document.body.appendChild(bg); document.body.style.overflow = 'hidden';
    return bg;
  }
  function escClose(e){ if (e.key === 'Escape') closeModal(); }
  function closeModal(){ const m = document.getElementById('rankModal'); if (m) m.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', escClose); }
  const kst = function(){ return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); };

  // 우리 학교 프로그램으로 돌아가는 링크 (이 기기에서 쓰던 학교)
  try { const s = localStorage.getItem('jr_shell'); if (s) $('homeLink').href = './?s=' + encodeURIComponent(s); } catch (e) {}
  if (me) $('hallLink').href = 'hall.html?me=' + encodeURIComponent(me);

  function load(month){
    $('body').innerHTML = '<div class="loading">현황판을 불러오는 중…</div>';
    fetch(collector + '?api=board' + (month ? '&month=' + encodeURIComponent(month) : '') + (grade ? '&grade=' + encodeURIComponent(grade) : ''), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('응답 오류 ' + r.status); return r.json(); })
      .then(function(j){ if (!j.ok) throw new Error(j.error || '불러오기 실패'); data = j.result; draw(); })
      .catch(function(err){ $('body').innerHTML = '<div class="err">현황판을 불러오지 못했어요: ' + esc(err.message || err) + '</div>'; });
  }

  function heroSub(){
    if (data.month === data.current) {
      const t = kst(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)), d = Number(t.slice(8, 10));
      const last = new Date(y, m, 0).getDate();
      return '이번 달 ' + d + '일째 · ' + (last - d === 0 ? '오늘이 마지막 날!' : '마감까지 ' + (last - d) + '일') + ' · 다음 달 1일에 새로 시작해요';
    }
    return mLabel(data.month) + ' 최종 기록 · 1~3등은 Jumpers! 기록실에 남아 있어요';
  }

  const SHOW_STU = 10;   // 현황판에 바로 보이는 학생 수 (나머지는 팝업으로 50등까지)
  function stuTable(rows, all){
    let h = '<table><thead><tr><th>순위</th><th>이름</th><th>학교</th><th class="num">횟수</th><th class="num hide-sm">📷</th></tr></thead><tbody>', r = 0;
    all.forEach(function(x, i){
      r = (i > 0 && all[i - 1].c === x.c) ? r : i + 1;
      if (i >= rows.length) return;
      h += '<tr' + (x.pid === me ? ' class="me"' : '') + '><td>' + rankHtml(r) + '</td><td><b>' + esc(x.n) + '</b>' + (x.g ? '<span class="sub">' + esc(x.g) + '학년</span>' : '') + '</td><td>' + esc(x.school) + '</td><td class="num mono">' + n(x.c) + '</td><td class="num mono hide-sm">' + n(x.cam) + '</td></tr>';
    });
    return h + '</tbody></table>';
  }

  function runTable(rows){
    return '<table><thead><tr><th>순위</th><th>이름</th><th>학교</th><th class="num">연속</th><th class="num hide-sm">횟수</th></tr></thead><tbody>' + rows.map(function(x){
      return '<tr' + (x.pid === me ? ' class="me"' : '') + '><td>' + rankHtml(x.rank) + '</td><td><b>' + esc(x.n) + '</b>' + (x.g ? '<span class="sub">' + esc(x.g) + '학년</span>' : '') + '</td><td>' + esc(x.school) + '</td><td class="num"><b class="mono">' + x.run + '일</b>' + (x.live ? ' <span class="run-live">이어 가는 중</span>' : '') + '</td><td class="num mono hide-sm">' + n(x.c) + '</td></tr>';
    }).join('') + '</tbody></table>';
  }

  function draw(){
    const sel = $('monthSel'), months = (data.months || []).slice();
    if (months.indexOf(data.current) === -1) months.unshift(data.current);
    sel.innerHTML = months.map(function(m){ return '<option value="' + m + '"' + (m === data.month ? ' selected' : '') + '>' + mLabel(m) + (m === data.current ? ' (이번 달)' : '') + '</option>'; }).join('');
    $('heroSub').innerHTML = heroSub().split(' · ').concat(data.grade ? [data.grade + '학년만'] : []).map(function(t){ return String(t).replace(/[&<>]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }).replace(/\d+/g, '<b>$&</b>'); }).join('<br>');
    const gs = data.grades;
    if (Array.isArray(gs)) {
      const gsel = $('gradeSel'), list = gs.slice();
      if (grade && list.indexOf(grade) === -1) list.push(grade);
      gsel.innerHTML = '<option value="">전체 학년</option>' + list.map(function(g){ return '<option value="' + esc(g) + '"' + (g === grade ? ' selected' : '') + '>' + esc(g) + '학년</option>'; }).join('');
      gsel.style.display = '';
    } else $('gradeSel').style.display = 'none';   // 예전 수집기
    const s = data.summary || {};
    let html = '';
    // 모두 함께 지구 대장정: 학년도마다(3월 1일) 새로 출발. 예전 수집기(학년도 정보 없음)면 지금까지 합계
    if (data.allTime) {
      const at = data.allTime, byYear = at.years && at.year;
      const t = byYear ? (Number(at.years[at.year]) || 0) : (Number(at.total) || 0);
      const prevY = byYear ? String(Number(at.year) - 1) : '', prevT = byYear ? Number(at.years[prevY]) || 0 : 0;
      html += earthHTML(t, (byYear ? at.year + '학년도 ' : '') + '모두 함께 · 3월 1일에 새로 출발',
        prevT ? '<span>지난 ' + esc(prevY) + '학년도에는 모두 함께 <b class="mono">' + (prevT / 1000).toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + 'km</b> 뛰었어요' + (prevT >= EJ_GOAL ? ' (지구 대장정 ' + Math.floor(prevT / EJ_GOAL) + '번 완주!)' : ' (지구 대장정의 ' + (prevT / EJ_GOAL * 100).toFixed(1) + '%)') + '</span>' : '');
    }
    html += '<div class="kpis">' +
      '<div class="kpi"><span>참여 학교</span><b class="mono">' + n(s.schools) + '</b></div>' +
      '<div class="kpi"><span>전체 횟수</span><b class="mono">' + n(s.total) + '</b></div>' +
      '<div class="kpi"><span>참여 학생</span><b class="mono">' + n(s.participants) + '</b></div>' +
      '<div class="kpi"><span>📷 카메라 인증</span><b class="mono">' + n(s.camera) + '</b></div></div>';

    // 학교 순위
    const schools = (data.schools || []).slice();
    const key = { total: 'total', avg: 'avg', rate: 'rate' }[sortBy];
    schools.sort(function(a, b){
      const ra = a.rank[key], rb = b.rank[key];
      if (ra && rb) return ra - rb; if (ra) return -1; if (rb) return 1; return b.total - a.total;
    });
    html += '<div class="card"><div class="card-head"><div><h2>학교 순위</h2><span class="hint">학교 줄을 누르면 그 학교 안 학생 순위가 보여요</span></div>' +
      '<div class="seg" id="sortSeg"><button data-k="total"' + (sortBy === 'total' ? ' class="on"' : '') + '>합계</button><button data-k="avg"' + (sortBy === 'avg' ? ' class="on"' : '') + '>1인당 평균</button><button data-k="rate"' + (sortBy === 'rate' ? ' class="on"' : '') + '>참여율</button></div></div>';
    if (!schools.length) html += '<div class="empty">' + mLabel(data.month) + ' 기록이 아직 없어요. 첫 기록의 주인공이 되어 보세요!</div>';
    else {
      html += '<div class="table-wrap"><table><thead><tr><th>순위</th><th>학교</th><th class="num">합계</th><th class="num">1인당 평균</th><th class="num">참여율</th><th class="num hide-sm">📷 카메라</th></tr></thead><tbody>';
      schools.forEach(function(sc){
        const isMe = sc.pid === me;
        html += '<tr class="school' + (isMe ? ' me' : '') + '" data-pid="' + esc(sc.pid) + '">' +
          '<td>' + rankHtml(sc.rank[key]) + '</td>' +
          '<td><span class="' + (sc.named ? '' : 'anon') + '">' + esc(sc.label) + '</span>' + (isMe ? '<span class="tag-me">우리 학교</span>' : '') + '</td>' +
          '<td class="num mono">' + n(sc.total) + '</td>' +
          (sc.noReg ? '<td class="num mono">–</td><td class="num mono">–</td>' :
          '<td class="num mono">' + n(sc.avg) + '</td>' +
          '<td class="num mono" title="' + sc.participants + '명 / ' + sc.registered + '명">' + sc.rate + '%</td>') +
          '<td class="num mono hide-sm">' + n(sc.camera) + '</td></tr>';
        if (openPid === sc.pid) html += '<tr class="detail"><td colspan="6">' + schoolDetail(sc) + '</td></tr>';
      });
      html += '</tbody></table></div>';
      html += '<p class="hint" style="margin-bottom:0;">1인당 평균 = 합계 ÷ 등록 학생 수 · 참여율 = 이번 달 한 번이라도 뛴 학생 ÷ 등록 학생 수. 두 순위는 등록 학생 ' + (data.minRegistered || 5) + '명 이상인 학교만 매겨요.' + (data.grade ? ' 학년별로 볼 때는 학년별 학생 수를 보낸 학교(2.2 이상)만 1인당 평균·참여율 순위에 들어가요.' : '') + ' 📷 카메라는 줄넘기 판정기로 인증된 횟수예요.</p>';
    }
    html += '</div>';

    // 전국 학생 순위
    const st = data.students || [];
    html += '<div class="card"><div class="card-head"><div><h2>전국 학생 순위</h2><span class="hint">' + mLabel(data.month) + ' 동안 뛴 횟수 합계</span></div></div>';
    if (!st.length) html += '<div class="empty">아직 기록이 없어요.</div>';
    else {
      html += '<div class="table-wrap">' + stuTable(st.slice(0, SHOW_STU), st) + '</div>';
      if (st.length > SHOW_STU) html += '<div style="text-align:center;"><button type="button" class="more-btn" id="stuMore">전국 ' + st.length + '등까지 보기 →</button></div>';
    }
    html += '</div>';
    // 며칠 연속 뛰었나 (수집기 9판 이상)
    if (Array.isArray(data.streaks)) {
      const sk = data.streaks;
      html += '<div class="card"><div class="card-head"><div><h2>🔥 며칠 연속 뛰었나</h2><span class="hint">' + mLabel(data.month) + ' 안에서 하루도 빠지지 않고 이어서 뛴 날 수 · 이틀 이상부터</span></div></div>';
      if (!sk.length) html += '<div class="empty">아직 이틀 연속 뛴 친구가 없어요. 첫 주인공이 되어 보세요!</div>';
      else {
        html += '<div class="table-wrap">' + runTable(sk.slice(0, SHOW_STU)) + '</div>';
        if (sk.length > SHOW_STU) html += '<div style="text-align:center;"><button type="button" class="more-btn" id="runMore">' + sk.length + '등까지 보기 →</button></div>';
      }
      html += '</div>';
    }
    html += '<p class="hint" style="text-align:center;">집계는 몇 분마다 새로 고쳐져요 · 마지막 갱신 ' + new Date(data.updated).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + '</p>';
    $('body').innerHTML = html;
    if ($('ejMapBtn')) $('ejMapBtn').onclick = showEarthMap;
    ejDraw();

    $('runMore') && $('runMore').addEventListener('click', function(){ const sk = data.streaks || []; openModal('며칠 연속 뛰었나 · ' + sk.length + '등까지', mLabel(data.month) + (data.grade ? ' · ' + esc(data.grade) + '학년' : '') + ' 안에서 이어서 뛴 날 수', runTable(sk)); });
    $('stuMore') && $('stuMore').addEventListener('click', function(){ const st = data.students || []; openModal('전국 학생 순위 · ' + st.length + '등까지', mLabel(data.month) + (data.grade ? ' · ' + esc(data.grade) + '학년' : '') + ' 동안 뛴 횟수 합계', stuTable(st, st)); });
    $('sortSeg') && $('sortSeg').addEventListener('click', function(e){ const b = e.target.closest('button'); if (b) { sortBy = b.dataset.k; draw(); } });
    Array.prototype.forEach.call(document.querySelectorAll('tr.school'), function(tr){
      tr.addEventListener('click', function(){ openPid = openPid === tr.dataset.pid ? '' : tr.dataset.pid; draw(); });
    });
  }

  function schoolDetail(sc){
    const st = sc.students || [];
    if (!st.length) return '<p class="hint">학생 기록이 없어요.</p>';
    let r = 0;
    return '<table class="mini"><thead><tr><th>학교 안 순위</th><th>이름</th><th class="num">횟수</th><th class="num">뛴 날</th><th class="num">📷</th></tr></thead><tbody>' +
      st.map(function(x, i){
        r = (i > 0 && st[i - 1].c === x.c) ? r : i + 1;
        return '<tr><td>' + rankHtml(r) + '</td><td><b>' + esc(x.n) + '</b>' + (x.g ? '<span class="sub">' + esc(x.g) + '학년</span>' : '') + '</td><td class="num mono">' + n(x.c) + '</td><td class="num mono">' + x.days + '일</td><td class="num mono">' + n(x.cam) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      (sc.participants > st.length ? '<p class="hint" style="margin:6px 0 0;">상위 ' + st.length + '명까지 보여요 (참여 ' + sc.participants + '명)</p>' : '');
  }

  $('monthSel').addEventListener('change', function(){ openPid = me; load(this.value); });
  $('gradeSel').addEventListener('change', function(){ grade = this.value; openPid = me; load($('monthSel').value); });

  fetch('national.json', { cache: 'no-store' }).then(function(r){ return r.json(); }).catch(function(){ return {}; }).then(function(cfg){
    collector = q.c || (cfg && cfg.collector) || '';
    if (!collector) { $('body').innerHTML = '<div class="err">전국 현황판이 아직 준비 중이에요. 곧 열립니다!</div>'; return; }
    load(q.month || '');
  });
})();
</script>
</body>
</html>
