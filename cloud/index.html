<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jump Us! 줄넘기 기록 (클라우드판)</title>
<meta name="theme-color" content="#F26A3D">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  @font-face { font-family: 'JE Latin'; src: url(../fonts/do-hyeon-latin.woff2) format('woff2'); font-display: swap; unicode-range: U+0041-005A, U+0061-007A; }
  :root {
    --bg: #F3F5F8; --surface: #FFFFFF; --ink: #1F2937; --ink-2: #374151; --muted: #6B7280; --faint: #9CA3AF;
    --line: #E5E7EB; --line-2: #EEF0F3; --coral: #F26A3D; --coral-dark: #DC5B31; --coral-tint: #FFF1EC; --coral-tint-2: #FFD9CC;
    --coral-grad: linear-gradient(135deg, #F26A3D 0%, #FF8A65 100%); --green: #16A34A; --green-tint: #DCFCE7;
    --amber: #D97706; --amber-tint: #FEF3C7; --danger: #DC2626; --danger-tint: #FEE2E2;
    --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --shadow: 0 1px 2px rgba(17,24,39,0.04), 0 4px 16px rgba(17,24,39,0.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif; font-size: 16px; line-height: 1.5; }
  .container { max-width: 1080px; margin: 0 auto; padding: 18px 16px 60px; }
  .narrow { max-width: 520px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.12em; color: var(--ink); text-decoration: none; }
  .brand img { width: 34px; height: 34px; border-radius: 10px; }
  .brand b { font-family: 'JE Latin', 'Jua', sans-serif; font-weight: 400; color: var(--coral); font-size: 1.1em; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, .btn { font: inherit; font-weight: 700; border: 0; border-radius: var(--r-sm); padding: 10px 16px; min-height: 44px; background: var(--coral); color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:hover, .btn:hover { background: var(--coral-dark); }
  button:disabled { opacity: .5; cursor: default; }
  .btn-outline { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn-outline:hover { background: var(--line-2); }
  .btn-danger { background: var(--surface); color: var(--danger); border: 1px solid var(--danger-tint); }
  .btn-danger:hover { background: var(--danger-tint); }
  .btn-sm { padding: 6px 10px; min-height: 34px; font-size: .88em; }
  .card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 1.12em; }
  .hero { background: var(--coral-grad); color: #fff; border-radius: var(--r-lg); padding: 22px; margin-bottom: 16px; }
  .hero h1 { margin: 0 0 4px; font-family: 'JE Latin', 'Jua', sans-serif; font-weight: 400; font-size: 1.9em; }
  .hero .sub { opacity: .9; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stat { background: rgba(255,255,255,.18); border-radius: var(--r-md); padding: 12px; }
  .stat .v { font-family: 'JE Latin', 'Jua', sans-serif; font-size: 1.7em; line-height: 1.1; }
  .stat .l { font-size: .85em; opacity: .92; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(3, 1fr); } .hero h1 { font-size: 1.5em; } }
  label { display: block; font-size: .88em; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: #fff; color: var(--ink); min-height: 44px; }
  textarea { min-height: 140px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--coral-tint-2); border-color: var(--coral); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1; min-width: 90px; }
  .hint { color: var(--muted); font-size: .9em; margin: 6px 0; }
  .msg { padding: 10px 12px; border-radius: var(--r-sm); margin: 10px 0; font-weight: 600; }
  .msg.ok { background: var(--green-tint); color: #14532D; }
  .msg.err { background: var(--danger-tint); color: #7F1D1D; }
  .msg.warn { background: var(--amber-tint); color: #78350F; }
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar { display: grid; grid-template-columns: 120px 1fr 64px; gap: 8px; align-items: center; font-size: .92em; }
  .bar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; color: var(--ink); padding: 0; min-height: 32px; justify-content: flex-start; font-weight: 600; }
  .bar .nm:hover { text-decoration: underline; background: none; }
  .bar .track { background: var(--line-2); border-radius: 999px; height: 14px; overflow: hidden; }
  .bar .fill { background: var(--coral-grad); height: 100%; border-radius: 999px; }
  .bar .n { text-align: right; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: .92em; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line-2); text-align: left; }
  th { color: var(--muted); font-weight: 700; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs button { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 1.3em; letter-spacing: .08em; background: var(--line-2); padding: 10px 14px; border-radius: var(--r-sm); display: inline-block; font-weight: 700; }
  .qrbox { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .qrbox .qr { background: #fff; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); width: 240px; }
  .qrbox .qr svg { width: 100%; height: auto; display: block; }
  .overlay { position: fixed; inset: 0; z-index: 300; background: rgba(17,24,39,.72); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .overlay .sheet { background: #fff; border-radius: 20px; padding: 22px; width: min(560px, 100%); max-height: 100%; overflow: auto; text-align: center; }
  .overlay .sheet .qr svg { width: min(70vh, 100%); height: auto; }
  .tag { display: inline-block; font-size: .78em; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--amber-tint); color: #78350F; }
  .tag.ok { background: var(--green-tint); color: #14532D; }
  .center { text-align: center; }
  .foot { text-align: center; color: var(--faint); font-size: .82em; margin-top: 30px; }
  .spaces a { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-md); text-decoration: none; color: var(--ink); font-weight: 700; margin-bottom: 8px; background: #fff; }
  .spaces a:hover { border-color: var(--coral); }
  .recovery { font-family: ui-monospace, Menlo, monospace; font-size: 1.4em; font-weight: 800; letter-spacing: .06em; background: var(--amber-tint); padding: 14px; border-radius: var(--r-md); text-align: center; word-break: break-all; }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
