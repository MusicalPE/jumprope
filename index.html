<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>줄넘기 기록 관리</title>
<meta name="description" content="학생 휴대폰으로 QR 찍고 횟수만 넣으면 끝. 급수 인증 · 국토 대장정 · 점프 Live · 전국 현황판">
<meta property="og:type" content="website">
<meta property="og:site_name" content="점퍼스">
<meta property="og:title" content="Jump Us! 점퍼스 · 줄넘기 기록">
<meta property="og:description" content="학생 휴대폰으로 QR 찍고 횟수만 넣으면 끝. 급수 인증 · 국토 대장정 · 점프 Live · 전국 현황판">
<meta property="og:url" content="https://musicalpe.github.io/jumprope/">
<meta property="og:image" content="https://musicalpe.github.io/jumprope/img/og-app.jpg?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F26A3D">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  /* 큰 제목·줄넘기왕·통계 숫자 글꼴: 한글·숫자 주아(Jua), 영어 도현(Do Hyeon), 나머지 Pretendard (모두 OFL) */
  @font-face { font-family: 'JE Latin'; src: url(fonts/do-hyeon-latin.woff2) format('woff2'); font-display: swap; unicode-range: U+0041-005A, U+0061-007A; }
  .jn { font-family: 'JE Latin', 'Jua', 'Pretendard', sans-serif; font-weight: 400; color: #F26A3D; font-size: 1.06em; margin-right: 4px; letter-spacing: .01em; }
  body .hero h1, body .today-lead-name, body .today-lead-count, body .stat-value { font-family: 'JE Latin', 'Jua', 'Pretendard', sans-serif; font-weight: 400; }

  /* ---- 체육교사 보조 프로그램과 같은 계열의 디자인 (v1.5.1) ----
     바탕은 연회색, 카드는 흰색, 강조색은 줄넘기 모듈 색인 코랄 */
  :root {
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --ink: #1F2937;
    --ink-2: #374151;
    --muted: #6B7280;
    --faint: #9CA3AF;
    --line: #E5E7EB;
    --line-2: #EEF0F3;
    --coral: #F26A3D;
    --coral-dark: #DC5B31;
    --coral-tint: #FFF1EC;
    --coral-tint-2: #FFD9CC;
    --accent-rgb: 242,106,61;
    --coral-grad: linear-gradient(135deg, #F26A3D 0%, #FF8A65 100%);
    --slate: #4B5B6E;
    --slate-grad: linear-gradient(135deg, #4B5B6E 0%, #6B7A8E 100%);
    --violet: #6C5CE7;
    --violet-dark: #5A4BD1;
    --green: #16A34A;
    --green-tint: #DCFCE7;
    --amber: #D97706;
    --amber-tint: #FEF3C7;
    --danger: #DC2626;
    --danger-tint: #FEE2E2;
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 18px;
    --shadow: 0 1px 2px rgba(17,24,39,0.04), 0 4px 16px rgba(17,24,39,0.05);
    /* 예전 클래스 호환 */
    --court: var(--coral); --court-dark: var(--coral-dark); --court-tint: var(--coral-tint);
    --track: var(--coral); --track-tint: var(--coral-tint); --brass: var(--amber); --brass-tint: var(--amber-tint);
    --paper: var(--bg);
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--bg);
    margin: 0;
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 960px; margin: 0 auto; padding: 22px 20px 70px; }
  .container.narrow { max-width: 440px; }

  h1, h2, h3 { font-weight: 800; letter-spacing: -0.01em; color: var(--ink); margin: 0 0 14px; }
  h1 { font-size: 1.35em; }
  h2 { font-size: 1.05em; }
  h3 { font-size: 0.98em; }

  .mono { font-variant-numeric: tabular-nums; font-weight: 700; }

  /* ---- 상단 헤더 ---- */
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: var(--coral-grad); position: relative;
    box-shadow: 0 4px 10px rgba(var(--accent-rgb),0.25);
  }
  /* 줄넘기 하는 사람 (앱 아이콘과 같은 그림, 바탕은 테마 색) */
  .brand-mark::after {
    content: ''; position: absolute; inset: 3px;
    background: url("data:image/svg+xml,%3Csvg viewBox=%220 0 100 100%22 xmlns=%22http://www.w3.org/2000/svg%22 fill=%22none%22 stroke=%22%23fff%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M33 60 C 22 6, 78 6, 67 60%22 stroke-width=%225.5%22/%3E%3Ccircle cx=%2250%22 cy=%2231%22 r=%226.5%22 stroke-width=%225.5%22/%3E%3Cpath d=%22M50 38 L50 59%22 stroke-width=%226%22/%3E%3Cpath d=%22M50 45 L39 55 L33 60 M50 45 L61 55 L67 60%22 stroke-width=%225.5%22/%3E%3Cpath d=%22M50 59 L44 66 L46 75 M50 59 L56 66 L54 75%22 stroke-width=%225.5%22/%3E%3Cpath d=%22M34 84 L66 84%22 stroke-width=%225%22/%3E%3C/svg%3E") center / contain no-repeat;
  }
  .brand-word { font-weight: 800; font-size: 1.08em; letter-spacing: -0.01em; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 14px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .topbar-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .status-strip { display: none; }

  .btn-outline {
    border: 1px solid var(--line); color: var(--ink-2);
    padding: 9px 16px; border-radius: var(--r-sm); text-decoration: none;
    font-weight: 700; font-size: 0.88em; background: var(--surface);
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-outline:hover { border-color: var(--coral); color: var(--coral-dark); background: var(--coral-tint); }
  button.btn-outline { padding: 10px 16px; }
  button.btn-outline:hover { background: var(--coral-tint); }

  /* ---- 코랄 히어로 (이번주·오늘·연속 1위) ---- */
  .hero {
    background: var(--coral-grad); color: #fff; border-radius: var(--r-lg);
    padding: 24px 26px 22px; margin-bottom: 16px; position: relative; overflow: hidden;
    box-shadow: 0 8px 24px rgba(var(--accent-rgb),0.22);
  }
  .hero::before, .hero::after {
    content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,0.14); pointer-events: none;
  }
  .hero::before { width: 260px; height: 260px; right: -70px; top: -110px; }
  .hero::after { width: 140px; height: 140px; right: 120px; bottom: -80px; background: rgba(255,255,255,0.08); }
  .hero h1 { color: #fff; font-size: 1.5em; margin: 0 0 4px; position: relative; }
  .hero-sub { margin: 0 0 16px; opacity: 0.92; font-size: 0.9em; font-weight: 500; position: relative; }

  .lead-row { display: flex; gap: 10px; flex-wrap: wrap; position: relative; margin: 0; }
  .today-lead {
    flex: 1; min-width: 150px;
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(255,255,255,0.2); border-radius: var(--r-md); padding: 12px 14px;
    color: #fff; font-size: 0.92em;
  }
  .today-lead-tag { font-size: 0.74em; font-weight: 700; opacity: 0.9; letter-spacing: 0.01em; }
  .today-lead-name { font-weight: 800; font-size: 1.12em; word-break: keep-all; }
  .today-lead-count { font-weight: 700; opacity: 0.95; font-size: 0.95em; }
  .lead-week, .lead-streak { background: rgba(255,255,255,0.2); border: 0; }
  .lead-week .today-lead-tag, .lead-streak .today-lead-tag, .lead-week .today-lead-count, .lead-streak .today-lead-count { color: #fff; }

  /* ---- 통계 카드 ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .stat-accent { display: block; height: 4px; width: 28px; border-radius: 2px; margin-bottom: 10px; background: var(--coral) !important; opacity: 0.85; }
  .stat-label { font-size: 0.74em; font-weight: 700; color: var(--muted); }
  .stat-value { font-size: 1.5em; font-weight: 800; margin-top: 2px; letter-spacing: -0.02em; }

  /* ---- 오늘의 한마디 ---- */
  .note-panel {
    background: var(--coral-tint); border: 1px solid var(--coral-tint-2); border-radius: var(--r-md);
    padding: 12px 16px 12px 46px; margin-bottom: 16px; position: relative;
  }
  .note-panel::before {
    content: ''; position: absolute; left: 16px; top: 15px; width: 18px; height: 18px;
    border: 2px solid var(--coral); border-radius: 5px; box-sizing: border-box;
    background: linear-gradient(var(--coral), var(--coral)) 4px 6px / 8px 2px no-repeat, linear-gradient(var(--coral), var(--coral)) 4px 10px / 5px 2px no-repeat;
  }
  .note-eyebrow { font-size: 0.7em; font-weight: 700; color: var(--coral-dark); margin-bottom: 2px; }
  .ai-message { margin: 0; font-size: 0.97em; font-weight: 600; color: var(--ink-2); }

  /* ---- 카드 ---- */
  .card, .chart-wrap {
    background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg);
    box-shadow: var(--shadow); padding: 20px; margin-top: 16px;
  }
  .chart-wrap { margin-top: 0; }

  /* 입력칸 안내 문장은 버튼 말풍선으로만 (모든 화면) */
  .form-hint { display: none !important; }
  [data-tip] { position: relative; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 8px); width: min(320px, 78vw); padding: 10px 12px; border-radius: 10px; background: #1F2937; color: #fff; font-size: 13px; font-weight: 500; line-height: 1.5; white-space: normal; text-align: left; z-index: 20; box-shadow: 0 8px 20px rgba(0,0,0,.18); pointer-events: none; }
  /* ---- 넓은 화면(PC·노트북·가로 태블릿): 왼쪽(기록·여행) · 오른쪽(입력·그래프·오늘 기록) 한 화면 ---- */
  @media (min-width: 1000px) {
    .container.main-wide { max-width: 1560px; }
    .dash { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .dash-l > :first-child, .dash-r > :first-child { margin-top: 0; }
    .dash-r .card { margin-top: 0; margin-bottom: 16px; }
    .dash-l > .card { margin-top: 16px; }
    .dash-chart { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px 20px 12px; margin-bottom: 16px; }
    .dash-chart .chart-head { margin-top: 0; }
    .dash-chart .chart-wrap { border: 0; box-shadow: none; padding: 0; height: 190px; position: relative; }
    .dash-chart > .hint { display: none; }
    .dash-chart .chart-head h1 { margin-bottom: 4px; }
    .dash-r #formMsg:empty { display: none; }
    .dash-r #recordForm .form-row { margin-bottom: 4px; }
    .dash-pend .pend-scroll { max-height: max(150px, calc(100vh - 660px)); overflow: auto; }
    .dash-pend > h2:first-child { margin-bottom: 8px; }
    .dash-pend .pend-scroll thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
  }
  /* 넓은 화면 + 급수 칸이 있을 때: 왼쪽 칸들을 조금씩 낮게 (급수 칸이 없으면 그대로) */
  @media (min-width: 1000px) {
    .dash-l.has-level > .card { margin-top: 12px; }
    .dash-l.has-level .hero { padding-top: 16px; padding-bottom: 14px; }
    .dash-l.has-level .hero h1 { font-size: 1.32em; margin-bottom: 2px; }
    .dash-l.has-level .hero-sub { margin-bottom: 10px; }
    .dash-l.has-level .today-lead { padding: 8px 12px; }
    .dash-l.has-level .note-panel { padding-top: 8px; padding-bottom: 8px; margin-top: 12px; margin-bottom: 12px; }
    .dash-l.has-level .note-eyebrow { display: none; }
    .dash-l.has-level .stat-grid { margin-bottom: 0; }
    .dash-l.has-level .stat-card { padding-top: 10px; padding-bottom: 10px; }
    .dash-l.has-level .stat-value { font-size: 1.3em; }
    .dash-l.has-level .jr-scene { padding-top: 88px; }
    .dash-l.has-level .jr-land { top: 26px; }
    .dash-l.has-level #levelCard > h2:first-child { padding-top: 10px; padding-bottom: 10px; margin-bottom: 12px; }
  }
  /* 세로가 짧은 노트북(768~820px): 조금 더 촘촘하게 */
  @media (min-width: 1000px) and (max-height: 820px) {
    .container.main-wide { padding-top: 12px; }
    .dash-l .hero { padding-top: 18px; padding-bottom: 16px; }
    .dash-l .note-panel { padding-top: 10px; padding-bottom: 10px; }
    .dash-chart .chart-wrap { height: 150px; }
    .dash-r .card > h2:first-child { padding-top: 10px; padding-bottom: 10px; margin-bottom: 12px; }
    .dash-pend .pend-scroll { max-height: max(140px, calc(100vh - 600px)); }
  }
  @media (min-width: 1000px) and (max-width: 1279px) {
    .dash-l .lead-row { flex-wrap: nowrap; }
    .dash-l .today-lead { min-width: 0; flex: 1 1 0; }
    .dash-l .today-lead-name { font-size: 1em; }
    .dash { gap: 16px; }
    .dash-l .stat-grid { gap: 10px; }
    .dash-l .stat-card { padding: 12px 14px; }
  }
  .card > h2:first-child {
    margin: -20px -20px 16px; padding: 14px 20px; border-bottom: 1px solid var(--line-2);
    font-size: 1.02em; display: flex; align-items: center; gap: 8px;
  }
  .card > h2:first-child::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); flex: none; }

  .hint { color: var(--muted); font-size: 0.86em; }

  .chart-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-top: 22px; }
  .chart-head h1 { margin: 0 0 10px; font-size: 1.15em; }
  .chart-filter { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  .chart-filter select { width: auto; margin-top: 0; padding: 8px 12px; font-size: 0.9em; }
  .chart-filter { flex-wrap: wrap; }
  .chart-filter select[hidden] { display: none; }
  .chart-filter select:disabled { opacity: .5; }

  /* ---- 폼 ---- */
  label { display: block; margin-bottom: 12px; font-size: 0.84em; font-weight: 700; color: var(--muted); }
  .form-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .form-row label { flex: 1; min-width: 140px; }
  /* 한 명만 추가: 휴대폰에서도 칸이 가지런하게 (학년·반·번호 한 줄, 이름·비밀번호 한 줄) */
  #addForm .form-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  #addForm .form-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #addForm .form-row label { min-width: 0; }
  #addForm input::placeholder { color: var(--faint); opacity: .6; font-weight: 400; }

  input, select, textarea {
    display: block; width: 100%; box-sizing: border-box;
    padding: 11px 12px; margin-top: 6px;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    font-family: inherit; font-size: 1em; font-weight: 500;
    background: var(--surface); color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.15);
  }
  input[type=checkbox], input[type=range] { width: auto; display: inline-block; margin: 0; box-shadow: none; }
  input[type=range] { accent-color: var(--coral); padding: 0; border: 0; display: block; width: 100%; margin-top: 10px; }

  button {
    background: var(--coral); color: #fff; border: none;
    padding: 11px 20px; border-radius: var(--r-sm); cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 0.95em;
    transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
    box-shadow: 0 2px 6px rgba(var(--accent-rgb),0.25);
  }
  button:hover { background: var(--coral-dark); }
  button:active { transform: translateY(1px); }

  /* 카메라로 뛰기 (보라색, 통합 프로그램과 동일) */
  #cameraBtn { background: var(--violet); color: #fff; border: 0; box-shadow: 0 2px 6px rgba(108,92,231,0.25); }
  #cameraBtn:hover { background: var(--violet-dark); }
  /* 블루투스 줄넘기(JUMPITNOW)로 뛰기 */
  #bleBtn { background: #0E8F85; color: #fff; border: 0; box-shadow: 0 2px 6px rgba(14,143,133,0.25); }
  #bleBtn:hover { background: #0B766E; }
  .ble-modal { position: fixed; inset: 0; z-index: 60; background: rgba(17,24,39,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .ble-modal[hidden] { display: none; }
  .ble-box { background: var(--surface); border-radius: var(--r-lg); width: min(420px, 100%); padding: 22px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .ble-box h3 { margin: 0 0 4px; font-size: 1.2em; }
  .ble-who { color: var(--muted); font-size: .92em; margin-bottom: 10px; }
  .ble-cnt { font-size: 88px; font-weight: 900; line-height: 1; color: var(--ink); letter-spacing: -.04em; }
  .ble-cnt small { font-size: .3em; color: var(--muted); font-weight: 700; margin-left: 4px; }
  .ble-time { margin-top: 6px; font-size: 26px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .ble-time.on { color: var(--coral-dark, #D4532A); }
  .ble-st { margin: 10px 0 16px; font-weight: 700; color: #0E8F85; min-height: 1.4em; }
  .ble-st.bad { color: var(--danger); }
  .ble-help { margin: -6px 0 14px; padding: 10px 12px; border-radius: 10px; background: #F3F6F9; color: var(--ink-2, #374151); font-size: .85em; line-height: 1.55; text-align: left; }
  .ble-help b { color: var(--ink, #111827); }
  .ble-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  button[data-action="del"], button[data-action="reject"] {
    background: var(--surface); color: var(--danger); border: 1px solid var(--danger-tint);
    padding: 8px 14px; box-shadow: none;
  }
  button[data-action="del"]:hover, button[data-action="reject"]:hover { background: var(--danger-tint); }
  button[data-action="approve"] { background: var(--green); box-shadow: 0 2px 6px rgba(22,163,74,0.25); }
  button[data-action="approve"]:hover { background: #15803D; }

  #formMsg { font-weight: 700; color: var(--coral-dark); min-height: 1.2em; font-size: 0.9em; }
  #msg, #deniedMsg { font-weight: 700; color: var(--danger); }

  /* ---- 표 ---- */
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 9px 8px; font-size: 0.76em; font-weight: 700;
    color: var(--muted); border-bottom: 1px solid var(--line); background: #FAFBFC;
  }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line-2); font-size: 0.94em; }
  tbody tr:hover { background: #FAFBFC; }
  td select, td input { margin-top: 0; padding: 7px 10px; font-size: 0.92em; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.78em; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
  .badge-approved { background: var(--green-tint); color: #166534; } .badge-approved::before { background: var(--green); }

  /* ---- 테마 색 고르기 ---- */

  /* ---- 학생 접속 QR (v1.6.1) ---- */
  .qr-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(17,24,39,0.62); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 20px; }

/* 학생 접속 주소 QR — 메인 화면 버튼·관리자 메뉴에서 같이 씀 (v1.6.1) */
window.JRQR = {
  svg: function(text, margin){
    if (typeof qrcode !== 'function') return '<p class="hint" style="line-height:1.5;">QR을 만들 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.</p>';

  },
  pngDataUrl: function(text){
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(), cell = 16, pad = 4 * cell, size = n * cell + pad * 2;
    const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#111';

    return c.toDataURL('image/png');

  copy: function(text, btn){
    function done(){ if (!btn) return; const t = btn.textContent; btn.textContent = '복사했어요 ✓'; setTimeout(function(){ btn.textContent = t; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function(){ prompt('아래 주소를 복사하세요', text); });
    else prompt('아래 주소를 복사하세요', text);
  },
  download: function(text, name){
    const a = document.createElement('a'); a.href = this.pngDataUrl(text); a.download = name || '학생접속_QR.png';
    document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); }, 300);
  },
  show: function(url, title){
    this.hide();
    const ov = document.createElement('div'); ov.className = 'qr-overlay'; ov.id = 'qrOverlay';
    ov.innerHTML =
      '<div class="qr-sheet" role="dialog" aria-label="학생 접속 QR">' +
        '<div class="qr-sheet-head"><h2>' + (title || '휴대폰으로 찍어서 들어와요') + '</h2><p>카메라 앱으로 QR을 비추면 기록 화면이 열려요</p></div>' +
        '<div class="qr-sheet-body">' +
          '<div class="qr-box">' + this.svg(url) + '</div>' +
          '<div class="qr-url">' + url.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</div>' +
          '<div class="qr-actions">' +
            '<button type="button" class="btn-outline" data-qr="copy">주소 복사</button>' +
            '<button type="button" class="btn-outline" data-qr="full">전체 화면</button>' +
            '<button type="button" data-qr="close">닫기</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    const self = this;
    ov.addEventListener('click', function(e){
      const b = e.target.closest('[data-qr]');
      if (e.target === ov || (b && b.dataset.qr === 'close')) return self.hide();
      if (b && b.dataset.qr === 'copy') return self.copy(url, b);
      if (b && b.dataset.qr === 'full') { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (err) {} }
    });
    document.body.appendChild(ov);
    this._esc = function(e){ if (e.key === 'Escape') self.hide(); };
    document.addEventListener('keydown', this._esc);
  },
  hide: function(){
    const ov = document.getElementById('qrOverlay'); if (ov) ov.remove();
    if (this._esc) document.removeEventListener('keydown', this._esc);
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  }
};
/* ---- 도전장 게시판 공용 (학생 첫 화면 · 관리자 메뉴 둘 다 씀) ---- */
const PB_SAYS = ['누구든 환영해요!', '같은 학년이면 더 좋아요', '처음 해 봐요, 같이 해 봐요', '작은 학교예요, 살살 부탁해요', '지난번엔 아쉬웠어요, 다시 한 번!'];
const PB_HOURS = [9, 10, 11, 13, 14], PB_DOW = ['', '월', '화', '수', '목', '금'];
const PB_KIND = function(p){ return p.kind === 'lvs' ? '실시간 대결 · ' + (p.dur / 60) + '분 한 판' : p.kind === 'lcoop' ? '두 학교 함께 박 깨기 · 1인당 ' + p.per + '회' : p.kind === 'bak' ? '박 터트리기 · 1인당 ' + p.per + '회' : p.kind === 'day' ? '하루 동안 카메라로 뛴 횟수' : (p.dur / 60) + '분 한 판'; };

function pbSlotTxt(s){ if (!s) return ''; const m = /^(\d{4})-(\d{2})-(\d{2})\|(\d+)$/.exec(s); if (!m) return s; const dow = new Date(m[1] + '-' + m[2] + '-' + m[3] + 'T12:00:00+09:00').getUTCDay(); const h = +m[4]; return Number(m[2]) + '/' + Number(m[3]) + '(' + '일월화수목금토'[dow] + ') ' + (h > 12 ? h - 12 : h) + '시'; }
// 두 가능 시간(요일-시)이 겹치는 실제 날짜·시각 (오늘 지금 이후 ~ 마지막 날)
function pbOverlap(a, b, today, hour, last){
  const B = {}; (b || []).forEach(function(x){ B[x] = 1; }); const out = [];
  for (let i = 0; i < 22; i++) {
    const d = new Date(new Date(today + 'T12:00:00+09:00').getTime() + i * 86400000), ds = d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); if (ds > last) break;
    const w = d.getUTCDay(); if (w < 1 || w > 5) continue;
    PB_HOURS.forEach(function(h){ const k = w + '-' + h; if ((a || []).indexOf(k) >= 0 && B[k] && (i > 0 || h > hour)) out.push(ds + '|' + h); });
  }
  return out;
}

    if (v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} return v; }
    try { return JSON.parse(localStorage.getItem(k) || 'null') || {}; } catch (e) { return {}; }
  },
  _lsKey: function(k){ return 'jr_nat_' + k + '|' + APP.shellUrl; },
  _due: function(k, ms){ try { return Date.now() - Number(localStorage.getItem(this._lsKey(k)) || 0) > ms; } catch (e) { return true; } },
  _mark: function(k){ try { localStorage.setItem(this._lsKey(k), String(Date.now())); } catch (e) {} },
  /* 누구나(학생 화면): 오늘 하루 집계만 보냄. gapMs = 마지막으로 보낸 뒤 이만큼 지났을 때만 (0 = 기록 저장 직후, 항상)
     보내는 중에 또 부르면 끝난 뒤 한 번 더 보냄 */
  _busy: null, _again: false,
  reportToday: function(gapMs){
    if (this._busy) { if (!gapMs) this._again = true; return this._busy; }
    const done = function(){ NAT._busy = null; if (NAT._again) { NAT._again = false; return NAT.reportToday(0); } return null; };
    this._busy = this._reportToday(gapMs || 0).then(done, done);
    return this._busy;
  },
  _reportToday: function(gapMs){
    return this.load().then(function(){
      if (!NAT.active() || !NAT.approvalOk() || NAT.moved() || (gapMs && !NAT._due('today', gapMs))) return null;
      NAT._mark('today');
      // 껍데기 4판: 비밀 키를 화면에 두지 않고 껍데기가 직접 오늘 기록을 모아 보냄
      if (NAT.serverReport()) return rpc('natReportToday', [APP.version]);
      if (!NAT.cfg.key) return null;
      return Promise.all([rpc('getAllStudentsPublic'), rpc('getTodaySummaryPublic'), rpc('getRecentRecordsPublic').catch(function(){ return []; })]).then(function(r){
        const students = r[0] || [], today = (r[1] && r[1].list) || [], recent = r[2] || [];
        const d = (function(){ const x = new Date(); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); })();
        const per = {}, idOf = {};
        students.forEach(function(s){ idOf[[s.grade, s.cls, s.number, s.name].join('|')] = String(s.id).trim(); });
        today.forEach(function(t){ per[String(t.id).trim()] = {}; per[String(t.id).trim()][d] = [Number(t.total) || 0, 0]; });
        recent.forEach(function(x){
          if (x.source !== 'camera' || x.status !== 'approved' || x.date !== d) return;
          const id = idOf[[x.grade, x.cls, x.number, x.name].join('|')];
          if (id && per[id] && per[id][d]) per[id][d][1] += Number(x.count) || 0;
        });
        return NAT.buildDays(students, per).then(function(days){
          if (!days.length) return null;
          return NAT.post('report', Object.assign(NAT.meta(students), { days: days, camPartial: recent.length >= 30 }));
        });
      });
    }).catch(function(err){ console.warn('전국 현황판 보내기 실패', err); return null; });
  },
  /* 관리자: 이번 달 + 지난 달 전체를 정확히 다시 보냄 (늦게 넣은 기록·승인 반영). 평소엔 1시간에 한 번 */
  syncAll: function(token, force){
    return this.load().then(function(){
      if (!NAT.active() || !NAT.approvalOk() || NAT.moved() || (!force && !NAT._due('sync', 60 * 60 * 1000))) return null;
      return rpc('getAllDataAdmin', [token]).then(function(all){
        const now = new Date(), pm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const from = pm.getFullYear() + '-' + String(pm.getMonth() + 1).padStart(2, '0') + '-01';
        const per = {};
        (all.records || []).forEach(function(r){
          if (r.status !== 'approved' || !r.date || r.date < from) return;
          const v = ((per[r.studentId] = per[r.studentId] || {})[r.date] = per[r.studentId][r.date] || [0, 0, 0]);
          v[0] += r.count; if (r.source === 'camera') v[1] += r.count; v[2] = Math.max(v[2], r.best || 0);   // 5판: 한 번에 최고 연속
        });
        return NAT.buildDays(all.students || [], per, from).then(function(days){
          return NAT.post('report', Object.assign(NAT.meta(all.students || [], true), { days: days })).then(function(res){
            NAT._mark('sync'); NAT._mark('today');
            return { result: res, days: days };
          });
        });
      });
    });
  }
};

/* ===== 급수제 =====

   지금 급수 = 흰부터 차례로, 모든 항목을 통과한 급수까지 */
const LEVELS = {
  DEFAULT: [
    { name: '흰', color: '#FFFFFF', items: [['양발 모아 뛰기', '100'], ['번갈아 스텝', '50'], ['엇걸어 풀어 스텝', '10'], ['이중 뛰기', '20'], ['뒤로 뛰기', '30']] },
    { name: '노랑', color: '#FFD60A', items: [['양발 모아 뛰기', '150'], ['번갈아 스텝', '70'], ['엇걸어 풀어 스텝', '20'], ['이중 뛰기', '30'], ['뒤로 뛰기', '50']] },
    { name: '초록', color: '#1E8E3E', items: [['이중 뛰기', '50'], ['솔개 뛰기', '1'], ['송골매 뛰기', '1'], ['옆 떨쳐 앞으로 뛰기', ''], ['옆 떨쳐 엇걸어 스텝', ''], ['옆 떨쳐 EB', '4'], ['뒤로 이중 뛰기', '5']] },
    { name: '파랑', color: '#2F56C8', items: [['이중 뛰기', '70'], ['솔개 뛰기', '5'], ['송골매 뛰기', '5'], ['1.5옆 떨쳐 앞으로 뛰기', ''], ['옆 떨쳐 엇걸어 스텝', ''], ['옆 떨쳐 EB', '10'], ['뒤로 이중 뛰기', '20']] },
    { name: '밤', color: '#6B2A20', items: [['이중 뛰기', '100'], ['솔개 뛰기', '10'], ['송골매 뛰기', '10'], ['1.5중 옆 떨쳐 연결', '1'], ['뒤로 이중 뛰기', '30']] },
    { name: '주황', color: '#F07C1E', items: [['이중 뛰기', '120'], ['솔개 뛰기', '15'], ['송골매 뛰기', '15'], ['1.5중 옆 떨쳐 연결', '2'], ['뒤로 이중 뛰기', '40']] },
    { name: '빨강', color: '#E01B1B', items: [['이중 뛰기', '150'], ['십자매 뛰기', '2'], ['1.5중 옆 떨쳐 연결', '10'], ['뒤로 이중 뛰기', '50']] },
    { name: '검은', color: '#1A1A1A', items: [['이중 뛰기', '100'], ['십자매 뛰기', '5'], ['1.5중 옆 떨쳐 연결', '10'], ['TS / 토드연결', '5회/2회'], ['뒤로 이중 뛰기', '60']] },
    { name: '와이어', color: '#9CA3AF', items: [['이중 뛰기', '300'], ['3중 뛰기', '10'], ['TS 스텝', '10'], ['TS 이중 뛰기', '2'], ['토드 연결', '5'], ['뒤로 이중 뛰기', '20']] }
  ],
  table: null, passes: {}, custom: false, _ready: null,
  supported: function(){ return !!(APP.shell && APP.shell.shell >= 3); },
  load: function(force){
    if (force) this._ready = null;
    if (!this._ready) this._ready = Promise.all([
      rpc('getExtraSettings').catch(function(){ return {}; }),
      this.supported() ? rpc('getLevelsPublic').catch(function(){ return {}; }) : Promise.resolve({})
    ]).then(function(r){
      const t = r[0] && r[0].levels;
      LEVELS.custom = Array.isArray(t) && t.length > 0;
      LEVELS.table = LEVELS.custom ? t : LEVELS.DEFAULT;
      LEVELS.passes = r[1] || {};
      LEVELS.extra = r[0] || {};
      return LEVELS;
    });
    return this._ready;
  },
  goal: function(v){ v = String(v == null ? '' : v).trim(); return !v ? '성공' : (/^\d+$/.test(v) ? v + '회' : v); },
  label: function(i){ const l = this.table[i]; return l ? l.name + ' 줄넘기' : ''; },
  /* 학생 한 명: { level: 딴 급수 번호(-1=아직), next: 도전 중인 급수 번호, passed: {"급수|항목": 날짜}, dates: {급수: 딴 날짜} } */
  of: function(id){
    const map = {}, rows = this.passes[String(id).trim()] || [];
    rows.forEach(function(r){ map[r[0] + '|' + r[1]] = r[2] || ''; });
    let level = -1; const dates = {};
    for (let i = 0; i < this.table.length; i++) {
      const items = this.table[i].items || [];
      if (!items.length) break;
      let last = '', all = true;
      for (let j = 0; j < items.length; j++) { const d = map[i + '|' + j]; if (d === undefined) { all = false; break; } if (d > last) last = d; }
      if (!all) break;
      level = i; dates[i] = last;
    }
    return { level: level, next: Math.min(level + 1, this.table.length - 1), done: level >= this.table.length - 1, passed: map, dates: dates };
  },
  chip: function(i, small){
    const l = this.table[i];
    if (!l) return '<span class="lv-chip lv-none">' + (small ? '-' : '아직 없음') + '</span>';
    const dark = /^#(?:[0-9a-f]{2}){3}$/i.test(l.color) && (function(c){ const n = parseInt(c.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 < 150; })(l.color);
    return '<span class="lv-chip" style="background:' + l.color + ';color:' + (dark ? '#fff' : '#1F2937') + '">' + (small ? l.name : this.label(i)) + '</span>';
  },
  /* 급수표 ↔ 글 (관리자 편집용): "흰 #FFFFFF" 다음 줄부터 "항목, 기준" , 빈 줄로 급수 구분 */
  toText: function(t){
    return (t || this.table).map(function(l){ return l.name + ' ' + l.color + '\n' + l.items.map(function(it){ return it[0] + (it[1] ? ', ' + it[1] : ''); }).join('\n'); }).join('\n\n');
  },
  fromText: function(text){
    const out = [];
    String(text || '').replace(/\r/g, '').split(/\n\s*\n/).forEach(function(block){
      const lines = block.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
      if (!lines.length) return;
      const m = lines[0].match(/^(.+?)\s+(#[0-9a-fA-F]{6})$/);
      const lv = { name: (m ? m[1] : lines[0]).replace(/\s*줄넘기$/, '').slice(0, 10), color: m ? m[2] : '#CCCCCC', items: [] };
      lines.slice(1, 13).forEach(function(x){ const i = x.lastIndexOf(','); lv.items.push(i > 0 ? [x.slice(0, i).trim().slice(0, 30), x.slice(i + 1).trim().slice(0, 12)] : [x.slice(0, 30), '']); });
      if (lv.items.length) out.push(lv);
    });
    return out.slice(0, 15);
  }
};

/* ===== "우리 반 / 우리 N학년 / 우리 학교" — 등록된 학생으로 정함 =====
   한 반만 → 우리 반, 한 학년의 여러 반 → 우리 N학년, 그 밖(여러 학년) → 우리 학교
   바뀔 글자에는 data-our="{our} 급수" 처럼 표시해 두고, 학생 목록을 불러온 뒤 applyOurLabel() 로 한꺼번에 바꿈 */
// 클럽판에서 부르는 이름 (관리자 기본 설정에서 클럽 / 도장 / 직접 입력)
function unitWord(v){ v = String(v == null ? '' : v).replace(/[<>&"']/g, '').trim().slice(0, 8); return v || '클럽'; }
function ourLabel(list){
  const classes = {}, grades = {};
  (list || []).forEach(function(s){ const g = String(s.grade == null ? '' : s.grade).trim().replace(/학년$/, ''); classes[g + '-' + String(s.cls == null ? '' : s.cls).trim()] = 1; grades[g] = 1; });
  const gs = Object.keys(grades);
  if (Object.keys(classes).length <= 1) return '우리 반';
  if (gs.length === 1 && gs[0]) return '우리 ' + gs[0] + '학년';
  return '우리 학교';
}
function applyOurLabel(){ const w = APP.ourLabel || '우리 반'; document.querySelectorAll('[data-our]').forEach(function(el){ el.textContent = el.getAttribute('data-our').replace('{our}', w); }); }

    '제주': [['제주', 33.500, 126.531], ['서귀포', 33.254, 126.560]]
  },
  city: function(name){ for (const g in this.CITIES) { const c = this.CITIES[g].find(function(x){ return x[0] === name; }); if (c) return c; } return null; },
  cfg: function(ex){ const j = (ex && ex.journey) || {}; return { start: this.city(j.start) ? j.start : '대전', base: Math.max(0, Number(j.base) || 0) }; },
  // 출발 도시 → 길 전체: [[이름, 누적km, 배로 오는가], ...] (처음과 끝이 출발 도시)
  route: function(start){
    const L = this.LOOP, n = L.length - 1, c = this.city(start) || this.city('대전');
    const dist = function(a, b){ const R = 6371, r = Math.PI / 180, dLa = (b[1] - a[1]) * r, dLo = (b[2] - a[2]) * r;
      const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
    let k = 0, best = Infinity;
    for (let i = 0; i < n; i++) { const d = dist(c, this.city(L[i][0])); if (c[4] ? L[i][0] === c[4] : d < best) { best = d; k = i; if (c[4]) break; } }
    const sea = !!c[3], spur = L[k][0] === c[0] ? 0 : Math.max(10, Math.round(best * (sea ? 1 : 1.3) / 10) * 10);
    const out = [], seg = function(i){ return L[i + 1][1] - L[i][1]; };
    let km = 0;
    if (spur) { out.push([c[0], 0]); km = spur; }
    out.push([L[k][0], km, spur && sea ? 1 : 0]);
    for (let s = 0; s < n; s++) { const i = (k + s) % n; km += seg(i); out.push([L[(i + 1) % n][0], km, L[i + 1][2] || 0]); }
    if (spur) { km += spur; out.push([c[0], km, sea ? 1 : 0]); }
    return out;
  },
  km: function(n){ return n >= 100000 ? Math.round(n / 1000).toLocaleString() : (n / 1000).toLocaleString(undefined, { maximumFractionDigits: 1 }); },
  html: function(total, ex){
    const c = this.cfg(ex), R = this.route(c.start), goalKm = R[R.length - 1][1];
    const m = Math.max(0, total - c.base), goal = goalKm * 1000;
    const laps = Math.floor(m / goal), cur = m - laps * goal, pct = Math.min(100, cur / goal * 100);
    let at = R[0][0], next = R[R.length - 1];
    R.forEach(function(s){ if (cur >= s[1] * 1000) at = s[0]; });
    for (let i = 0; i < R.length; i++) if (R[i][1] * 1000 > cur) { next = R[i]; break; }
    const P = function(km){ return (km / goalKm * 100).toFixed(3) + '%'; };
    const seas = R.map(function(s, i){ return s[2] && i ? '<span class="jr-sea' + (cur < s[1] * 1000 ? ' later' : '') + '" style="left:' + P(R[i - 1][1]) + ';width:' + P(s[1] - R[i - 1][1]) + '" title="배를 타고 가요"></span>' : ''; }).join('');
    // 이름이 겹칠 만큼 가까운 도시: 출발 도시(처음·끝)를 먼저 보이고, 바로 옆 도시는 동그라미만
    const pos = R.map(function(s){ return s[1] / goalKm * 100; }), shown = [0, R.length - 1], near = {};
    for (let i = 1; i < R.length - 1; i++) { if (shown.some(function(j){ return Math.abs(pos[i] - pos[j]) < 3.5; })) near[i] = 1; else shown.push(i); }
    const stops = R.map(function(s, i){ return '<span class="jr-stop' + (cur >= s[1] * 1000 ? ' on' : '') + (i === 0 ? ' first' : i === R.length - 1 ? ' last' : '') + (near[i] ? ' near' : '') + '" style="left:' + P(s[1]) + '" title="' + s[0] + '"><i></i><b>' + s[0] + '</b></span>'; }).join('');
    const self = this, lon = function(n){ const x = self.city(n); return x ? x[2] : 127.5; };
    const runs = [];
    R.forEach(function(s, i){ if (!i) return; const a = R[i - 1], o = (lon(a[0]) + lon(s[0])) / 2, t = s[2] ? 's' : (a[0] + s[0] === '부산여수' || a[0] + s[0] === '여수부산') ? 'b' : o >= 128.3 ? 'm' : o < 127.4 ? 'p' : 'h';
      const r = runs[runs.length - 1]; if (r && r[0] === t) r[2] = s[1]; else runs.push([t, a[1], s[1]]); });
    const land = runs.map(function(r, i){ const L = i ? 40 : 44, Rr = i === runs.length - 1 ? 44 : 40;
      return '<i class="jr-t ' + r[0] + '" style="left:calc(' + P(r[1]) + ' - ' + L + 'px);width:calc(' + P(r[2] - r[1]) + ' + ' + (L + Rr) + 'px)"></i>'; }).join('');
    const isles = R.filter(function(s){ return s[0] === '제주'; }).map(function(s){ return '<i class="jr-isle" style="left:' + P(s[1]) + '"></i>'; }).join('');
    const onSea = !!(next[2] && at !== next[0]);
    const kid = '<img src="' + (APP.channel === 'beta' ? '../' : '') + 'img/journey-kid.webp" alt="">' + (onSea ? '<svg class="jr-boat" viewBox="0 0 70 12"><path d="M2 1 H68 L58 11 H12 Z" fill="#B45309" stroke="#7C2D12" stroke-width="1.2"/></svg>' : '');
    return '<div class="jr-head"><div><span class="jr-tag" data-our="{our} 줄넘기 여행">' + (APP.ourLabel || '우리 반') + ' 줄넘기 여행</span><h2>국토 대장정 <small>' + c.start + ' 출발 · 약 ' + goalKm.toLocaleString() + 'km</small></h2></div>' +
      '<div class="jr-num"><b class="mono">' + this.km(cur) + 'km</b> 왔어요' + (laps ? ' · <b>' + laps + '번</b> 완주!' : '') + '</div></div>' +
      '<div class="jr-scene"><div class="jr-land">' + land + isles + '</div><div class="jr-track"><div class="jr-rope"></div><div class="jr-rest" style="left:' + pct.toFixed(2) + '%"></div>' + seas + stops +
      '<span class="jr-me' + (onSea ? ' sea' : '') + '" style="left:clamp(10px, ' + pct.toFixed(2) + '%, calc(100% - 10px))">' + kid + '</span></div>' +
      '<p class="jr-msg">지금 <b>' + at + '</b> ' + (onSea ? '앞바다에서 배를 타고 가는 중' : '지나는 중') + ' · 다음 <b>' + next[0] + '</b>까지 <b class="mono">' + Math.max(0, next[1] * 1000 - cur).toLocaleString() + '회</b> 남았어요 (줄넘기 1회 = 1m)</p></div>';
  },
  // 관리자 화면 출발 도시 고르기 (시·도별 묶음)
  options: function(sel){ const self = this; return Object.keys(this.CITIES).map(function(g){ return '<optgroup label="' + g + '">' + self.CITIES[g].map(function(c){ return '<option' + (c[0] === sel ? ' selected' : '') + '>' + c[0] + '</option>'; }).join('') + '</optgroup>'; }).join(''); }
};

function applyTheme(t){
  if (!t || !t.accent) return;
  const a = t.accent, r = document.documentElement.style;
  const mix = function(x, y, k){ const p = function(h){ return [1,3,5].map(function(i){ return parseInt(h.slice(i, i+2), 16); }); }; const X = p(x), Y = p(y); return '#' + X.map(function(v, i){ const n = Math.round(v + (Y[i]-v)*k); return (n < 16 ? '0' : '') + n.toString(16); }).join(''); };
  r.setProperty('--coral', a); r.setProperty('--coral-dark', mix(a, '#000000', .16)); r.setProperty('--coral-tint', mix(a, '#FFFFFF', .9)); r.setProperty('--coral-tint-2', mix(a, '#FFFFFF', .75));
  r.setProperty('--coral-grad', 'linear-gradient(135deg,' + a + ' 0%,' + mix(a, '#FFFFFF', .22) + ' 100%)');
  r.setProperty('--accent-rgb', [1,3,5].map(function(i){ return parseInt(a.slice(i, i+2), 16); }).join(','));
  const bg = { light: '#F3F5F8', warm: '#F7F4EE', white: '#FFFFFF' }[t.bg]; r.setProperty('--bg', t.bg === 'tint' ? mix(a, '#FFFFFF', .93) : (bg || '#F3F5F8'));
}
try { applyTheme(JSON.parse(localStorage.getItem('jr_theme') || 'null')); } catch (e) {}

function render(view){
  const tpl = document.getElementById('v-' + view) || document.getElementById('v-main');
  const name = tpl.id.slice(2);
  document.getElementById('app').innerHTML = tpl.innerHTML.split('{{BASE}}').join(APP.base).split('{{TOKEN}}').join(encodeURIComponent(APP.q.token || ''));

  document.querySelectorAll('.laurel-slot').forEach(function(el){ if (!el.firstChild) el.innerHTML = laurelSvg({ dark: true, size: 22, style: 'vertical-align:-5px;margin-right:4px' }); });
}
function showSetup(msg){
  document.getElementById('app').innerHTML =
    '<div class="boot-wrap"><div class="card"><div class="boot-hero"><h1>Jump Us! 점퍼스 · 줄넘기 기록</h1><p>학교 시트와 연결이 필요해요</p></div>' +

    '<div class="tip-box" style="margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.6;"><b>처음 설치하시나요?</b><br>① <a href="' + TEMPLATE_URL + '" target="_blank" rel="noopener"><b>견본 시트 사본 만들기</b></a> → ② 사본에서 확장 프로그램 → Apps Script → <b>배포 → 새 배포 → 웹 앱</b>(실행: 나 · 액세스: <b>모든 사용자</b>) → ③ 나온 주소를 여기에 붙여넣기<br>▶ <a href="' + INSTALL_VIDEO + '" target="_blank" rel="noopener"><b>설치 영상 보기 (1분)</b></a></div>' +
    '<label>학교 시트 웹앱 주소 <input id="setupUrl" placeholder="https://script.google.com/macros/s/…/exec" value="' + (APP.shellUrl || '').replace(/"/g, '&quot;') + '"></label>' +
    '<button type="button" id="setupGo">연결하기</button></div></div>';
  document.getElementById('setupGo').onclick = function(){
    const u = document.getElementById('setupUrl').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(u) && !/^http:\/\/localhost/.test(u)) { alert('주소가 …/exec 로 끝나는 구글 스크립트 웹앱 주소인지 확인해 주세요.'); return; }
    location.href = location.origin + location.pathname + '?s=' + encodeURIComponent(u);
  };
}
document.addEventListener('DOMContentLoaded', function(){
  if (!APP.shellUrl) return showSetup('');
  document.getElementById('app').innerHTML = '<div class="loading">학교 기록을 불러오는 중…<div id="bootSlow" class="hint" style="display:none;margin-top:10px;"></div></div>';
  /* 구글 시트가 늦게 답할 때: 8초 뒤 안내, 25초 뒤 다시 시도 버튼 */
  const slowT = [setTimeout(function(){ const el = document.getElementById('bootSlow'); if (el) { el.style.display = ''; el.textContent = '구글 시트가 평소보다 늦게 답하고 있어요. 조금만 기다려 주세요.'; } }, 8000),
                 setTimeout(function(){ const el = document.getElementById('bootSlow'); if (el) el.innerHTML = '구글 쪽 응답이 많이 늦어요. 잠시 뒤 <button type="button" style="margin-top:8px;" onclick="location.reload()">다시 시도</button>'; }, 25000)];
  Promise.all([rpc('ping'), rpc('getAppSettingsPublic'), rpc('getTheme').catch(function(){ return null; }), APP.club ? rpc('getExtraSettings').catch(function(){ return null; }) : null]).then(function(r){
    slowT.forEach(clearTimeout);
    APP.shell = r[0]; APP.settings = r[1] || {};
    if (APP.club) APP.unit = unitWord(r[3] && r[3].unit);   // 클럽판: "우리 클럽 / 우리 도장 / 우리 ○○"
    if (r[2]) { applyTheme(r[2]); try { localStorage.setItem('jr_theme', JSON.stringify({ accent: r[2].accent, bg: r[2].bg })); } catch (e) {} }
    render(APP.q.page || 'main');
  }).catch(function(err){
    slowT.forEach(clearTimeout);
    showSetup('학교 시트에 연결하지 못했어요: ' + (err.message || err) + '<br>· 배포 설정의 "액세스 권한"이 <b>모든 사용자</b>인지 · 주소가 맞는지 확인해 주세요.');
  });
});

<script>
const VIEWS = {
  "main": function(){
const baseUrl = APP.base;
let studentIds = [];
let allStudents = [];
let barChartInstance;
let summaryCache = { types: [], list: [] };
const NO_TYPE_COLOR = '#B7BDC3'; // 종류 없이 입력된 옛 기록은 항상 회색
const TYPE_COLORS = ['#F26A3D', '#6C5CE7', '#0EA5E9', '#16A34A', '#F59E0B', '#EC4899', '#14B8A6', '#8B5CF6', '#A16207', '#64748B'];
const ADMIN_SESSION_KEY = 'jumpropeAdminSession';
const ADMIN_SESSION_MS = 24 * 60 * 60 * 1000; // 하루 (점프 Live 와 이어진 채로 수업) — 다른 사람이 쓰는 기기면 관리자 메뉴의 로그아웃

function getAdminSession() {
  try {
    const raw = localStorage.getItem(ADMIN_SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.token || !s.ts) return null;
    if (Date.now() - s.ts > ADMIN_SESSION_MS) { localStorage.removeItem(ADMIN_SESSION_KEY); return null; }
    return s;
  } catch (e) { return null; }
}

/* ---- 하루 안에 관리자 로그인 기록이 있으면 로그인 화면을 건너뛰기 ---- */
(function(){
  const session = getAdminSession();
  if (!session) return;
  document.getElementById('navApproval').href = baseUrl + '&page=approval&token=' + session.token;
  document.getElementById('navAdmin').href = baseUrl + '&page=admin&token=' + session.token;
})();

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function nowDateTimeLocal() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
document.getElementById('dateTimeInput').value = nowDateTimeLocal();

/* ---- 스마트 줄넘기(JUMPITNOW) 블루투스로 뛰기 ----
   서비스 FFF0 · 쓰기 FFF6 · 알림 FFF7 · 명령 16바이트(끝 = 앞 15바이트 합)
   09 04 = 자유 시작 / 09 99 = 멈춤 / 01 YY MM DD hh mm ss = 시간 · 뛰는 동안 1초마다 09 04 [초 2바이트] [횟수 4바이트]
   기록은 addRecord 로 넣음 → 승인 절차가 켜져 있으면 선생님 확인 뒤 반영 */
const BLE = { dev: null, tx: null, rx: null, cnt: 0, sec: 0, running: false, sid: '', type: '', trk: null };
// 한 번에 최고 연속(5판): 줄넘기는 횟수만 알려 줘서 약 1초마다 오는 횟수로 봄 — 그 사이 늘어난 수가 0이거나
// 그 친구 평소 빠르기보다 확 줄면(한 번 사이 45%, 두 번 사이 62% 아래) 걸린 것. 걸림과 걸림 사이에 이어 뛴 가장 많은 수가 최고 연속
function trkNew(){ return { t: 0, c: 0, seg: 0, best: 0, rates: [], dip: false, started: false, warm: false, pdc: 0, pdt: 0 }; }
function trkStep(o, c, t){
  if (!o) return;
  if (!o.started) { if (c > 0) { o.started = true; o.best = c; } o.c = c; o.t = t; return; }
  const dt = (t - o.t) / 1000; if (dt < 0.5) return;
  const dc = c - o.c; if (dc < 0) { o.c = c; o.t = t; return; }
  const r = dc / dt, r2 = o.pdt ? (dc + o.pdc) / (dt + o.pdt) : r, med = o.rates.length ? o.rates.slice().sort(function(a, b){ return a - b; })[o.rates.length >> 1] : 0;
  const slow = dc === 0 || (o.rates.length >= 2 && (r < med * 0.45 || (!o.dip && r2 < med * 0.62)));
  o.pdc = dc; o.pdt = dt;
  if (slow) { o.dip = true; o.seg = c; }
  else { if (o.dip && (o.rates.length < 2 || r >= med * 0.6)) o.dip = false;
    if (!o.dip) { if (o.warm) { o.rates.push(r); if (o.rates.length > 8) o.rates.shift(); } o.warm = true; } }
  o.c = c; o.t = t; if (!o.dip) o.best = Math.max(o.best, c - o.seg);
}
function bleFrame(b){ const f = new Uint8Array(16); b.forEach(function(x, i){ f[i] = x; }); let s = 0; for (let i = 0; i < 15; i++) s += f[i]; f[15] = s & 255; return f; }
const bleBcd = function(n){ return parseInt(String(n).padStart(2, '0'), 16); };
function bleSend(b){ return BLE.tx ? BLE.tx.writeValue(bleFrame(b)).catch(function(e){ console.warn('ble', e); }) : Promise.resolve(); }
function bleSt(t, bad){ const el = document.getElementById('bleSt'); el.textContent = t; el.className = 'ble-st' + (bad ? ' bad' : ''); }
function bleShow(){ document.getElementById('bleCnt').innerHTML = BLE.cnt + '<small>회</small>'; }
// 뛴 시간: 첫 줄이 넘어가는 순간부터 끝낼 때까지 (줄넘기를 켜 둔 시간이 아니라 실제로 뛰기 시작한 때부터)
const bleClock = function(ms){ const t = Math.floor(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const bleTimeText = function(ms){ const t = Math.floor(ms / 1000), m = Math.floor(t / 60), s = t % 60; return (m ? m + '분 ' : '') + s + '초'; };
function bleTick(){ const el = document.getElementById('bleTime'); el.textContent = bleClock(BLE.t0 ? (BLE.t1 || Date.now()) - BLE.t0 : 0); el.classList.toggle('on', !!BLE.t0 && !BLE.t1); }
function bleTimerStart(){ if (BLE.t0) return; BLE.t0 = Date.now(); BLE.t1 = 0; clearInterval(BLE.iv); BLE.iv = setInterval(bleTick, 250); bleTick(); }
function bleTimerStop(){ if (BLE.t0 && !BLE.t1) BLE.t1 = Date.now(); clearInterval(BLE.iv); BLE.iv = 0; bleTick(); }
function bleTimerReset(){ clearInterval(BLE.iv); BLE.iv = 0; BLE.t0 = BLE.t1 = 0; bleTick(); }
rpc('getExtraSettings').then(function(x){
  if (x && x.bleRope && navigator.bluetooth) { document.getElementById('bleBtn').style.display = ''; document.getElementById('bleHint').style.display = ''; }
}).catch(function(){});
document.getElementById('bleBtn').addEventListener('click', function(){
  const id = document.getElementById('nameSelect').value, type = document.getElementById('typeSelect').value, msg = document.getElementById('formMsg');
  if (!id) { msg.textContent = '학년/반/이름을 먼저 선택해주세요.'; return; }
  if (!type) { msg.textContent = '줄넘기 종류를 먼저 선택해주세요.'; return; }
  BLE.sid = id; BLE.type = type; BLE.cnt = 0; BLE.sec = 0; BLE.done = false; BLE.trk = trkNew(); bleShow(); bleTimerReset();
  const ns = document.getElementById('nameSelect');
  document.getElementById('bleWho').textContent = (ns.options[ns.selectedIndex] || {}).text + ' · ' + type;
  document.getElementById('bleDone').disabled = true; document.getElementById('bleConn').disabled = false;
  bleSt('줄넘기를 켜고 "연결"을 눌러요 — 목록에서 JUMPITNOW를 골라요');
  bleHelp(false);
  document.getElementById('bleModal').hidden = false;
});
// 안드로이드: 브라우저에 '근처 기기' 권한이 없으면 줄넘기 목록이 비어 있음 → 권한 켜는 길 안내
function bleHelp(show){
  const el = document.getElementById('bleHelp'), ua = navigator.userAgent;
  if (!/Android/i.test(ua)) { el.hidden = true; return; }
  const br = /SamsungBrowser/i.test(ua) ? '삼성 인터넷(삼성 브라우저)' : /Whale/i.test(ua) ? '네이버 웨일' : 'Chrome';
  el.innerHTML = (show ? '<b>줄넘기 목록이 안 보였나요?</b><br>' : '<b>처음이면 확인해요</b> — 창에 "권한(permission)" 안내가 뜨면<br>') +
    '휴대폰 <b>설정 → 애플리케이션 → ' + br + ' → 권한</b>에서 <b>근처 기기</b>(와 <b>위치</b>)를 <b>허용</b>으로 바꾼 뒤, 이 화면으로 돌아와 다시 "연결"을 눌러요. 홈 화면에 설치한 <b>점퍼스</b> 앱이 아니라 <b>' + br + '</b> 앱에서 바꿔야 해요. 블루투스도 켜져 있어야 해요.';
  el.hidden = false;
}
document.getElementById('bleConn').addEventListener('click', async function(){
  const btn = this; btn.disabled = true;
  try {
    bleSt('줄넘기 찾는 중…');
    BLE.dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'JUMPITNOW' }], optionalServices: [0xfff0] });
    BLE.dev.addEventListener('gattserverdisconnected', function(){ if (BLE.running) bleTimerStop(); if (BLE.running) bleSt('연결이 끊겼어요 — 지금까지 ' + BLE.cnt + '회. "끝내고 기록하기"로 저장하거나 다시 연결해요', true); BLE.tx = BLE.rx = null; btn.disabled = false; });
    bleSt('연결하는 중…');
    const g = await BLE.dev.gatt.connect(), sv = await g.getPrimaryService(0xfff0);
    BLE.tx = await sv.getCharacteristic(0xfff6); BLE.rx = await sv.getCharacteristic(0xfff7);
    BLE.rx.addEventListener('characteristicvaluechanged', function(ev){
      const v = new Uint8Array(ev.target.value.buffer);
      if (BLE.done) return;   // 끝낸 뒤(다시 혼자 세는 상태로 돌려놓을 때) 오는 숫자는 무시
      if (v[0] === 0x09 && v[1] === 0x04 && v.length >= 8) { BLE.sec = (v[2] << 8) | v[3]; BLE.cnt = ((v[4] << 24) | (v[5] << 16) | (v[6] << 8) | v[7]) >>> 0; trkStep(BLE.trk, BLE.cnt, Date.now()); bleShow(); if (BLE.cnt > 0) bleTimerStart(); bleSt('세는 중'); }
      else if (v[0] === 0x0b && v[1] === 0x04) { BLE.running = true; BLE.cnt = 0; BLE.trk = trkNew(); bleShow(); bleTimerReset(); bleSt('시작! 뛰어 보세요'); document.getElementById('bleDone').disabled = false; }
    });
    await BLE.rx.startNotifications();
    const d = new Date();
    await bleSend([0x01, bleBcd(d.getFullYear() % 100), bleBcd(d.getMonth() + 1), bleBcd(d.getDate()), bleBcd(d.getHours() % 12), bleBcd(d.getMinutes()), bleBcd(d.getSeconds())]);
    await bleSend([0x09, 0x04]);   // 자유 시작
    setTimeout(function(){ if (!BLE.running) { BLE.running = true; document.getElementById('bleDone').disabled = false; bleSt('연결됐어요 — 뛰어 보세요'); } }, 1500);
  } catch (e) {
    btn.disabled = false;
    // 연결하는 사이 줄넘기와 멀어지면 GATT 연결이 끊김 → 쉬운 말로
    const lost = /GATT|disconnect|NetworkError/i.test(String((e && e.name) || '') + ' ' + String((e && e.message) || e));
    bleSt(e && e.name === 'NotFoundError' ? '줄넘기를 고르지 않았어요 — 줄넘기를 켜고 다시 "연결"' : lost ? '연결하는 동안 줄넘기에서 멀어지면 안 돼요. 줄넘기를 껐다가 켜면 다시 연결할 수 있어요.' : '연결하지 못했어요: ' + (e.message || e) + ' (앱에 연결돼 있으면 끊어 주세요)', true);
    if (!lost) bleHelp(true); else document.getElementById('bleHelp').hidden = true;
  }
});
async function bleClose(){
  try { if (BLE.tx) { await bleSend([0x09, 0x99]); await new Promise(function(r){ setTimeout(r, 300); }); await bleSend([0x09, 0x04]); } } catch (e) {}   // 멈췄다가 다시 혼자 세는 상태로
  try { if (BLE.dev && BLE.dev.gatt.connected) BLE.dev.gatt.disconnect(); } catch (e) {}
  BLE.running = false; BLE.tx = BLE.rx = null;
}
document.getElementById('bleDone').addEventListener('click', async function(){
  const btn = this; btn.disabled = true; bleTimerStop();   // 누른 순간까지가 뛴 시간
  if (BLE.tx) { await bleSend([0x09, 0x99]); await new Promise(function(r){ setTimeout(r, 700); }); }   // 멈춤 → 마지막 숫자
  const cnt = BLE.cnt, took = BLE.t0 ? BLE.t1 - BLE.t0 : 0, best = BLE.trk ? Math.min(BLE.trk.best, cnt) : 0, tookTxt = (took >= 1000 ? ' · ' + bleTimeText(took) : '') + (best > 0 ? ' · 최고 연속 ' + best + '회' : ''); BLE.done = true; await bleClose();
  if (!(cnt > 0)) { bleSt('뛴 횟수가 0이에요 — 기록하지 않았어요', true); return; }
  bleSt('기록하는 중… ' + cnt + '회' + tookTxt);
  const d = new Date(), pad = function(n){ return String(n).padStart(2, '0'); };
  const dateStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), timeStr = pad(d.getHours()) + ':' + pad(d.getMinutes());
  rpc('addRecord', [BLE.sid, dateStr, cnt, timeStr, BLE.type, best]).then(function(res){
    if (res && res.ok === false) { bleSt(res.message || '기록하지 못했어요', true); return; }
    bleSt(cnt + '회' + tookTxt + ' 기록했어요!' + (res && res.approval ? ' 선생님이 확인하면 반영돼요.' : ''));
    showPB(res && res.pb);
    document.getElementById('formMsg').textContent = '스마트 줄넘기로 ' + cnt + '회' + (took >= 1000 ? ' (' + bleTimeText(took) + ' 동안)' : '') + ' 기록했어요.' + (best > 0 ? ' 한 번에 최고 연속 ' + best + '회!' : '') + (res && res.approval ? ' 선생님 승인 후 반영됩니다.' : '');
    google.script.run.withSuccessHandler(drawChart).getStudentsSummary();
    loadPending(); loadTodaySummary(); loadWeekSummary(); loadStreakSummary(); NAT.reportToday(0);
    setTimeout(function(){ document.getElementById('bleModal').hidden = true; }, 1800);
  }).catch(function(e){ bleSt('기록하지 못했어요: ' + (e.message || e), true); btn.disabled = false; });
});
document.getElementById('bleCancel').addEventListener('click', async function(){
  if (BLE.running && BLE.cnt > 0 && !confirm('지금까지 ' + BLE.cnt + '회를 기록하지 않고 닫을까요?')) return;
  BLE.done = true; bleTimerReset(); await bleClose(); document.getElementById('bleModal').hidden = true;
});

/* ---- 친구와 둘이 (판정기 2인 모드): 표를 두 장 받아 판정기에 함께 넘김 ---- */
function fillMates() {
  const g = document.getElementById('gradeSelect').value, c = document.getElementById('classSelect').value, me = document.getElementById('nameSelect').value;
  const sel = document.getElementById('mateSelect'), keep = sel.value;
  sel.innerHTML = '<option value="">선택</option>';
  (allStudents || []).filter(s => String(s.grade) === g && String(s.cls) === c && String(s.id) !== String(me))
    .sort((a, b) => (Number(a.number) || 999) - (Number(b.number) || 999))
    .forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = (s.number ? s.number + '번 ' : '') + s.name; sel.appendChild(o); });
  if (keep && keep !== me) sel.value = keep;
}
['classSelect', 'nameSelect'].forEach(function(id){ document.getElementById(id).addEventListener('change', function(){ if (document.getElementById('mateWrap').style.display !== 'none') fillMates(); }); });
document.getElementById('camera2Btn').addEventListener('click', function(){
  const id = document.getElementById('nameSelect').value;
  const type = document.getElementById('typeSelect').value;
  const msg = document.getElementById('formMsg');
  const wrap = document.getElementById('mateWrap'), mate = document.getElementById('mateSelect');
  if (!id) { msg.textContent = '학년/반/이름(왼쪽에 설 친구)을 먼저 선택해주세요.'; return; }
  if (!type) { msg.textContent = '줄넘기 종류를 먼저 선택해주세요.'; return; }
  if (wrap.style.display === 'none' || !mate.value) {
    if (wrap.style.display === 'none') { wrap.style.display = 'flex'; fillMates(); }
    msg.textContent = '같이 뛸 친구(오른쪽에 설 친구)를 고르고 👥 친구와 둘이를 다시 눌러요.'; mate.focus(); return;
  }
  const win = window.open('', '_blank');
  msg.textContent = '판정기 준비 중...';
  const fail = function(t){ if (win) win.close(); msg.textContent = t; };
  google.script.run.withSuccessHandler(function(r1){
    if (!r1.ok) return fail(r1.message);
    google.script.run.withSuccessHandler(function(r2){
      if (!r2.ok) return fail(r2.message);
      const t2 = new URL(r2.url).searchParams.get('t');
      const url = r1.url + '&t2=' + encodeURIComponent(t2);
      if (win) win.location.href = url;
      msg.innerHTML = '판정기 창이 열렸어요. 화면 왼쪽에 나, 오른쪽에 친구가 서요. 뛰고 나서 <b>"끝내고 기록하기"</b>를 누르면 두 사람 기록이 각자 들어갑니다. 창이 안 열렸다면 <a href="' + url + '" target="_blank">여기</a>를 눌러 주세요.';
    }).withFailureHandler(function(e){ fail('오류: ' + String(e)); }).issueCameraToken(mate.value, type);
  }).withFailureHandler(function(e){ fail('오류: ' + String(e)); }).issueCameraToken(id, type);
});

document.getElementById('cameraBtn').addEventListener('click', function(){
  const id = document.getElementById('nameSelect').value;
  const type = document.getElementById('typeSelect').value;

  if (!id) { msg.textContent = '학년/반/이름을 먼저 선택해주세요.'; return; }

/* ---- 이 기기에 내 이름 기억하기 (2.8.2) ----
   나 혼자 쓰는 기기(내 휴대폰·집 컴퓨터)에서 학생이 켜면, 다음부터 학년·반·이름(·종류)이 골라진 채로 열림.
   학교 시트(껍데기 주소)마다 따로 기억. 교실 공용 기기를 생각해 처음엔 꺼져 있음 */
const ME = {
  key: function(){ return 'jr_me|' + (APP.shellUrl || ''); },
  get: function(){ try { return JSON.parse(localStorage.getItem(ME.key()) || 'null'); } catch (e) { return null; } },
  set: function(v){ try { if (v) localStorage.setItem(ME.key(), JSON.stringify(v)); else localStorage.removeItem(ME.key()); } catch (e) {} },
  note: function(t){ const n = document.getElementById('meNote'); if (n) n.textContent = t || ''; },
  save: function(){
    if (!document.getElementById('meRemember').checked) return;
    const id = document.getElementById('nameSelect').value; if (!id) return;
    const st = (allStudents || []).filter(function(s){ return String(s.id) === String(id); })[0]; if (!st) return;
    ME.set({ g: String(st.grade), c: String(st.cls), id: String(st.id), type: document.getElementById('typeSelect').value || '' });
    ME.note('· ' + st.name + ' 학생으로 기억했어요');
  },
  restore: function(){
    const m = ME.get(); if (!m) return;
    const st = (allStudents || []).filter(function(s){ return String(s.id) === String(m.id); })[0];
    if (!st) { ME.set(null); return; }   // 명단에서 빠진 학생이면 잊음
    const pick = function(id, v){ const el = document.getElementById(id); el.value = v; el.dispatchEvent(new Event('change')); };

};

function showPB(pb){

  if (pb.day) h += '<div class="pbx"><b>축! 하루 최고 기록 갱신!</b><span>오늘 합계 ' + pb.day.today + '회 — 지금까지 가장 많이 뛴 날(' + pb.day.prev + '회)보다 ' + (pb.day.today - pb.day.prev) + '회 더 뛰었어요</span></div>';
  if (pb.best) h += '<div class="pbx st"><b>축! 연속 넘기 최고 기록 갱신!</b><span>걸리지 않고 ' + pb.best.best + '회 — 전 최고 ' + pb.best.prev + '회보다 ' + (pb.best.best - pb.best.prev) + '회 더 이어서 넘었어요</span></div>';

}

function showLead(prefix, list, key, countText){

  const el = document.getElementById(prefix + 'LeadName');
  el.textContent = (names.length <= 3 ? names.join(' · ') : names.slice(0, 2).join(' · ') + ' 외 ' + (names.length - 2) + '명') + ' 학생';
  el.title = names.length > 1 ? names.join(', ') : '';
  document.getElementById(prefix + 'LeadCount').textContent = countText + (names.length > 1 ? ' · 공동 1위 ' + names.length + '명' : '');
}

function drawChart(summary) {
  // 서버는 { types: [...], list: [{..., total, byType}] } 형태로 준다.
  summaryCache = summary || { types: [], list: [] };
  const filterSel = document.getElementById('chartTypeFilter');
  const prev = filterSel.value;
  filterSel.innerHTML = '<option value="">전체 (종류별로 쌓아서)</option>';
  summaryCache.types.forEach(function(t){
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t + '만 보기';
    filterSel.appendChild(opt);
  });
  if (summaryCache.types.indexOf(prev) !== -1) filterSel.value = prev;
  // 학년·반 고르기: 반이 둘 이상일 때만 (학생이 많으면 막대가 너무 촘촘해서). 학년을 고르면 반 고르기가 켜져요. 고른 것은 이 기기에 기억
  const gs = {}, cs = {};
  summaryCache.list.forEach(function(s){ const g = String(s.grade || '').trim(), c = String(s.cls || '').trim(); if (!g) return; gs[g] = 1; (cs[g] = cs[g] || {})[c] = 1; });
  const num = function(a, b){ return (Number(a) || 99) - (Number(b) || 99) || String(a).localeCompare(String(b)); };
  CHART_G.grades = Object.keys(gs).sort(num);
  CHART_G.classes = {}; CHART_G.grades.forEach(function(g){ CHART_G.classes[g] = Object.keys(cs[g]).sort(num); });
  CHART_G.multi = CHART_G.grades.reduce(function(a, g){ return a + CHART_G.classes[g].length; }, 0) > 1;
  if (!CHART_G.loaded) { CHART_G.loaded = true; try { const v = (localStorage.getItem('jr_chart_group2|' + APP.shellUrl) || '|').split('|'); CHART_G.g = v[0] || ''; CHART_G.c = v[1] || ''; } catch (e) {} }
  chartGroupUi();

  const totalSum = summaryCache.list.reduce(function(a, s){ return a + s.total; }, 0);
  document.getElementById('statTotal').textContent = totalSum.toLocaleString();
  // 우리 반 줄넘기 여행 (선생님이 켰을 때)
  LEVELS.load().then(function(){
    const j = LEVELS.extra.journey, card = document.getElementById('journeyCard');
    if (!card) return;
    if (j && j.on) { card.innerHTML = JOURNEY.html(totalSum, LEVELS.extra); card.style.display = ''; } else card.style.display = 'none';
  });
  renderChart();
}

document.getElementById('chartTypeFilter').addEventListener('change', renderChart);
const CHART_G = { g: '', c: '', grades: [], classes: {}, multi: false, loaded: false };
function chartGroupUi(){
  const gSel = document.getElementById('chartGradeFilter'), cSel = document.getElementById('chartClassFilter');
  if (!CHART_G.multi) { gSel.hidden = cSel.hidden = true; CHART_G.g = CHART_G.c = ''; return; }
  const one = CHART_G.grades.length === 1;   // 학년이 하나뿐이면 학년 고르기는 숨기고 반만
  if (one) CHART_G.g = CHART_G.grades[0];
  if (CHART_G.grades.indexOf(CHART_G.g) === -1) CHART_G.g = '';
  gSel.innerHTML = '<option value="">전체 학년</option>' + CHART_G.grades.map(function(g){ return '<option value="' + g + '">' + g + '학년</option>'; }).join('');
  gSel.value = CHART_G.g; gSel.hidden = one;
  const cl = CHART_G.g ? CHART_G.classes[CHART_G.g] : [];
  if (cl.indexOf(CHART_G.c) === -1) CHART_G.c = '';
  cSel.innerHTML = '<option value="">' + (CHART_G.g ? '전체 반' : '반 (학년 먼저)') + '</option>' + cl.map(function(c){ return '<option value="' + c + '">' + c + '반</option>'; }).join('');
  cSel.value = CHART_G.c; cSel.disabled = !CHART_G.g || cl.length < 2; cSel.hidden = false;
}
function chartGroupSave(){ try { localStorage.setItem('jr_chart_group2|' + APP.shellUrl, CHART_G.g + '|' + CHART_G.c); } catch (e) {} }
document.getElementById('chartGradeFilter').addEventListener('change', function(){ CHART_G.g = this.value; CHART_G.c = ''; chartGroupUi(); chartGroupSave(); renderChart(); });
document.getElementById('chartClassFilter').addEventListener('change', function(){ CHART_G.c = this.value; chartGroupSave(); renderChart(); });
// 휴대폰을 세로 ↔ 가로로 돌리면 그래프도 새 너비에 맞게 (Chart.js 가 스스로 못 따라올 때가 있어서 직접)
(function(){ let t = 0; const fit = function(){ clearTimeout(t); t = setTimeout(function(){ ['barChart', 'lineChart'].forEach(function(id){ const c = window.Chart && Chart.getChart(id); if (c) c.resize(); }); }, 180); };
  window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit); })();

function typeColor(name, i) {
  if (name === '(종류 없음)') return NO_TYPE_COLOR;
  return TYPE_COLORS[Math.max(0, i) % TYPE_COLORS.length];
}

// 학생별 누적 기록 표 (그래프 제목을 누르면) — 지금 '보기'에 고른 학년·반·종류 그대로
const tEsc = function(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); };
const TBL = { sort: 'cnt', q: '' };
function tableList() {
  const filter = document.getElementById('chartTypeFilter').value;
  let list = summaryCache.list.slice();
  if (CHART_G.multi && CHART_G.g) list = list.filter(function(s){ return String(s.grade || '').trim() === CHART_G.g && (!CHART_G.c || String(s.cls || '').trim() === CHART_G.c); });
  const val = function(s){ return filter ? (s.byType[filter] || 0) : s.total; };
  if (filter) list = list.filter(function(s){ return val(s) > 0; });
  return { list: list, filter: filter, val: val };
}
function tableOpen() {
  if (document.getElementById('tblOverlay')) return;
  const ov = document.createElement('div'); ov.className = 'qr-overlay'; ov.id = 'tblOverlay';
  ov.innerHTML = '<div class="tbl-sheet" role="dialog" aria-label="학생별 누적 줄넘기 기록 표"><div class="qr-sheet-head"><h2>학생별 누적 줄넘기 기록</h2><p id="tblSub"></p></div>' +
    '<div class="tbl-tools"><span class="seg" id="tblSort"><button data-s="cnt">많이 뛴 순</button><button data-s="name">이름순</button></span><span class="sp"></span><input id="tblQ" type="search" placeholder="이름 찾기"></div>' +
    '<div class="tbl-scroll"><table><thead id="tblHead"></thead><tbody id="tblBody"></tbody><tfoot id="tblFoot"></tfoot></table></div>' +
    '<div class="tbl-foot"><button type="button" class="btn-outline" id="tblClose">닫기</button></div></div>';
  document.body.appendChild(ov);
  const close = function(){ ov.remove(); document.removeEventListener('keydown', esc); };
  const esc = function(e){ if (e.key === 'Escape') close(); };
  ov.addEventListener('click', function(e){ if (e.target === ov) close(); });
  document.getElementById('tblClose').onclick = close; document.addEventListener('keydown', esc);
  document.getElementById('tblSort').onclick = function(e){ const b = e.target.closest('[data-s]'); if (!b) return; TBL.sort = b.dataset.s; tableRender(); };
  document.getElementById('tblQ').oninput = function(e){ TBL.q = e.target.value.trim(); tableRender(); };
  tableRender();
}
function tableRender() {
  const T = tableList(), types = summaryCache.types, f = T.filter;
  const multi = new Set(T.list.map(function(s){ return String(s.grade) + '-' + String(s.cls); })).size > 1;
  const cols = f ? [] : types.filter(function(t){ return T.list.some(function(s){ return (s.byType[t] || 0) > 0; }); });
  const showCols = cols.length > 1 && cols.length <= 4;   // 종류가 2~4개면 종류별 칸도 보여 줌
  let rows = T.list.slice().sort(function(a, b){ return T.val(b) - T.val(a) || String(a.name).localeCompare(String(b.name), 'ko'); });
  const rank = {}; let prev = null, r = 0; rows.forEach(function(s, i){ const v = T.val(s); if (v !== prev) { r = i + 1; prev = v; } rank[s.id] = r; });
  if (TBL.sort === 'name') rows.sort(function(a, b){ return (String(a.grade) + '-' + String(a.cls)).localeCompare(String(b.grade) + '-' + String(b.cls), 'ko', { numeric: true }) || String(a.name).localeCompare(String(b.name), 'ko'); });
  const top = Math.max(1, ...rows.map(T.val)), sum = rows.reduce(function(a, s){ return a + T.val(s); }, 0);
  const shown = TBL.q ? rows.filter(function(s){ return String(s.name).indexOf(TBL.q) >= 0; }) : rows;
  const where = (CHART_G.multi && CHART_G.g ? CHART_G.g + '학년' + (CHART_G.c ? ' ' + CHART_G.c + '반' : ' 전체 반') : '전체') + ' · ' + (f || '모든 종류');
  document.getElementById('tblSub').textContent = where + ' · ' + rows.length + '명 · 합계 ' + sum.toLocaleString() + '회';
  Array.prototype.forEach.call(document.querySelectorAll('#tblSort button'), function(b){ b.classList.toggle('on', b.dataset.s === TBL.sort); });
  document.getElementById('tblHead').innerHTML = '<tr><th style="text-align:center">순위</th><th class="l">이름</th>' + (showCols ? cols.map(function(t){ return '<th class="tc">' + tEsc(t) + '</th>'; }).join('') : '') + '<th>' + (f ? tEsc(f) : '합계') + '</th></tr>';
  document.getElementById('tblBody').innerHTML = shown.map(function(s){
    const v = T.val(s);
    return '<tr class="' + (rank[s.id] <= 3 && v > 0 ? 'top' : '') + '"><td class="rk">' + rank[s.id] + '</td>' +
      '<td class="l nm"><a href="#" data-id="' + tEsc(s.id) + '">' + tEsc(s.name) + '</a>' + (multi ? '<small>' + tEsc(s.grade) + '-' + tEsc(s.cls) + '</small>' : '') + '</td>' +
      (showCols ? cols.map(function(t){ const n = s.byType[t] || 0; return '<td class="tc' + (n ? '' : ' z') + '">' + (n ? n.toLocaleString() : '—') + '</td>'; }).join('') : '') +
      '<td class="sum">' + v.toLocaleString() + '<i style="width:' + Math.round(v / top * 100) + '%"></i></td></tr>';
  }).join('') || '<tr><td colspan="9" class="l" style="color:var(--muted);text-align:center;padding:20px">찾는 학생이 없어요</td></tr>';
  document.getElementById('tblFoot').innerHTML = TBL.q ? '' : '<tr><td></td><td class="l">합계 (' + rows.length + '명)</td>' + (showCols ? cols.map(function(t){ return '<td class="tc">' + rows.reduce(function(a, s){ return a + (s.byType[t] || 0); }, 0).toLocaleString() + '</td>'; }).join('') : '') + '<td>' + sum.toLocaleString() + '</td></tr>';
  Array.prototype.forEach.call(document.querySelectorAll('#tblBody a[data-id]'), function(a){ a.onclick = function(e){ e.preventDefault(); window.top.location.href = baseUrl + '&page=student&id=' + a.dataset.id + '&_=' + Date.now(); }; });
}
document.getElementById('chartTitle').addEventListener('click', tableOpen);
document.getElementById('chartTitle').addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tableOpen(); } });

function renderChart() {
  const types = summaryCache.types;
  const filter = document.getElementById('chartTypeFilter').value;
  let list = summaryCache.list.slice();
  if (CHART_G.multi && CHART_G.g) list = list.filter(function(s){ return String(s.grade || '').trim() === CHART_G.g && (!CHART_G.c || String(s.cls || '').trim() === CHART_G.c); });
  let datasets;

  if (filter) {
    // 한 종류만: 그 종류 합계가 있는 학생만, 많이 뛴 순
    list = list.filter(function(s){ return (s.byType[filter] || 0) > 0; })
               .sort(function(a, b){ return (b.byType[filter] || 0) - (a.byType[filter] || 0); });
    const color = typeColor(filter, types.indexOf(filter));
    datasets = [{ label: filter, data: list.map(function(s){ return s.byType[filter] || 0; }), backgroundColor: color, borderRadius: 4 }];
  } else {
    // 전체: 종류별로 색을 달리해 한 막대에 쌓기 (총합 많은 순)
    datasets = types.map(function(t, i){
      return {
        label: t,
        data: list.map(function(s){ return s.byType[t] || 0; }),
        backgroundColor: typeColor(t, i),
        borderRadius: 2,
        stack: 'total'
      };
    }).filter(function(ds){ return ds.data.some(function(v){ return v > 0; }); });
  }
  studentIds = list.map(function(s){ return s.id; });

  const ctx = document.getElementById('barChart').getContext('2d');
  if (barChartInstance) barChartInstance.destroy();
  // 막대 위에 합계 횟수 (종류별로 쌓았으면 쌓은 합계)
  const totalLabels = {
    id: 'totalLabels',
    afterDatasetsDraw: function(chart) {
      const c = chart.ctx, n = chart.data.labels.length;
      const metas = chart.data.datasets.map(function(ds, i){ return chart.getDatasetMeta(i); }).filter(function(m){ return !m.hidden; });
      if (!metas.length) return;
      const barW = metas[0].data[0] ? metas[0].data[0].width : 0;
      const size = Math.max(9, Math.min(14, Math.round(barW / 4)));
      c.save();
      c.font = '700 ' + size + "px 'Pretendard', 'Noto Sans KR', sans-serif";
      c.fillStyle = '#374151'; c.textAlign = 'center'; c.textBaseline = 'bottom';
      // 막대 칸(한 학생 자리)보다 숫자가 넓으면 옆 숫자와 겹치니 모두 생략 (휴대폰처럼 좁을 때 — 막대를 누르거나 표로 보기)
      const slot = chart.chartArea ? chart.chartArea.width / Math.max(1, n) : 0;
      let widest = 0;
      for (let j = 0; j < n; j++) { let v = 0; metas.forEach(function(m){ v += chart.data.datasets[m.index].data[j] || 0; }); if (v) widest = Math.max(widest, c.measureText(v.toLocaleString()).width); }
      if (slot && widest > slot - 2) {   // 먼저 글자를 줄여 보고(9px까지), 그래도 넘치면 생략
        const fit = Math.floor(size * (slot - 2) / widest);
        if (fit < 9) { c.restore(); return; }
        c.font = '700 ' + fit + "px 'Pretendard', 'Noto Sans KR', sans-serif";
      }
      for (let j = 0; j < n; j++) {
        let sum = 0, top = Infinity, x = null;
        metas.forEach(function(m){ const el = m.data[j]; const v = chart.data.datasets[m.index].data[j] || 0; if (!el || !v) return; sum += v; top = Math.min(top, el.y); x = el.x; });
        if (!sum || x == null) continue;
        const t = sum.toLocaleString();
        if (c.measureText(t).width > barW * 1.6 + 8) continue;   // 학생이 많아 막대가 아주 좁으면 생략 (툴팁으로)
        c.fillText(t, x, top - 3);
      }
      c.restore();
    }
  };
  barChartInstance = new Chart(ctx, {
    type: 'bar',
    plugins: [totalLabels],
    data: { labels: list.map(function(s){ return s.name; }), datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: !WIDE_MQ.matches,   // 넓은 PC 화면에서는 칸 높이에 맞춤
      aspectRatio: window.innerWidth < 600 ? 1.15 : 2,   // 휴대폰 세로 화면: 막대가 납작해지지 않게 높게
      layout: { padding: { top: 18 } },
      onClick: function(evt, elements) {
        if (elements.length > 0) {
          const idx = elements[0].index;
          window.top.location.href = baseUrl + '&page=student&id=' + studentIds[idx] + '&_=' + Date.now();
        }
      },
      plugins: {
        legend: { labels: { font: { family: "'Pretendard', 'Noto Sans KR', sans-serif" } } },
        tooltip: {
          callbacks: {
            footer: function(items) {
              if (filter || !items.length) return '';
              const s = list[items[0].dataIndex];
              return '합계 ' + s.total.toLocaleString() + '회';
            }
          }
        }
      },
      scales: {
        y: { beginAtZero: true, grace: '14%', stacked: !filter, ticks: { font: { family: "'Pretendard', sans-serif" } }, grid: { color: '#EEF0F3' } },
        x: { stacked: !filter, ticks: { font: { family: "'Noto Sans KR', sans-serif" } }, grid: { display: false } }
      }
    }
  });
}
