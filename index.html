  "student": function(){
const baseUrl = APP.base;
const studentId = APP.q.id || "";
let chartInstance;
const NO_TYPE_COLOR = '#B7BDC3';
const TYPE_COLORS = ['#F26A3D', '#6C5CE7', '#0EA5E9', '#16A34A', '#F59E0B', '#EC4899', '#14B8A6', '#8B5CF6', '#A16207', '#64748B'];

document.getElementById('authForm').addEventListener('submit', function(e){
  e.preventDefault();
  const pw = document.getElementById('authPw').value;
  document.getElementById('authMsg').textContent = '확인 중...';
  google.script.run
    .withSuccessHandler(handleResult)
    .withFailureHandler(function(err){
      document.getElementById('authMsg').textContent = '오류: ' + String(err);
    })
    .getStudentDetailAuthed(studentId, pw);
});

function handleResult(detail) {
  if (detail && detail.serverError) {
    document.getElementById('authMsg').textContent = '서버 오류: ' + detail.message;
    return;
  }
  if (detail && detail.notFound) {
    document.getElementById('authCard').innerHTML =
      '<h2>학생 정보를 찾을 수 없습니다</h2>' +
      '<p>요청한 ID: <code>' + detail.requestedId + '</code></p>' +
      '<p>전체 학생 수: ' + detail.totalStudents + '명</p>';
    return;
  }
  if (detail && detail.wrongPassword) {
    document.getElementById('authMsg').textContent = detail.message;
    document.getElementById('authPw').value = '';
    document.getElementById('authPw').focus();
    return;
  }
  // 인증 성공
  document.getElementById('authCard').style.display = 'none';
  document.getElementById('dataArea').style.display = 'block';
  render(detail);
}

function render(detail) {
  document.getElementById('pageTitle').textContent =
    detail.info.grade + '학년 ' + detail.info.cls + '반 ' + detail.info.name + ' 학생';
  // 나의 급수 (껍데기 3판): 지금 급수 + 다음 급수 항목별 통과 여부
  if (LEVELS.supported()) LEVELS.load().then(function(){
    const me = LEVELS.of(studentId);
    const nx = LEVELS.table[me.next];
    let html = '<p style="margin:0 0 6px;">지금 급수: ' + LEVELS.chip(me.level) + (me.level >= 0 && me.dates[me.level] ? ' <span class="hint">(' + me.dates[me.level] + ' 인증)</span>' : '') + '</p>';
    if (me.done) html += '<p class="hint" style="margin:0;">마지막 급수까지 모두 땄어요! 대단해요.</p>';
    else if (nx) {
      html += '<p class="hint" style="margin:8px 0 0;">다음 도전: ' + LEVELS.chip(me.next) + ' — 선생님 앞에서 걸리지 않고 성공하면 선생님이 체크해 줘요.</p><div class="lv-items">' +
        nx.items.map(function(it, j){ const ok = me.passed[me.next + '|' + j] !== undefined; return '<div class="' + (ok ? 'ok' : '') + '">' + (ok ? '✔ ' : '') + it[0] + ' <b>' + LEVELS.goal(it[1]) + '</b></div>'; }).join('') + '</div>';
    }
    document.getElementById('myLevel').innerHTML = html;
    document.getElementById('myLevelCard').style.display = '';
  });
  const approvedOnly = detail.daily.filter(d => d.status === 'approved');

  // 날짜별 누적: 전체 합계 선 + 종류별 선
  const dates = [...new Set(approvedOnly.map(d => d.date))];
  const types = (detail.types || []).slice();
  approvedOnly.forEach(d => { if (types.indexOf(d.type) === -1) types.push(d.type); });

  const perTypeDaily = {};   // type -> { date -> count }
  types.forEach(t => perTypeDaily[t] = {});
  approvedOnly.forEach(d => { perTypeDaily[d.type][d.date] = (perTypeDaily[d.type][d.date] || 0) + d.count; });

  function cumulativeSeries(map) {
    let cum = 0;
    return dates.map(dt => { cum += (map[dt] || 0); return cum; });
  }
  const totalMap = {};
  approvedOnly.forEach(d => { totalMap[d.date] = (totalMap[d.date] || 0) + d.count; });

  const datasets = [{
    label: '전체 누적',
    data: cumulativeSeries(totalMap),
    borderColor: '#1F2937',
    backgroundColor: 'rgba(18,25,31,0.06)',
    pointBackgroundColor: '#1F2937',
    pointRadius: 4,
    borderWidth: 3,
    fill: true,
    tension: 0.3
  }];
  types.forEach((t, i) => {
    const series = cumulativeSeries(perTypeDaily[t]);
    if (!series.some(v => v > 0)) return; // 이 학생이 한 번도 안 한 종류는 선을 그리지 않음
    datasets.push({
      label: t,
      data: series,
      borderColor: (t === '(종류 없음)') ? NO_TYPE_COLOR : TYPE_COLORS[i % TYPE_COLORS.length],
      pointBackgroundColor: (t === '(종류 없음)') ? NO_TYPE_COLOR : TYPE_COLORS[i % TYPE_COLORS.length],
      pointRadius: 3,
      borderWidth: 2,
      borderDash: [6, 4],
      fill: false,
      tension: 0.3
    });
  });

  const ctx = document.getElementById('lineChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: dates, datasets: datasets },
    options: {
      responsive: true,
      plugins: { legend: { labels: { font: { family: "'Pretendard', 'Noto Sans KR', sans-serif" } } } },
      scales: {
        y: { beginAtZero: true, ticks: { font: { family: "'Pretendard', sans-serif" } }, grid: { color: '#EEF0F3' } },
        x: { ticks: { font: { family: "'Pretendard', sans-serif" } }, grid: { display: false } }
      }
    }
  });

  renderDailyTable(detail.daily);
}

function renderDailyTable(daily) {
  const tbody = document.querySelector('#dailyTable tbody');
  tbody.innerHTML = '';
  if (daily.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="hint">아직 입력된 기록이 없습니다.</td></tr>';
    return;
  }
  const statusLabel = { approved: '승인', pending: '대기중', rejected: '거절됨' };
  // 최신 날짜가 위로 오도록 뒤집어서 표시
  [...daily].reverse().forEach(function(d){
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="mono">' + d.date + (d.time ? ' <span class="hint">' + d.time + '</span>' : '') + '</td>' +
      '<td>' + (d.type || '') + (d.source === 'camera' ? ' <span title="카메라 판정기로 기록">📷</span>' : '') + '</td>' +
      '<td class="mono">' + d.count.toLocaleString() + '회</td>' +
      '<td class="mono">' + d.cumulative.toLocaleString() + '회</td>' +
      '<td><span class="badge badge-' + d.status + '">' + (statusLabel[d.status] || d.status) + '</span></td>';
    tbody.appendChild(tr);
  });
}

},
  "adminLogin": function(){
const baseUrl = APP.base;
const nextPage = APP.q.next || "admin";
const ADMIN_SESSION_KEY = 'jumpropeAdminSession';
const ADMIN_SESSION_MS = 24 * 60 * 60 * 1000; // 하루 (점프 Live 와 이어진 채로 수업) — 다른 사람이 쓰는 기기면 관리자 메뉴의 로그아웃

function getAdminSession() {
  try {
    const raw = localStorage.getItem(ADMIN_SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.token || !s.ts) return null;
    if (Date.now() - s.ts > ADMIN_SESSION_MS) { localStorage.removeItem(ADMIN_SESSION_KEY); return null; }
    return s;
  } catch (e) { return null; }
}

/* 하루 안에 로그인한 기록이 남아있으면 비밀번호 입력 없이 바로 통과 */
(function(){
  const session = getAdminSession();
  if (session) {
    window.top.location.href = baseUrl + '&page=' + nextPage + '&token=' + session.token;
  }
})();

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  google.script.run.withSuccessHandler(function(res){
    if (res.ok) {
      try {
        localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ token: res.token, ts: Date.now() }));
      } catch (e) { /* 저장 실패해도 로그인 자체는 진행 */ }
      window.top.location.href = baseUrl + '&page=' + nextPage + '&token=' + res.token;
    } else {
      document.getElementById('msg').textContent = res.message;
    }
  }).verifyAdminPassword(pw);
});

},
  "approval": function(){
const baseUrl = APP.base;
const token = APP.q.token || "";

function loadList() {
  google.script.run
    .withSuccessHandler(function(list){
      document.getElementById('body').style.display = 'block';
      document.getElementById('deniedMsg').style.display = 'none';
      renderTable(list);
    })
    .withFailureHandler(function(err){
      const msg = String(err);
      const loginLink = baseUrl + '&page=adminLogin&next=approval';
      if (msg.indexOf('권한') !== -1) {
        try { localStorage.removeItem('jumpropeAdminSession'); } catch (e) {}
        document.getElementById('deniedMsg').innerHTML = '접근 권한이 없거나 로그인이 만료되었습니다. <a href="' + loginLink + '">다시 로그인</a>';
      } else {
        document.getElementById('deniedMsg').innerHTML = '목록을 불러오지 못했습니다: ' + msg + ' <a href="' + loginLink + '">다시 로그인</a>';
      }
      document.getElementById('deniedMsg').style.display = 'block';
      document.getElementById('body').style.display = 'none';
    })
    .getPendingRecords(token);
}
loadList();

function renderTable(list) {
  const tbody = document.querySelector('#pendingTable tbody');
  tbody.innerHTML = '';
  document.getElementById('emptyMsg').style.display = (list.length === 0) ? 'block' : 'none';
  list.forEach(function(r){
    const tr = document.createElement('tr');
    tr.dataset.recordId = r.recordId;
    tr.innerHTML =
      '<td>' + r.grade + '</td>' +

// 승인·거절: 누르는 즉시 화면에서 처리하고 서버에는 뒤에서 보냄 (목록을 다시 받아 오지 않아 빠름). 실패하면 줄을 되돌림
function natSoon(){
  // 승인한 기록을 전국 현황판에도 반영 (여러 개를 연달아 승인하면 마지막 뒤 한 번만)
  clearTimeout(NAT._approveTimer);
  NAT._approveTimer = setTimeout(function(){ NAT.syncAll(token, true).catch(function(){}); }, 2500);
}
function counts(){
  const n = document.querySelectorAll('#pendingTable tbody tr:not(.gone)').length;
  document.getElementById('pendingCount').textContent = n ? '(' + n + '건)' : '';
  document.getElementById('approveAllBtn').style.display = n > 1 ? '' : 'none';
  document.getElementById('emptyMsg').style.display = document.querySelectorAll('#pendingTable tbody tr').length ? 'none' : 'block';
}
function act(tr, approve){
  const recordId = tr.dataset.recordId, cell = tr.lastElementChild, keep = cell.innerHTML;
  tr.classList.add('gone'); cell.innerHTML = '<span class="hint">' + (approve ? '승인됨 ✓' : '거절됨') + '</span>';
  counts();
  return rpc(approve ? 'approveRecord' : 'rejectRecord', [token, recordId]).then(function(){
    setTimeout(function(){ if (tr.parentNode) tr.parentNode.removeChild(tr); counts(); }, 800);
    if (approve) natSoon();
  }).catch(function(err){
    tr.classList.remove('gone'); cell.innerHTML = keep; counts();
    document.getElementById('approveMsg').textContent = '처리하지 못했어요: ' + (err.message || err) + ' (다시 눌러 주세요)';
    throw err;
  });
}
document.querySelector('#pendingTable tbody').addEventListener('click', function(e){
  const btn = e.target.closest('button');
  if (!btn) return;
  const tr = btn.closest('tr');
  if (tr.classList.contains('gone')) return;
  if (btn.dataset.action === 'approve') act(tr, true).catch(function(){});
  else if (btn.dataset.action === 'reject') {
    if (!confirm('이 기록을 거절하시겠습니까? (학생에게는 반영되지 않습니다)')) return;
    act(tr, false).catch(function(){});
  }
});
document.getElementById('approveAllBtn').addEventListener('click', function(){
  const rows = Array.prototype.slice.call(document.querySelectorAll('#pendingTable tbody tr:not(.gone)'));
  if (!rows.length || !confirm(rows.length + '건을 모두 승인할까요?')) return;
  const msg = document.getElementById('approveMsg');
  let done = 0, fail = 0, i = 0;
  msg.textContent = '승인 중... (0/' + rows.length + ')';
  function next(){   // 4건씩 동시에 보냄
    if (i >= rows.length) return Promise.resolve();
    const tr = rows[i++];
    return act(tr, true).then(function(){ done++; }, function(){ fail++; }).then(function(){ msg.textContent = '승인 중... (' + (done + fail) + '/' + rows.length + ')'; return next(); });
  }
  Promise.all([next(), next(), next(), next()]).then(function(){
    msg.textContent = done + '건 승인했어요.' + (fail ? ' ' + fail + '건은 실패했어요. 다시 눌러 주세요.' : '');
  });
});

(function(){

let themeState = { accent: '#F26A3D', bg: 'light', presets: [], bgs: [] };
function mixHex(a, b, t){
  const x = [1,3,5].map(function(i){ return parseInt(a.slice(i,i+2),16); });
  const y = [1,3,5].map(function(i){ return parseInt(b.slice(i,i+2),16); });
  return '#' + x.map(function(v,i){ const n = Math.round(v + (y[i]-v)*t); return (n<16?'0':'') + n.toString(16); }).join('').toUpperCase();
}
function applyThemePreview(){
  const a = themeState.accent, r = document.documentElement.style;
  r.setProperty('--coral', a); r.setProperty('--coral-dark', mixHex(a,'#000000',0.16));
  r.setProperty('--coral-tint', mixHex(a,'#FFFFFF',0.9)); r.setProperty('--coral-tint-2', mixHex(a,'#FFFFFF',0.75));
  r.setProperty('--coral-grad', 'linear-gradient(135deg,' + a + ' 0%,' + mixHex(a,'#FFFFFF',0.22) + ' 100%)');
  r.setProperty('--accent-rgb', [1,3,5].map(function(i){ return parseInt(a.slice(i,i+2),16); }).join(','));
  const bgDef = themeState.bgs.filter(function(b){ return b.id === themeState.bg; })[0];
  if (bgDef) r.setProperty('--bg', bgDef.color === 'accent' ? mixHex(a,'#FFFFFF',0.93) : bgDef.color);
  document.getElementById('themeCustom').value = a;
  Array.prototype.forEach.call(document.querySelectorAll('#themeSwatches .swatch'), function(el){ el.classList.toggle('on', el.dataset.accent.toUpperCase() === a.toUpperCase()); });
}
function renderThemeUI(){

    sw.addEventListener('click', function(){ themeState.accent = p.accent; applyThemePreview(); });

  const sel = document.getElementById('themeBg'); sel.innerHTML = '';

function renderStuClasses() {
  const gs = [], cs = {};
  currentStudents.forEach(function(s){ const g = String(s.grade), c = String(s.cls); if (gs.indexOf(g) < 0) gs.push(g); (cs[g] = cs[g] || []).indexOf(c) < 0 && cs[g].push(c); });
  gs.sort(function(a, b){ return a - b; });
  if (stuFilter.g && gs.indexOf(stuFilter.g) < 0) stuFilter = { g: '', c: '' };
  const cl = stuFilter.g ? (cs[stuFilter.g] || []).slice().sort(function(a, b){ return a - b; }) : [];
  if (stuFilter.c && cl.indexOf(stuFilter.c) < 0) stuFilter.c = '';
  const gSel = document.getElementById('stuGrade'), cSel = document.getElementById('stuClass');
  gSel.innerHTML = '<option value="">전체 학년</option>' + gs.map(function(g){ return '<option value="'+escAttr_(g)+'">'+escAttr_(g)+'학년</option>'; }).join('');
  gSel.value = stuFilter.g;
  cSel.innerHTML = '<option value="">' + (stuFilter.g ? '전체 반' : '반') + '</option>' + cl.map(function(c){ return '<option value="'+escAttr_(c)+'">'+escAttr_(c)+'반</option>'; }).join('');
  cSel.value = stuFilter.c; cSel.disabled = !stuFilter.g;
  gSel.style.display = cSel.style.display = gs.length > 1 || cl.length > 1 || (gs.length === 1 && (cs[gs[0]] || []).length > 1) ? '' : 'none';
}

tbodyEl.addEventListener('dragover', function(e){
  e.preventDefault();
  if (!draggedRow) return;
  const afterElement = getDragAfterElement_(tbodyEl, e.clientY);
  if (afterElement == null) {
    tbodyEl.appendChild(draggedRow);
  } else {
    tbodyEl.insertBefore(draggedRow, afterElement);
  }
});

function getDragAfterElement_(container, y) {
  const rows = [...container.querySelectorAll('tr:not(.dragging)')];
  return rows.reduce(function(closest, child){
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    }
    return closest;
  }, { offset: -Infinity }).element;
}

/* ---- 엑셀 붙여넣기 등록: 붙여넣는 즉시 표로 미리 보여주고 확인 후 등록 ---- */
let bulkParsed = [];
let currentStudents = [];   // renderTable에서 채움 (중복 확인용)
function parseBulk(raw) {
  const out = [];
  raw.split('\n').forEach(function(line){
    const t = line.replace(/\r/g, '');
    if (!t.trim()) return;
    let parts = t.split('\t');
    if (parts.length < 4) parts = t.split(',');
    if (parts.length < 4) parts = t.trim().split(/\s+/);   // 띄어쓰기로 구분: 6 1 3 김하늘 (또는 6학년 1반 3번 김하늘)
    parts = parts.map(function(p){ return p.trim(); });
    [0, 1, 2].forEach(function(i){ if (parts[i]) parts[i] = parts[i].replace(/^(\d+)\s*(학년|반|번)$/, '$1'); });
    const first = parts[0] || '';
    if (/^학년$|^grade$/i.test(first)) return; // 제목 줄
    const row = { grade: parts[0] || '', cls: parts[1] || '', number: parts[2] || '', name: parts[3] || '', password: parts[4] || '', ok: true, why: '' };
    if (parts.length < 4 || !row.name) { row.ok = false; row.why = '형식 오류 (학년·반·번호·이름 순서 확인)'; }
    else if (!row.grade || !row.cls) { row.ok = false; row.why = '학년 또는 반이 비었어요'; }
    else if (row.password && row.password.length < 4) { row.ok = false; row.why = '비밀번호는 4자 이상'; }
    else if (currentStudents.some(function(s){ return String(s.grade) === row.grade && String(s.cls) === row.cls && String(s.number || '') === row.number && String(s.name) === row.name; })) { row.ok = false; row.why = '이미 등록됨'; }
    else if (out.some(function(o){ return o.ok && o.grade === row.grade && o.cls === row.cls && o.number === row.number && o.name === row.name; })) { row.ok = false; row.why = '붙여넣은 내용 안에서 중복'; }
    out.push(row);
  });
  return out;
}
function renderBulkPreview() {
  const raw = document.getElementById('bulkText').value;
  const wrap = document.getElementById('bulkPreviewWrap');
  const tbody = document.querySelector('#bulkPreview tbody');
  bulkParsed = raw.trim() ? parseBulk(raw) : [];
  tbody.innerHTML = '';
  if (bulkParsed.length === 0) { wrap.style.display = 'none'; document.getElementById('bulkAddBtn').disabled = true; document.getElementById('bulkAddBtn').textContent = '등록'; return; }
  wrap.style.display = 'block';
  let okCount = 0;
  bulkParsed.forEach(function(r, i){
    if (r.ok) okCount++;
    const tr = document.createElement('tr');
    tr.style.opacity = r.ok ? '1' : '0.6';
    tr.innerHTML = '<td class="mono">' + (i + 1) + '</td><td>' + esc(r.grade) + '</td><td>' + esc(r.cls) + '</td><td>' + esc(r.number) + '</td><td><b>' + esc(r.name) + '</b></td>' +
      '<td>' + (r.password ? '●●●●' : '<span class="hint">1234</span>') + '</td>' +
      '<td>' + (r.ok ? '<span class="badge badge-approved">등록 예정</span>' : '<span class="badge badge-rejected">' + esc(r.why) + '</span>') + '</td>';
    tbody.appendChild(tr);
  });
  document.getElementById('bulkPreviewSummary').textContent = '총 ' + bulkParsed.length + '줄 중 ' + okCount + '명 등록 예정' + (bulkParsed.length - okCount ? ', ' + (bulkParsed.length - okCount) + '줄 제외' : '');
  document.getElementById('bulkAddBtn').disabled = okCount === 0;
  document.getElementById('bulkAddBtn').textContent = okCount ? okCount + '명 등록' : '등록';
}
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---- 오프라인판 자료 불러오기 ----
   백업 파일 모양: { students:[{id,grade,cls,number,name}], records:[{studentId,date:'YYYY-MM-DD',count,time:'HH:mm'}] }
   학생은 학년·반·번호·이름으로 이 학교 학생과 맞춤 → 기록을 addRecord 로 한 건씩 넣음(승인 절차가 켜져 있으면 잠깐 끄고 넣은 뒤 되돌림)
   이미 같은 학생·날짜·횟수 기록이 있으면 건너뜀 */
const OFF = { data: null, online: [], have: null, plan: [], miss: [] };
const offKey = function(g, c, n, nm){ return [g, c, n, nm].map(function(v){ return String(v == null ? '' : v).trim(); }).join('|'); };
const offRpc = function(fn, args){ return rpc(fn, args); };
document.getElementById('offImpPick').addEventListener('click', function(){ document.getElementById('offImpFile').click(); });
document.getElementById('offImpFile').addEventListener('change', function(e){
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = function(){
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.students) || !Array.isArray(d.records)) throw new Error('형식');
      OFF.data = d; offPrepare();
    } catch (err) { offMsg('오프라인판 백업 파일이 아니에요 — "내보내기"로 받은 .json 파일을 골라 주세요.', true); document.getElementById('offImpBox').style.display = 'block'; }
  };
  rd.readAsText(f);
});
function offMsg(t, bad){ const el = document.getElementById('offImpMsg'); el.textContent = t; el.style.color = bad ? 'var(--danger)' : ''; }
function offPrepare(){
  document.getElementById('offImpBox').style.display = 'block';
  offMsg('이 학교 학생·기록을 확인하는 중…');
  document.getElementById('offImpGo').disabled = true;
  const sel = document.getElementById('offImpType');
  sel.innerHTML = (jumpTypes || []).map(function(t){ return '<option>' + String(t).replace(/</g, '&lt;') + '</option>'; }).join('');
  offRpc('getAllDataAdmin', [token]).then(function(all){
    OFF.online = all.students || [];
    const idByKey = {}; OFF.online.forEach(function(s){ idByKey[offKey(s.grade, s.cls, s.number, s.name)] = s.id; });
    OFF.have = {}; (all.records || []).forEach(function(r){ OFF.have[r.studentId + '|' + r.date + '|' + r.count] = true; });
    const d = OFF.data, stuById = {}; d.students.forEach(function(s){ stuById[s.id] = s; });
    OFF.miss = []; const missSet = {};
    OFF.plan = []; let dup = 0, bad = 0;
    d.records.forEach(function(r){
      const s = stuById[r.studentId]; const cnt = Math.round(Number(r.count));
      if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(String(r.date || '')) || !(cnt > 0) || cnt > 5000) { bad++; return; }
      const sid = idByKey[offKey(s.grade, s.cls, s.number, s.name)];
      if (!sid) { const k = offKey(s.grade, s.cls, s.number, s.name); if (!missSet[k]) { missSet[k] = 1; OFF.miss.push(s); } return; }
      if (OFF.have[sid + '|' + r.date + '|' + cnt]) { dup++; return; }
      OFF.plan.push({ sid: sid, date: r.date, count: cnt, time: String(r.time || '').slice(0, 5) });
    });
    const days = {}; OFF.plan.forEach(function(p){ days[p.date] = 1; });
    const ds = Object.keys(days).sort();
    document.getElementById('offImpSum').innerHTML = '백업 파일: 학생 <b>' + d.students.length + '명</b> · 기록 <b>' + d.records.length + '건</b><br>' +
      '가져올 기록 <b>' + OFF.plan.length + '건</b>' + (ds.length ? ' (' + ds[0] + ' ~ ' + ds[ds.length - 1] + ')' : '') +
      (dup ? ' · 이미 있는 기록 ' + dup + '건 건너뜀' : '') + (bad ? ' · 알아볼 수 없는 기록 ' + bad + '건 뺌' : '');
    const mw = document.getElementById('offImpMissWrap');
    mw.style.display = OFF.miss.length ? 'block' : 'none';
    if (OFF.miss.length) document.getElementById('offImpMiss').textContent = '이 학교 명단에 없는 학생 ' + OFF.miss.length + '명: ' +
      OFF.miss.slice(0, 12).map(function(s){ return s.grade + '-' + s.cls + ' ' + (s.number || '') + '번 ' + s.name; }).join(', ') + (OFF.miss.length > 12 ? ' 외' : '') + ' — 등록하면 이 학생들 기록도 함께 가져와요';
    document.getElementById('offImpGo').disabled = !OFF.plan.length;
    offMsg(OFF.plan.length ? '줄넘기 종류를 고르고 "가져오기"를 눌러 주세요.' : (OFF.miss.length ? '먼저 없는 학생을 등록해 주세요.' : '새로 가져올 기록이 없어요 (이미 다 들어와 있어요).'));
  }).catch(function(err){ offMsg('이 학교 자료를 읽지 못했어요: ' + (err.message || err), true); });
}
document.getElementById('offImpAddStu').addEventListener('click', function(){
  const rows = OFF.miss.map(function(s){ return { grade: s.grade, cls: s.cls, number: s.number, name: s.name, password: '' }; });
  if (!rows.length) return;
  if (!confirm(rows.length + '명을 이 학교 명단에 등록할까요? (비밀번호는 1234로 시작해요)')) return;
  offMsg('학생 등록 중…');

    .catch(function(err){ offMsg('학생을 등록하지 못했어요: ' + (err.message || err), true); });

document.getElementById('offImpGo').addEventListener('click', async function(){
  const type = document.getElementById('offImpType').value;
  if (!type) { offMsg('줄넘기 종류를 골라 주세요.', true); return; }
  const plan = OFF.plan.slice(); if (!plan.length) return;
  if (!confirm('기록 ' + plan.length + '건을 "' + type + '"(으)로 이 학교 시트에 넣을까요? 모두 승인된 기록으로 들어가요.')) return;
  const btn = this; btn.disabled = true;
  document.getElementById('offImpBarWrap').style.display = 'block';
  const wasOn = !!(APP.settings && APP.settings.approvalOn);
  let done = 0, fail = 0;
  try {
    if (wasOn) await offRpc('setAppSettings', [token, { approvalOn: false }]);   // 넣는 동안만 승인 절차 끔 → 바로 승인 기록
    let i = 0;
    const worker = async function(){
      while (i < plan.length) {
        const p = plan[i++];
        try { const r = await offRpc('addRecord', [p.sid, p.date, p.count, p.time, type]); if (r && r.ok === false) fail++; else { done++; OFF.have[p.sid + '|' + p.date + '|' + p.count] = true; } }
        catch (e) { fail++; }
        document.getElementById('offImpBar').style.width = Math.round((done + fail) / plan.length * 100) + '%';
        offMsg('넣는 중… ' + (done + fail) + ' / ' + plan.length + ' (창을 닫지 마세요)');
      }
    };
    await Promise.all([worker(), worker(), worker()]);
  } catch (err) { offMsg('가져오다 멈췄어요: ' + (err.message || err), true); }
  finally {
    if (wasOn) { try { await offRpc('setAppSettings', [token, { approvalOn: true }]); } catch (e) { alert('승인 절차를 다시 켜지 못했어요 — 설정 탭에서 "승인 절차 사용"을 다시 켜 주세요.'); } }
  }
  OFF.plan = OFF.plan.filter(function(p){ return !OFF.have[p.sid + '|' + p.date + '|' + p.count]; });
  offMsg('기록 ' + done + '건을 가져왔어요' + (fail ? ' · ' + fail + '건은 실패 — "가져오기"를 한 번 더 누르면 남은 것만 다시 넣어요' : '') + '.', !!fail);
  if (done) { try { NAT.syncAll(token, true).catch(function(){}); } catch (e) {} }   // 점퍼스에 참여 중이면 바로 보냄
  btn.disabled = !OFF.plan.length;
});

function viewStudentRecords(studentId) {
  google.script.run.withSuccessHandler(function(res){
    if (res.notFound) { alert('학생 정보를 찾을 수 없습니다.'); return; }

    renderSummary(res.records);

    panel.style.display = 'block';
    if (window.showAdminTab) window.showAdminTab('students');
    panel.scrollIntoView({ behavior: 'smooth' });
  }).getStudentRecordsForAdmin(token, studentId);

function renderSummary(records) {
  let approved = 0, pending = 0, rejected = 0;
  records.forEach(function(r){
    if (r.status === 'approved') approved += r.count;
    else if (r.status === 'pending') pending += r.count;
    else if (r.status === 'rejected') rejected += r.count;
  });
  let html =
    '<span class="badge badge-approved">승인 누적 ' + approved.toLocaleString() + '회</span> ' +
    '<span class="badge badge-pending">대기중 ' + pending.toLocaleString() + '회</span>';
  if (rejected > 0) html += ' <span class="badge badge-rejected">거절됨 ' + rejected.toLocaleString() + '회</span>';
  document.getElementById('recordsSummary').innerHTML = html;
}

function renderRecordsTable(records) {
  const tbody = document.querySelector('#recordsTable tbody');
  tbody.innerHTML = '';
  document.getElementById('recordsEmpty').style.display = (records.length === 0) ? 'block' : 'none';
  const statusOptions = ['pending', 'approved', 'rejected'];
  const statusLabel = { pending: '대기중', approved: '승인', rejected: '거절됨' };
  records.forEach(function(r){
    const tr = document.createElement('tr');
    tr.dataset.recordId = r.recordId;
    let selectHtml = '<select data-field="status">';
    statusOptions.forEach(function(s){
      selectHtml += '<option value="' + s + '"' + (s === r.status ? ' selected' : '') + '>' + statusLabel[s] + '</option>';
    });
    selectHtml += '</select>';
    // 종류 선택: 설정된 종류 + (이 기록의 종류가 목록에 없으면 그것도 포함)
    const typeOptions = jumpTypes.slice();
    if (r.type && typeOptions.indexOf(r.type) === -1) typeOptions.push(r.type);
    let typeHtml = '<select data-field="type">';
    typeOptions.forEach(function(t){
      typeHtml += '<option value="' + t + '"' + (t === r.type ? ' selected' : '') + '>' + t + '</option>';
    });
    typeHtml += '</select>';
    tr.innerHTML =
      '<td class="mono">' + r.date + (r.time ? ' <span class="hint">' + r.time + '</span>' : '') + '</td>' +
      '<td>' + typeHtml + (r.source === 'camera' ? ' <span title="카메라 판정기로 기록">📷</span>' : '') + '</td>' +
      '<td><input type="number" min="0" value="' + r.count + '" data-field="count"></td>' +
      '<td>' + selectHtml + '</td>' +
      '<td><button data-action="saveRecord">저장</button> <button data-action="delRecord">삭제</button></td>';
    tbody.appendChild(tr);
  });
}

(function(){
  const btn = document.getElementById('installBtn'), msg = document.getElementById('installMsg'), help = document.getElementById('installHelp');
  const ua = navigator.userAgent || '';
  const ios = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  function ui(state){
    if (!document.body.contains(btn)) return;   // 다른 화면으로 옮겨 간 뒤
    if (state === 'installed' || standalone) {
      btn.style.display = 'none'; help.textContent = '';
      msg.textContent = state === 'installed' ? '앱 아이콘을 만들었어요! 바탕화면이나 시작 메뉴에서 "점퍼스"를 찾아 보세요.' : '지금 앱으로 열려 있어요. (아이콘이 이미 있어요)';
      return;
    }
    btn.style.display = '';
    if (window._jrInstall) { btn.disabled = false; help.textContent = ''; msg.textContent = ''; return; }
    btn.disabled = true;
    help.innerHTML = ios ? '아이폰·아이패드: 사파리 아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르세요.'
      : '버튼이 눌리지 않으면: 크롬·엣지 주소창 오른쪽의 <b>설치 아이콘(⊕ 또는 모니터 모양)</b>을 누르거나, 메뉴(⋮) → <b>앱</b>(또는 저장 및 공유) → <b>이 사이트를 앱으로 설치 / 바로가기 만들기</b>를 고르세요. 이미 설치했다면 바탕화면·시작 메뉴에 아이콘이 있어요.';
  }
  window._jrInstallUI = ui;
  btn.addEventListener('click', function(){
    const ev = window._jrInstall; if (!ev) return;
    ev.prompt();
    (ev.userChoice || Promise.resolve({})).then(function(r){
      window._jrInstall = null;
      if (r && r.outcome === 'accepted') ui('installed'); else { msg.textContent = '취소했어요. 필요할 때 다시 눌러 주세요.'; ui(); }
    });
  });
  ui();
})();

/* ---- 승인 절차 on/off ---- */
function renderApprovalUI(){
  const on = !!APP.settings.approvalOn;
  document.getElementById('approvalOn').checked = on;
  document.getElementById('goApprovalLink').style.display = on ? '' : 'none';
  document.getElementById('navApprovalLink').style.display = on ? '' : 'none';
}
renderApprovalUI();
document.getElementById('saveApprovalBtn').addEventListener('click', function(){
  const msg = document.getElementById('approvalMsg');
  const want = document.getElementById('approvalOn').checked;
  // 전국 현황판에 참여 중이면 승인 절차를 끌 때 참여도 함께 끈다
  const leaveNat = !want && NAT.active();
  if (leaveNat && !confirm('승인 절차를 끄면 전국 현황판 참여도 꺼지고, 현황판에 올라간 우리 학교 기록이 지워집니다. 끌까요?')) {
    document.getElementById('approvalOn').checked = true; msg.textContent = ''; return;
  }
  msg.textContent = '저장 중...';
  google.script.run.withSuccessHandler(function(res){
    APP.settings = Object.assign(APP.settings, res.settings || {}); renderApprovalUI();
    msg.textContent = APP.settings.approvalOn ? '저장했어요. 이제 학생 기록은 승인 후 반영됩니다.' : '저장했어요. 학생 기록이 바로 반영됩니다.';
    if (leaveNat) {
      const key = NAT.cfg.key;
      rpc('setExtraSettings', [token, { nat: Object.assign({}, NAT.cfg, { on: false }) }]).then(function(r){
        NAT.cfg = (r && r.settings && r.settings.nat) || Object.assign({}, NAT.cfg, { on: false });
        if (NAT.refreshUI) NAT.refreshUI();
        return NAT.post('leave', { key: key });
      }).then(function(){ msg.textContent += ' 전국 현황판 참여도 껐고, 현황판의 우리 학교 기록을 지웠어요.'; })
        .catch(function(err){ msg.textContent += ' (전국 현황판 참여를 끄지 못했어요: ' + (err.message || err) + ')'; });
    }
  }).withFailureHandler(function(err){ msg.textContent = '오류: ' + String(err); })
  .setAppSettings(token, { approvalOn: want });
});

/* ---- 전국 현황판 참여 (2.1) ---- */
(function(){
  const $ = function(id){ return document.getElementById(id); };
  const msg = $('natMsg');
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fill(){
    const c = NAT.cfg || {};
    const ct = NAT.contact();
    $('natOn').checked = !!c.on; $('natShowName').checked = !!c.showName; $('natName').value = c.name || '';
    $('natTeacher').value = ct.teacher || ''; $('natContact').value = ct.contact || '';
    $('natRegWarn').style.display = (NAT.active() && !ct.teacher) ? '' : 'none';
    $('natApprovalWarn').style.display = (NAT.active() && !NAT.approvalOk()) ? '' : 'none';
    $('natMovedWarn').style.display = NAT.moved() ? '' : 'none';
    $('natSyncBtn').style.display = NAT.active() ? '' : 'none';
    const noCol = !NAT.collector;
    $('natNoCollector').style.display = noCol ? '' : 'none';
    ['natOn', 'natShowName', 'natName', 'natTeacher', 'natContact', 'saveNatBtn'].forEach(function(id){ $(id).disabled = noCol; });
    const setLinks = function(pid){ $('natBoardLink').href = NAT.pageUrl('board.html', pid); $('natHallLink').href = NAT.pageUrl('hall.html', pid); };
    setLinks(''); if (c.on) NAT.myPid().then(setLinks);
  }
  function preview(days){
    const month = (function(){ const x = new Date(); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'); })();
    const st = {};
    let total = 0, cam = 0;
    (days || []).filter(function(d){ return d.date.slice(0, 7) === month; }).forEach(function(d){
      d.students.forEach(function(s){ const x = st[s[0]] = st[s[0]] || { n: s[1], g: s[2], c: 0 }; x.c += s[3]; total += s[3]; cam += s[4]; });
    });
    const list = Object.keys(st).map(function(k){ return st[k]; }).sort(function(a, b){ return b.c - a.c; });
    $('natPreviewCard').style.display = '';
    $('natPreview').innerHTML = '<div class="nat-kpis"><div>학교 이름<b>' + esc(NAT.cfg.showName ? NAT.cfg.name : '익명 학교') + '</b></div><div>이번 달 합계<b class="mono">' + total.toLocaleString() + '</b></div><div>참여 학생<b class="mono">' + list.length + '명</b></div><div>📷 카메라 인증<b class="mono">' + cam.toLocaleString() + '</b></div></div>' +
      (list.length ? '<table><thead><tr><th>순위</th><th>이름</th><th>학년</th><th>횟수</th></tr></thead><tbody>' + list.slice(0, 5).map(function(s, i){ return '<tr><td>' + (i + 1) + '</td><td>' + esc(s.n) + '</td><td>' + esc(s.g) + '</td><td class="mono">' + s.c.toLocaleString() + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="hint">이번 달 기록이 아직 없어요.</p>');
  }
  function sync(force){
    if (!NAT.active()) return Promise.resolve(null);
    if (force) msg.textContent = '현황판에 보내는 중...';
    return NAT.syncAll(token, force).then(function(r){
      if (r) { preview(r.days); if (force) msg.textContent = '보냈어요. (' + r.days.length + '일치) 현황판에는 몇 분 안에 반영됩니다.'; }
      return r;
    }).catch(function(err){ msg.textContent = '현황판에 보내지 못했어요: ' + (err.message || err); });
  }
  $('natSyncBtn').addEventListener('click', function(){ sync(true); });
  // 복사한 시트 / 새 배포: 새 참여 번호(이전 번호의 자료는 다른 반 것일 수 있어 지우지 않음) 또는 그대로
  function rekey(newKey){
    const next = Object.assign({}, NAT.cfg, { shell: NAT.deployId() });
    if (newKey) next.key = NAT.newKey();
    msg.textContent = '저장 중...';
    rpc('setExtraSettings', [token, { nat: next }]).then(function(r){
      if (!r || !r.ok) throw new Error((r && r.message) || '저장 실패');
      NAT.cfg = (r.settings && r.settings.nat) || next; fill();
      msg.textContent = newKey ? '새 참여 번호를 만들었어요. 현황판에 우리 반이 새로 올라가요.' : '그대로 쓸게요.';
      return sync(true);
    }).catch(function(err){ msg.textContent = '저장하지 못했어요: ' + (err.message || err); });
  }
  $('natNewKeyBtn').addEventListener('click', function(){
    if (!confirm('새 참여 번호를 만들까요? 이 시트는 현황판에 새 학교(반)로 올라가요. 원래 시트의 기록은 그대로 둡니다.')) return;
    rekey(true);
  });
  $('natKeepKeyBtn').addEventListener('click', function(){
    if (!confirm('같은 시트를 새로 배포해서 주소만 바뀐 게 맞나요? (다른 반 시트를 복사했다면 "새 참여 번호로 바꾸기"를 눌러야 해요)')) return;
    rekey(false);
  });
  $('saveNatBtn').addEventListener('click', function(){
    const on = $('natOn').checked, showName = $('natShowName').checked, name = $('natName').value.trim();
    const teacher = $('natTeacher').value.trim(), contact = $('natContact').value.trim();
    if (on && !name) { msg.textContent = '학교 이름을 넣어 주세요. (현황판에 이름을 숨기려면 "학교 이름 공개"를 끄면 돼요)'; $('natName').focus(); return; }
    if (on && !teacher) { msg.textContent = '담당 교사 이름을 넣어 주세요.'; $('natTeacher').focus(); return; }
    if (teacher) NAT.contact({ teacher: teacher, contact: contact });
    const needApproval = on && !NAT.approvalOk();
    const wasOn = NAT.active();
    if (wasOn && !on && !confirm('참여를 끄면 현황판에 올라간 우리 학교 기록이 지워집니다. 끌까요?')) return;
    if (NAT.moved()) { msg.textContent = '먼저 위의 "새 참여 번호로 바꾸기" 또는 "그대로 쓰기"를 골라 주세요.'; return; }
    const next = { on: on, key: NAT.cfg.key || NAT.newKey(), name: name, showName: showName, shell: NAT.deployId() };
    msg.textContent = '저장 중...';
    google.script.run.withSuccessHandler(function(res){
      if (!res || !res.ok) { msg.textContent = (res && res.message) || '저장하지 못했어요.'; return; }
      NAT.cfg = (res.settings && res.settings.nat) || next;
      fill();
      if (on) {
        msg.textContent = '저장했어요. 현황판에 보내는 중...';
        const send = function(){ return sync(true).then(function(){ if (needApproval) msg.textContent = '승인 절차를 함께 켰어요. ' + msg.textContent; }); };
        if (needApproval) rpc('setAppSettings', [token, { approvalOn: true }]).then(function(r){
          APP.settings = Object.assign(APP.settings, (r && r.settings) || { approvalOn: true }); renderApprovalUI(); fill(); return send();
        }).catch(function(err){ msg.textContent = '승인 절차를 켜지 못해 현황판에 보내지 않았어요: ' + (err.message || err); });
        else send();
      }
      else if (wasOn) {
        $('natPreviewCard').style.display = 'none';
        NAT.post('leave', { key: next.key }).then(function(){ msg.textContent = '참여를 껐어요. 현황판에서 우리 학교 기록을 지웠습니다.'; })
          .catch(function(err){ msg.textContent = '참여는 껐지만 현황판 기록을 지우지 못했어요: ' + (err.message || err); });
      } else msg.textContent = '저장했어요.';
    }).withFailureHandler(function(err){ msg.textContent = '오류: ' + String(err); })
    .setExtraSettings(token, { nat: next });
  });
  NAT.refreshUI = fill;
  NAT.load().then(function(){
    // 2.2.2 전에 참여한 학교: 지금 주소를 기록해 둠 (이후 복사본을 알아챌 수 있게)
    if (NAT.cfg && NAT.cfg.on && NAT.cfg.key && !NAT.cfg.shell) rpc('setExtraSettings', [token, { nat: Object.assign({}, NAT.cfg, { shell: NAT.deployId() }) }]).then(function(r){ if (r && r.ok && r.settings) NAT.cfg = r.settings.nat || NAT.cfg; }).catch(function(){});
    fill(); return sync(false);
  });
})();

/* ---- 급수 인증 ---- */
(function(){
  const $ = function(id){ return document.getElementById(id); };
  const esc = function(v){ return String(v == null ? '' : v).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  const today = function(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  let students = [], orig = {};
  $('lvDate').value = today();
  function classes(){ const m = {}; students.forEach(function(s){ m[s.grade + '|' + s.cls] = 1; }); return Object.keys(m).sort(function(a, b){ return a.localeCompare(b, 'ko', { numeric: true }); }); }
  function inClass(){ const k = $('lvClass').value; return students.filter(function(s){ return (s.grade + '|' + s.cls) === k; }); }
  function fillLevels(pick){
    $('lvLevel').innerHTML = LEVELS.table.map(function(l, i){ return '<option value="' + i + '">' + esc(LEVELS.label(i)) + '</option>'; }).join('');
    if (pick != null) $('lvLevel').value = String(pick);
  }
  function commonNext(){
    const c = {}; let best = 0, bn = -1;
    inClass().forEach(function(s){ const n = LEVELS.of(s.id).next; c[n] = (c[n] || 0) + 1; if (c[n] > bn) { bn = c[n]; best = n; } });
    return best;
  }
  function grid(){
    const lv = Number($('lvLevel').value) || 0, L = LEVELS.table[lv];
    const list = inClass();
    orig = {};
    if (!L || !list.length) { $('lvGrid').innerHTML = '<p class="hint">학생이 없어요.</p>'; return; }
    let h = '<table><thead><tr><th>번호</th><th>이름</th><th>지금 급수</th>' + L.items.map(function(it, j){ return '<th class="it">' + esc(it[0]) + '<b>' + esc(LEVELS.goal(it[1])) + '</b><input type="checkbox" class="lvAll" data-j="' + j + '" title="모두 체크"></th>'; }).join('') + '</tr></thead><tbody>';
    list.forEach(function(s){
      const me = LEVELS.of(s.id);
      // 바로 앞 급수를 아직 못 땄으면 이 급수는 잠금 (이미 체크된 칸은 고칠 수 있게 해제만 가능)
      const locked = me.level < lv - 1;
      const why = locked ? LEVELS.label(me.level + 1) + '를 먼저 따야 해요' : '';
      h += '<tr' + (locked ? ' class="lv-locked"' : '') + '><td>' + esc(s.number) + '</td><td>' + esc(s.name) + '</td><td>' + LEVELS.chip(me.level, true) + '</td>' + L.items.map(function(it, j){
        const d = me.passed[lv + '|' + j]; const on = d !== undefined; orig[s.id + '|' + j] = on;
        return '<td class="ck' + (on ? ' done' : '') + '" title="' + esc(on ? d + ' 통과' + (locked ? ' · ' + why : '') : why) + '"><input type="checkbox" class="lvCk" data-id="' + esc(s.id) + '" data-j="' + j + '"' + (on ? ' checked' : '') + (locked ? ' data-locked="1"' + (on ? '' : ' disabled') : '') + '></td>';
      }).join('') + '</tr>';
    });
    const nLocked = list.filter(function(s){ return LEVELS.of(s.id).level < lv - 1; }).length;
    $('lvGrid').innerHTML = h + '</tbody></table>' + (nLocked ? '<p class="hint" style="margin:6px 0 0;">회색 줄은 ' + esc(lv > 0 ? LEVELS.label(lv - 1) : '') + '를 아직 못 딴 학생이라 체크할 수 없어요. (' + nLocked + '명)</p>' : '');
    Array.prototype.forEach.call(document.querySelectorAll('.lvAll'), function(a){
      a.addEventListener('change', function(){ const j = this.dataset.j, on = this.checked; Array.prototype.forEach.call(document.querySelectorAll('.lvCk[data-j="' + j + '"]'), function(c){ if (c.disabled || (on && c.dataset.locked)) return; c.checked = on; }); });
    });
  }
  function render(keepLevel){
    const cs = classes(), cur = $('lvClass').value;
    $('lvClass').innerHTML = cs.map(function(k){ const p = k.split('|'); return '<option value="' + esc(k) + '">' + esc(p[0]) + '학년 ' + esc(p[1]) + '반</option>'; }).join('');
    if (cur && cs.indexOf(cur) >= 0) $('lvClass').value = cur;
    fillLevels(keepLevel != null ? keepLevel : commonNext());
    grid();
    $('lvTableText').value = LEVELS.toText();
  }
  $('lvClass').addEventListener('change', function(){ fillLevels(commonNext()); grid(); });
  $('lvLevel').addEventListener('change', grid);
  $('lvGrid').addEventListener('change', function(e){
    const c = e.target;
    if (c.classList && c.classList.contains('lvCk') && c.dataset.locked && c.checked) { c.checked = false; c.disabled = true; }   // 잠긴 칸은 해제만
  });
  $('lvSave').addEventListener('click', function(){
    const lv = Number($('lvLevel').value) || 0, date = $('lvDate').value || today(), changes = [];
    const before = {}; inClass().forEach(function(s){ before[s.id] = LEVELS.of(s.id).level; });
    Array.prototype.forEach.call(document.querySelectorAll('.lvCk'), function(c){
      const k = c.dataset.id + '|' + c.dataset.j;
      if (!!orig[k] !== c.checked) changes.push({ id: c.dataset.id, level: lv, item: Number(c.dataset.j), pass: c.checked, date: date });
    });
    if (!changes.length) { $('lvMsg').textContent = '바뀐 것이 없어요.'; return; }
    $('lvMsg').textContent = '저장 중...';
    rpc('saveLevelPasses', [token, changes]).then(function(passes){
      LEVELS.passes = passes || {};
      const up = inClass().filter(function(s){ return LEVELS.of(s.id).level > before[s.id]; });
      $('lvMsg').textContent = '저장했어요. (' + changes.length + '칸)' + (up.length ? ' 급수가 오른 학생: ' + up.map(function(s){ return s.name + '(' + LEVELS.label(LEVELS.of(s.id).level) + ')'; }).join(', ') : '');
      grid();
    }).catch(function(err){ $('lvMsg').textContent = '저장하지 못했어요: ' + (err.message || err); });
  });
  $('lvTableSave').addEventListener('click', function(){
    const t = LEVELS.fromText($('lvTableText').value);
    if (!t.length) { $('lvTableMsg').textContent = '급수표를 읽지 못했어요. 형식을 확인해 주세요.'; return; }
    rpc('setExtraSettings', [token, { levels: t }]).then(function(r){
      if (!r || !r.ok) throw new Error((r && r.message) || '저장 실패');
      LEVELS.table = t; LEVELS.custom = true; $('lvTableMsg').textContent = '급수표를 저장했어요. (' + t.length + '개 급수)'; render(Number($('lvLevel').value) || 0);
    }).catch(function(err){ $('lvTableMsg').textContent = '저장하지 못했어요: ' + (err.message || err); });
  });
  $('lvTableReset').addEventListener('click', function(){
    if (!confirm('협회 기준표로 되돌릴까요? (체크해 둔 통과 기록은 그대로 남아요)')) return;
    rpc('setExtraSettings', [token, { levels: null }]).then(function(){
      LEVELS.table = LEVELS.DEFAULT; LEVELS.custom = false; $('lvTableMsg').textContent = '협회 기준표로 되돌렸어요.'; render(0);
    }).catch(function(err){ $('lvTableMsg').textContent = '오류: ' + (err.message || err); });
  });
  $('lvMain').addEventListener('change', function(){
    const on = this.checked;
    $('lvMsg').textContent = '저장 중...';
    rpc('setExtraSettings', [token, { levelsMain: on ? null : false }]).then(function(r){
      if (!r || !r.ok) throw new Error((r && r.message) || '저장 실패');
      LEVELS.extra = r.settings || LEVELS.extra;
      $('lvMsg').textContent = on ? '메인 화면에 우리 반 급수를 보여요.' : '메인 화면에서 우리 반 급수를 숨겼어요.';
    }).catch(function(err){ $('lvMain').checked = !on; $('lvMsg').textContent = '저장하지 못했어요: ' + (err.message || err); });
  });
  const ok = LEVELS.supported();
  $('lvNoShell').style.display = ok ? 'none' : '';
  $('lvMain').disabled = !ok;
  ['lvSave', 'lvTableSave', 'lvTableReset'].forEach(function(id){ $(id).disabled = !ok; });
  Promise.all([rpc('getAllStudentsPublic'), LEVELS.load()]).then(function(r){ students = r[0] || []; LEVELS.students = students; $('lvMain').checked = LEVELS.extra.levelsMain !== false; render(); });
})();

/* ---- 인증서 · 상장 ---- */
(function(){
  const $ = function(id){ return document.getElementById(id); };
  const esc = function(v){ return String(v == null ? '' : v).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  const d0 = new Date();
  $('certDate').value = d0.getFullYear() + '-' + String(d0.getMonth() + 1).padStart(2, '0') + '-' + String(d0.getDate()).padStart(2, '0');
  const dateKo = function(d){ const p = String(d || '').split('-'); return p.length === 3 ? Number(p[0]) + '년 ' + Number(p[1]) + '월 ' + Number(p[2]) + '일' : ''; };
  const mLabel = function(m){ return Number(m.slice(0, 4)) + '년 ' + Number(m.slice(5, 7)) + '월'; };
  let students = [], hall = null;
  // 직함: 담임 / 체육 교사 / 직접 입력 (이 기기에 기억)
  function role(){ return $('certRole').value === '__custom' ? $('certRoleCustom').value.trim() : $('certRole').value; }
  function showRole(){ $('certRoleCustomRow').style.display = $('certRole').value === '__custom' ? '' : 'none'; }
  try { const r = JSON.parse(localStorage.getItem('jr_cert_role') || 'null'); if (r) { $('certRole').value = r.sel || '담임'; $('certRoleCustom').value = r.custom || ''; } } catch (e) {}
  showRole();
  function saveRole(){ try { localStorage.setItem('jr_cert_role', JSON.stringify({ sel: $('certRole').value, custom: $('certRoleCustom').value })); } catch (e) {} }
  $('certRole').addEventListener('change', function(){ showRole(); saveRole(); if ($('certRole').value === '__custom') $('certRoleCustom').focus(); if (document.querySelector('#certPreview .cert')) make(); });
  $('certRoleCustom').addEventListener('input', saveRole);
  // 테두리: 금색 줄(기본) / 금박 무늬 / 은박 무늬 / 없음(테두리가 인쇄된 금박 상장 용지용) (이 기기에 기억) — 금박·은박은 인쇄 창의 '배경 그래픽'이 켜져 있어야 모서리 장식까지 나와요
  try { $('certFrame').value = localStorage.getItem('jr_cert_frame') || ''; $('certPaper').value = localStorage.getItem('jr_cert_paper') || 'land'; } catch (e) {}
  // 용지 방향: A4 가로(기본) / A4 세로 (상장 용지가 세로일 때) — 인쇄할 때 쪽 크기도 같이 바꿈
  $('certPaper').addEventListener('change', function(){ try { localStorage.setItem('jr_cert_paper', this.value); } catch (e) {}
    Array.prototype.forEach.call(document.querySelectorAll('#certPreview .cert'), function(c){ c.classList.toggle('port', $('certPaper').value === 'port'); }); });
  $('certFrame').addEventListener('change', function(){ try { localStorage.setItem('jr_cert_frame', this.value); } catch (e) {}
    Array.prototype.forEach.call(document.querySelectorAll('#certPreview .cert'), function(c){ c.classList.remove('fr-gold', 'fr-silver', 'fr-none'); if ($('certFrame').value) c.classList.add('fr-' + $('certFrame').value); }); });
  $('certRoleCustom').addEventListener('change', function(){ if (document.querySelector('#certPreview .cert')) make(); });
  NAT.load().then(function(){
    const c = NAT.cfg || {}, ct = NAT.contact();
    if (!$('certSchool').value) $('certSchool').value = c.name || '';
    if (!$('certTeacher').value) $('certTeacher').value = ct.teacher || '';
  });
  function page(o){
    return '<div class="cert ' + o.cls + ($('certFrame').value ? ' fr-' + $('certFrame').value : '') + ($('certPaper').value === 'port' ? ' port' : '') + '"><div class="cert-in">' +
      (o.cls === 'cert-award' && o.je ? '<div class="cert-je">' + jeLogo(40, false, 'height:6cqw;width:9cqw') + '<span>Jump Earth · 점퍼스</span></div>' : '') +
      '<div class="cert-title">' + o.title + '</div>' +
      (o.badge || '') +
      '<div class="cert-who">' + o.who + '</div>' +
      '<div class="cert-body">' + o.body + '</div>' +
      '<div class="cert-date">' + esc(dateKo($('certDate').value)) + '</div>' +
      '<div class="cert-from">' + esc($('certSchool').value || '') + (($('certTeacher').value || '') ? '<span class="cert-gap"></span>' + (role() ? esc(role()) + ' ' : '') + esc($('certTeacher').value) : '') + '</div>' +
      '</div></div>';
  }
  function classOpts(){
    const m = {}; students.forEach(function(s){ m[s.grade + '|' + s.cls] = 1; });
    $('certClass').innerHTML = '<option value="">전체</option>' + Object.keys(m).sort(function(a, b){ return a.localeCompare(b, 'ko', { numeric: true }); }).map(function(k){ const p = k.split('|'); return '<option value="' + esc(k) + '">' + esc(p[0]) + '학년 ' + esc(p[1]) + '반</option>'; }).join('');
  }
  function levelCerts(){
    if (!LEVELS.supported()) return { html: '', msg: '급수 인증서는 학교 껍데기 3판이 필요해요.' };
    const k = $('certClass').value;
    const list = students.filter(function(s){ return !k || (s.grade + '|' + s.cls) === k; });
    const pages = [];
    list.forEach(function(s){
      const me = LEVELS.of(s.id);
      if (me.level < 0) return;
      const L = LEVELS.table[me.level];
      pages.push(page({ cls: 'cert-level', title: '줄넘기 급수 인증서',
        badge: '<div class="cert-badge">' + LEVELS.chip(me.level) + '</div>',
        who: esc(s.grade) + '학년 ' + esc(s.cls) + '반 <b>' + esc(s.name) + '</b>',
        body: '위 학생은 줄넘기 <b>' + esc(LEVELS.label(me.level)) + '</b> 급수의 모든 과제<br><span class="cert-items">' + L.items.map(function(it){ return esc(it[0]) + ' ' + esc(LEVELS.goal(it[1])); }).join(' · ') + '</span><br>를 걸리지 않고 성공하였기에 이 인증서를 드립니다.' + (me.dates[me.level] ? '<br><span class="cert-small">인증일 ' + esc(dateKo(me.dates[me.level])) + '</span>' : '') }));
    });
    return { html: pages.join(''), msg: pages.length ? pages.length + '장 (급수를 딴 학생만)' : '이 반에는 아직 급수를 딴 학생이 없어요.' };
  }
  function natCerts(){
    if (!NAT.collector || !NAT.cfg.key) return Promise.resolve({ html: '', msg: '전국 현황판에 참여한 학교만 쓸 수 있어요.' });
    const month = $('certMonth').value;
    return Promise.all([NAT.publicId(NAT.cfg.key), fetch(NAT.collector + '?api=hall' + (month ? '&month=' + month : ''), { cache: 'no-store' }).then(function(r){ return r.json(); })]).then(function(r){
      const pid = r[0], j = r[1];
      if (!j.ok) throw new Error(j.error || '기록실을 불러오지 못했어요');
      const res = j.result, m = res.month || (res.months || []).filter(function(x){ return x.month === month; })[0] || (res.months || [])[0];
      if (res.list) $('certMonth').innerHTML = res.list.map(function(x){ return '<option value="' + x + '">' + mLabel(x) + '</option>'; }).join('');
      if (!m) return { html: '', msg: '아직 기록실에 오른 달이 없어요.' };
      $('certMonth').value = m.month;
      // 학생 키 → 실명 (우리 학교 학생만, 학교 안에서 계산)
      return Promise.all(students.map(function(s){ return NAT.sha('jr-student|' + NAT.cfg.key + '|' + String(s.id).trim()).then(function(h){ return [h.slice(0, 10), s]; }); })).then(function(pairs){
        const byKey = {}; pairs.forEach(function(p){ byKey[p[0]] = p[1]; });
        // 전국 1위가 있으면 지난 달들(명예의 전당 최근 12개월)에서 1위 횟수를 세어 월계관 별 수로 씀
        const firsts = function(mm){ const o = {}; ['total', 'avg', 'rate'].forEach(function(k){ ((mm.schools || {})[k] || []).forEach(function(x){ if (x.rank === 1 && x.pid === pid) o['s|' + k] = 1; }); });
          (mm.students || []).forEach(function(x){ if (x.rank === 1 && x.k && byKey[x.k]) o['k|' + x.k] = 1; }); return o; };
        const now = firsts(m), past = (res.list || []).filter(function(x){ return x < m.month; });
        const counting = !Object.keys(now).length || !past.length ? Promise.resolve([]) : Promise.all(past.map(function(mo){
          return fetch(NAT.collector + '?api=hall&month=' + mo, { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){ return j.ok && j.result.month ? firsts(j.result.month) : {}; }).catch(function(){ return {}; });
        }));
        return counting.then(function(list){
        const wins = {}; Object.keys(now).forEach(function(key){ wins[key] = 1 + list.filter(function(o){ return o[key]; }).length; });
        const crown = function(key, rankHtml){ const n = wins[key]; return n ? '<div class="cert-laurel">' + laurelSvg({ dark: true, wins: n, size: 120, style: 'width:10cqw;height:10cqw' }) + '</div>' + rankHtml.replace('위</div>', '위' + (n > 1 ? ' · ' + n + '번째' : '') + '</div>') : rankHtml; };
        const nameOf = function(x){ const s = x.k && byKey[x.k]; return s ? esc(s.grade) + '학년 ' + esc(s.cls) + '반 <b>' + esc(s.name) + '</b>' : '<b>' + esc(x.n) + '</b>' + (x.g ? ' (' + esc(x.g) + '학년)' : ''); };
        const pages = [], ml = mLabel(m.month), school = $('certSchool').value || '우리 학교';
        const kinds = { total: ['학교 합계', function(s){ return Number(s.total).toLocaleString() + '회'; }], avg: ['1인당 평균', function(s){ return Number(s.avg).toLocaleString() + '회'; }], rate: ['참여율', function(s){ return s.rate + '%'; }] };
        Object.keys(kinds).forEach(function(k){
          (m.schools[k] || []).filter(function(s){ return s.pid === pid; }).forEach(function(s){
            pages.push(page({ cls: 'cert-award', title: '상　　장', je: true, badge: crown(s.rank === 1 ? 's|' + k : '', '<div class="cert-rank">전국 ' + s.rank + '위</div>'), who: '<b>' + esc(school) + '</b>',
              body: ml + ' 전국 줄넘기 현황판 <b>Jump Earth(점퍼스)</b>에서<br><b>' + kinds[k][0] + ' 전국 ' + s.rank + '위</b>(' + kinds[k][1](s) + ')를 차지하여 이 상장을 드립니다.' }));
          });
        });
        (m.students || []).filter(function(x){ return (x.pid && x.pid === pid) || (x.k && byKey[x.k]); }).forEach(function(x){
          pages.push(page({ cls: 'cert-award', title: '상　　장', je: true, badge: crown(x.rank === 1 ? 'k|' + x.k : '', '<div class="cert-rank">전국 ' + x.rank + '위</div>'), who: nameOf(x),
            body: ml + ' 전국 줄넘기 현황판 <b>Jump Earth(점퍼스)</b>에서<br><b>학생 순위 전국 ' + x.rank + '위</b>(' + Number(x.c).toLocaleString() + '회)에 올라 꾸준히 노력한 모범이 되었기에<br>이 상장을 드립니다.' }));
        });
        const ins = (m.inSchool || []).filter(function(s){ return s.pid === pid; })[0];
        if (ins) {
          let r = 0;
          ins.top.forEach(function(x, i){
            r = (i > 0 && ins.top[i - 1].c === x.c) ? r : i + 1;
            pages.push(page({ cls: 'cert-award', title: '상　　장', badge: '<div class="cert-rank">우리 학교 ' + r + '위</div>', who: nameOf(x),
              body: ml + ' 줄넘기 기록에서 <b>' + esc(school) + ' ' + r + '위</b>(' + Number(x.c).toLocaleString() + '회)를 차지하여<br>이 상장을 드립니다.' }));
          });
        }
        return { html: pages.join(''), msg: pages.length ? ml + ' · ' + pages.length + '장' : ml + ' 기록실에 우리 학교가 없어요.' };
        });
      });
    });
  }
  function make(){
    const kind = $('certKind').value;
    if (!$('certSchool').value) $('certSchool').value = (NAT.cfg && NAT.cfg.name) || '';
    if (!$('certTeacher').value) $('certTeacher').value = NAT.contact().teacher || '';
    $('certMsg').textContent = '만드는 중...';
    const p = kind === 'level' ? LEVELS.load().then(levelCerts) : natCerts();
    return p.then(function(r){ $('certPreview').innerHTML = r.html; $('certMsg').textContent = r.msg; return r; })
      .catch(function(err){ $('certPreview').innerHTML = ''; $('certMsg').textContent = '만들지 못했어요: ' + (err.message || err); });
  }
  $('certKind').addEventListener('change', function(){
    const nat = this.value === 'nat';
    $('certClassRow').style.display = nat ? 'none' : ''; $('certMonthRow').style.display = nat ? '' : 'none';
    $('certPreview').innerHTML = ''; $('certMsg').textContent = '';
  });
  $('certMonth').addEventListener('change', make);
  $('certMake').addEventListener('click', make);
  $('certPrint').addEventListener('click', function(){
    (document.querySelector('#certPreview .cert') ? Promise.resolve() : make()).then(function(){
      if (!document.querySelector('#certPreview .cert')) return;
      const port = $('certPaper').value === 'port';
      let pg = document.getElementById('certPageSize'); if (!pg) { pg = document.createElement('style'); pg.id = 'certPageSize'; document.head.appendChild(pg); }
      pg.textContent = '@page { size: A4 ' + (port ? 'portrait' : 'landscape') + '; margin: 0; }';
      document.body.classList.toggle('cert-port', port);
      document.body.classList.add('printing-cert'); window.print();
      setTimeout(function(){ document.body.classList.remove('printing-cert'); }, 500);
    });
  });
  rpc('getAllStudentsPublic').then(function(list){ students = list || []; classOpts(); });
})();

/* ---- 우리 반 줄넘기 여행 ---- */
(function(){
  const $ = function(id){ return document.getElementById(id); };
  let total = 0, ex = {};
  function cur(){ return { on: $('jrOn').checked, start: $('jrStart').value, base: JOURNEY.cfg(ex).base }; }
  $('jrStart').innerHTML = JOURNEY.options('대전');
  $('jrStart').addEventListener('change', preview);
  function preview(){ $('jrPreview').innerHTML = JOURNEY.html(total, { journey: cur() }); }
  function save(j, msg){
    $('jrMsg').textContent = '저장 중...';
    return rpc('setExtraSettings', [token, { journey: j }]).then(function(r){
      if (!r || !r.ok) throw new Error((r && r.message) || '저장 실패');
      ex = r.settings || ex; LEVELS._ready = null; preview(); $('jrMsg').textContent = msg;
    }).catch(function(err){ $('jrMsg').textContent = '저장하지 못했어요: ' + (err.message || err); });
  }
  $('jrSave').addEventListener('click', function(){ save(cur(), '저장했어요.' + ($('jrOn').checked ? ' 메인 화면에 보여요.' : '')); });
  $('jrRestart').addEventListener('click', function(){
    if (!confirm('지금까지 뛴 기록은 그대로 두고, 여행만 출발점에서 다시 시작할까요?')) return;
    const j = cur(); j.base = total; save(j, '지금부터 새로 출발해요!');
  });
  Promise.all([rpc('getExtraSettings'), rpc('getStudentsSummary')]).then(function(r){
    ex = r[0] || {};
    const sum = r[1] && r[1].list;
    total = (Array.isArray(sum) ? sum : []).reduce(function(a, s){ return a + (Number(s.total) || 0); }, 0);
    const c = JOURNEY.cfg(ex); $('jrOn').checked = !!(ex.journey && ex.journey.on); $('jrStart').value = c.start;
    preview();
  });
})();

/* ---- 업데이트 내역 ---- */
(function(){
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function entry(e, open){
    const items = (e.changes || []).map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('');
    const head = '<b>v' + esc(e.version) + '</b>' + (e.date ? ' <span class="hint">' + esc(e.date) + '</span>' : '') + (e.title ? ' · ' + esc(e.title) : '');
    return open
      ? '<div class="cl-latest"><div class="cl-tag">최신</div><div class="cl-head">' + head + '</div><ul>' + items + '</ul></div>'
      : '<details class="cl-item"><summary>' + head + '</summary><ul>' + items + '</ul></details>';
  }
  document.getElementById('versionInfo').innerHTML = '지금 쓰는 판: <b>v' + APP.version + '</b>' + (APP.channel === 'beta' ? ' (베타)' : '') + ' · 학교 껍데기 판: <b>' + APP.shell.shell + '</b> · 학교 시트: ' + esc(APP.shell.title || '') + (/견본/.test(APP.shell.title || '') ? ' <span style="color:var(--amber)">← 구글 시트 왼쪽 위 파일 이름을 "6학년 1반 줄넘기"처럼 바꿔 두세요</span>' : '');
  NAT.load().then(function(){   // 전국 현황판 참여 여부를 알고 나서 안내
  // 학교판·클럽판(스포츠클럽·도장) 껍데기가 바뀌어 붙어 있으면 알림 — 전국 현황판이 다른 리그로 가지 않게
  if (APP.shell.appUrl && /\/club\//.test(APP.shell.appUrl) !== APP.club) document.getElementById('shellNotice').innerHTML = (function(h){ const np = document.querySelector('.tab-pane[data-tab="national"] .card'); if (np) np.insertAdjacentHTML('afterbegin', h); return h; })('<div class="warn-box">' + (APP.club ? '이 시트에는 <b>학교용 껍데기</b>가 들어 있어요. 스포츠클럽·도장은 <b>클럽용 껍데기</b>를 붙여 넣고 새 버전으로 배포해 주세요. 그대로 두면 전국 현황판 기록이 학교 현황판으로 가요.' : '이 시트에는 <b>클럽용 껍데기</b>가 들어 있어요. 학교는 학교용 껍데기를 붙여 넣고 새 버전으로 배포해 주세요.') + '</div>');
  else if (APP.shell.shell >= APP.requiredShell && APP.shell.shell < 6) document.getElementById('shellNotice').innerHTML = '<div class="warn-box"' + (NAT.cfg && NAT.cfg.on && APP.shell.shell < 4 ? '' : ' style="background:var(--bg);"') + '>새 껍데기 <b>6판</b>이 나왔어요. <b>점프 Live (Lite)</b> — 바깥 서버 없이 학교 시트만으로 한 반이 함께 뛰고, 끝나고 한 번에 결과를 공개하는 수업 방을 열 수 있어요.' + (APP.shell.shell < 5 ? ' 5판부터는 스마트 줄넘기나 카메라 판정기로 뛰면 <b>한 번에 최고 연속</b>(걸리지 않고 이어 뛴 가장 많은 수)이 기록되고, 전국 현황판에도 올라가요.' : '') + (NAT.cfg && NAT.cfg.on && APP.shell.shell < 4 ? ' <b>전국 현황판에 참여 중이면 꼭 바꿔 주세요</b> — 4판부터는 전국 현황판 비밀 키를 학생 화면에 내보내지 않아요.' : '') + (APP.shell.shell < 3 ? ' 급수 인증도 3판부터 쓸 수 있어요.' : '') + (APP.shell.live ? ' 점프 라이브를 쓰는 학교는 <b>점프 라이브판 6판</b>으로 바꿔 주세요.' : '') + ' Shell(껍데기)를 다시 붙여 넣고 "새 버전"으로 배포하세요. 기록·학생·설정은 그대로예요.</div>';
  });
  if (APP.shell.shell < APP.requiredShell) document.getElementById('shellNotice').innerHTML = '<div class="warn-box">학교 껍데기(Shell.gs)를 새 판으로 바꿔야 하는 기능이 있어요. 관리자 메뉴 안내에 따라 Shell.gs 를 다시 붙여넣고 "새 버전"으로 배포해 주세요.</div>';
  fetch('changelog.json', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(list){
    if (!Array.isArray(list) || !list.length) throw new Error('내역이 비어 있어요');
    document.getElementById('changelogLatest').innerHTML = entry(list[0], true);
    const older = list.slice(1);
    document.getElementById('changelogOlder').innerHTML = older.length ? '<div class="cl-older-title">이전 업데이트 (' + older.length + ')</div>' + older.map(function(e){ return entry(e, false); }).join('') : '';
    let seen = ''; try { seen = localStorage.getItem('jr_seen_version') || ''; } catch (e) {}
    if (seen !== list[0].version) document.getElementById('updatesDot').style.display = '';
    document.querySelector('#adminNav button[data-tab="updates"]').addEventListener('click', function(){
      try { localStorage.setItem('jr_seen_version', list[0].version); } catch (e) {}
      document.getElementById('updatesDot').style.display = 'none';
    });
  }).catch(function(err){ document.getElementById('changelogLatest').innerHTML = '<p class="hint">업데이트 내역을 불러오지 못했습니다: ' + esc(err.message || err) + '</p>'; });
})();

}
};

</script>
</body>
</html>
